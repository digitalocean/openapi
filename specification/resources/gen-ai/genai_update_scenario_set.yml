description: To update a scenario set in place, send a PUT request to `/v2/gen-ai/scenario_sets/{scenario_set_uuid}`.
  Rename and/or replace contents via inline `scenarios`. Content replace keeps the
  same scenario_set_uuid, overwrites the Spaces JSONL, and is rejected when any simulation
  run references the set.
operationId: genai_update_scenario_set
parameters:
- description: |-
    UUID of the scenario set to update. Returned by `CreateScenarioSet`
    and listed via `ListScenarioSets`.
  example: '"123e4567-e89b-12d3-a456-426614174000"'
  in: path
  name: scenario_set_uuid
  required: true
  schema:
    type: string
requestBody:
  content:
    application/json:
      schema:
        $ref: ./definitions.yml#/apiUpdateScenarioSetInputPublic
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiUpdateScenarioSetOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:update
summary: Update Scenario Set
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_update_scenario_set.yml
