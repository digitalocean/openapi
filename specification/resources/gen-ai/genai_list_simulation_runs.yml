description: To list simulation runs, send a GET request to `/v2/gen-ai/simulation_runs`.
operationId: genai_list_simulation_runs
parameters:
- description: Optional filter by scenario set.
  example: 123e4567-e89b-12d3-a456-426614174000
  in: query
  name: scenario_set_uuid
  schema:
    type: string
- description: Page number.
  example: 1
  in: query
  name: page
  schema:
    type: integer
- description: Items per page.
  example: 1
  in: query
  name: per_page
  schema:
    type: integer
- description: |-
    Filter by one or more statuses. Empty means no status filter.

     - SIMULATION_RUN_STATUS_PENDING: Accepted and queued, not yet executing.
     - SIMULATION_RUN_STATUS_RUNNING: Journeys are executing.
     - SIMULATION_RUN_STATUS_SUCCEEDED: All journeys finished successfully.
     - SIMULATION_RUN_STATUS_FAILED: The run failed (e.g. Argo ActiveDeadlineSeconds / workflow timeout).
     - SIMULATION_RUN_STATUS_CANCELLED: The run was cancelled by the customer.
     - SIMULATION_RUN_STATUS_EVALUATING: Sim journeys finished; a reserved evaluation is running. Only reachable
    when the create request included evaluation_config. When the evaluation
    reaches a terminal status, its outcome is reflected in the simulation run
    status.
     - SIMULATION_RUN_STATUS_PARTIALLY_SUCCESSFUL: The simulation or its attached evaluation completed with a mixture of
    successful and failed results.
  example:
  - SIMULATION_RUN_STATUS_UNSPECIFIED
  in: query
  name: statuses
  schema:
    items:
      enum:
      - SIMULATION_RUN_STATUS_UNSPECIFIED
      - SIMULATION_RUN_STATUS_PENDING
      - SIMULATION_RUN_STATUS_RUNNING
      - SIMULATION_RUN_STATUS_SUCCEEDED
      - SIMULATION_RUN_STATUS_FAILED
      - SIMULATION_RUN_STATUS_CANCELLED
      - SIMULATION_RUN_STATUS_EVALUATING
      - SIMULATION_RUN_STATUS_PARTIALLY_SUCCESSFUL
      type: string
    type: array
- description: |-
    Free-text search across the run name and scenario set name
    (case-insensitive substring match). Empty means no search.
  example: example string
  in: query
  name: search
  schema:
    type: string
- description: |-
    Field to sort by. Defaults to creation date when unspecified.

     - SIMULATION_RUN_SORT_FIELD_CREATED_AT: Sort by creation date. Default.
     - SIMULATION_RUN_SORT_FIELD_NAME: Sort by customer-supplied run name (case-insensitive).
     - SIMULATION_RUN_SORT_FIELD_STATUS: Sort by status using lifecycle order (pending → running → terminal).
     - SIMULATION_RUN_SORT_FIELD_UPDATED_AT: Sort by last update date.
  example: SIMULATION_RUN_SORT_FIELD_UNSPECIFIED
  in: query
  name: sort_by
  schema:
    default: SIMULATION_RUN_SORT_FIELD_UNSPECIFIED
    enum:
    - SIMULATION_RUN_SORT_FIELD_UNSPECIFIED
    - SIMULATION_RUN_SORT_FIELD_CREATED_AT
    - SIMULATION_RUN_SORT_FIELD_NAME
    - SIMULATION_RUN_SORT_FIELD_STATUS
    - SIMULATION_RUN_SORT_FIELD_UPDATED_AT
    type: string
- description: Sort direction. Defaults to descending when unspecified.
  example: SORT_DIRECTION_UNSPECIFIED
  in: query
  name: sort_direction
  schema:
    default: SORT_DIRECTION_UNSPECIFIED
    enum:
    - SORT_DIRECTION_UNSPECIFIED
    - SORT_DIRECTION_ASC
    - SORT_DIRECTION_DESC
    type: string
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiListSimulationRunsOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:read
summary: List Simulation Runs
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_list_simulation_runs.yml
