description: To delete a scenario set, send a DELETE request to `/v2/gen-ai/scenario_sets/{scenario_set_uuid}`.
  A scenario set that is referenced by a simulation run cannot be deleted.
operationId: genai_delete_scenario_set
parameters:
- description: |-
    UUID of the scenario set to delete. Returned by `CreateScenarioSet`
    and listed via `ListScenarioSets`. A set still referenced by a
    simulation run cannot be deleted.
  example: '"123e4567-e89b-12d3-a456-426614174000"'
  in: path
  name: scenario_set_uuid
  required: true
  schema:
    type: string
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiDeleteScenarioSetOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:delete
summary: Delete Scenario Set
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_delete_scenario_set.yml
