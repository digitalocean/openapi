description: To cancel an in-progress simulation run, send a PATCH request to
  `/v2/gen-ai/simulation_runs/{run_uuid}/cancel`.
operationId: genai_patch_cancel_simulation_run
parameters:
- description: |-
    UUID of the simulation run to cancel. Returned by `CreateSimulationRun`
    and listed via `ListSimulationRuns`. The run must be in a non-terminal
    status; already-terminal runs return an error.
  example: '"123e4567-e89b-12d3-a456-426614174000"'
  in: path
  name: run_uuid
  required: true
  schema:
    type: string
requestBody:
  content:
    application/json:
      schema:
        $ref: ./definitions.yml#/apiCancelSimulationRunInputPublic
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiCancelSimulationRunOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:update
summary: Cancel Simulation Run
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_cancel_simulation_run.yml
