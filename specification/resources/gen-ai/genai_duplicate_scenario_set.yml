description: To duplicate a scenario set, send a POST request to `/v2/gen-ai/scenario_sets/{scenario_set_uuid}/duplicate`.
  The source set must be ready. The new set is named `{original name} duplicate`
  and contains a copy of the source scenarios.
operationId: genai_create_duplicate_scenario_set
parameters:
- description: UUID of the scenario set to duplicate.
  example: '"123e4567-e89b-12d3-a456-426614174000"'
  in: path
  name: scenario_set_uuid
  required: true
  schema:
    type: string
requestBody:
  content:
    application/json:
      schema:
        $ref: ./definitions.yml#/apiDuplicateScenarioSetInputPublic
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiDuplicateScenarioSetOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:create
summary: Duplicate Scenario Set
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_duplicate_scenario_set.yml
