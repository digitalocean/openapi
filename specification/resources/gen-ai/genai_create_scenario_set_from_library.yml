description: To create a scenario set from a Common Scenario & Goal Library entry,
  send a POST request to `/v2/gen-ai/scenario_library/{library_scenario_uuid}/create_scenario_set`.
  The library scenarios are copied into a new scenario set owned by the calling team,
  ready to be passed to Create Simulation Run.
operationId: genai_create_scenario_set_from_library
parameters:
- description: UUID of the library entry to materialize.
  example: '"123e4567-e89b-12d3-a456-426614174000"'
  in: path
  name: library_scenario_uuid
  required: true
  schema:
    type: string
requestBody:
  content:
    application/json:
      schema:
        $ref: ./definitions.yml#/apiCreateScenarioSetFromLibraryInputPublic
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiCreateScenarioSetFromLibraryOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:create
summary: Create Scenario Set From Library
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_create_scenario_set_from_library.yml
