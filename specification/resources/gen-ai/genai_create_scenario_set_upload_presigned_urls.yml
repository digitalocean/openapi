description: To create presigned URLs for uploading a scenario set file, send a POST
  request to `/v2/gen-ai/scenario_sets/file_upload_presigned_urls`. After uploading,
  pass the stored object in Create Scenario Set as `file_upload_scenario_set`.
operationId: genai_create_scenario_set_upload_presigned_urls
requestBody:
  content:
    application/json:
      schema:
        $ref: ./definitions.yml#/apiCreateScenarioSetUploadPresignedUrlsInputPublic
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiCreateDataSourceFileUploadPresignedUrlsOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:create
summary: Create Presigned URLs for Scenario Set File Upload
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_create_scenario_set_upload_presigned_urls.yml
