    -H "Content-Type: application/json"  \
    -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
    "https://api.digitalocean.com/v2/gen-ai/simulation_runs" \
    -d '{
      "name": "my-simulation-run",
      "scenario_set_uuid": "123e4567-e89b-12d3-a456-426614174000",
      "agent_config": {
        "agent_uuid": "223e4567-e89b-12d3-a456-426614174001",
        "name": "support-agent"
      },
      "evaluation_config": {
        "metric_uuids": [
          "323e4567-e89b-12d3-a456-426614174002"
        ],
        "star_metric": {
          "metric_uuid": "323e4567-e89b-12d3-a456-426614174002",
          "success_threshold": 80
        }
      }
    }'
