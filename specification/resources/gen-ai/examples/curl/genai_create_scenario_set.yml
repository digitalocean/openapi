lang: cURL
source: |-
  curl -X POST \
    -H "Content-Type: application/json"  \
    -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
    "https://api.digitalocean.com/v2/gen-ai/scenario_sets" \
    -d '{
      "name": "support-agent-scenarios",
      "scenarios": [
        {
          "name": "Refund request",
          "description": "The user wants a refund for a delayed order",
          "user_persona": "Frustrated customer",
          "stopping_criteria": ["Refund is approved or a next step is clearly offered"],
          "max_turns": 8
        }
      ]
    }'
