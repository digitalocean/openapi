description: To list the platform-curated Common Scenario & Goal Library, send a GET
  request to `/v2/gen-ai/scenario_library`.
operationId: genai_list_scenario_library
parameters:
- description: Page number.
  example: 1
  in: query
  name: page
  schema:
    type: integer
- description: Items per page.
  example: 1
  in: query
  name: per_page
  schema:
    type: integer
- description: Filter by category (exact match). Empty means no category filter.
  example: example string
  in: query
  name: category
  schema:
    type: string
- description: |-
    Free-text search across name, description, and goal_description
    (case-insensitive substring match). Empty means no search.
  example: example string
  in: query
  name: search
  schema:
    type: string
- description: |-
    Field to sort by. Defaults to name when unspecified.

     - SCENARIO_LIBRARY_SORT_FIELD_NAME: Sort by customer-facing name (case-insensitive). Default.
     - SCENARIO_LIBRARY_SORT_FIELD_CREATED_AT: Sort by creation date.
  example: SCENARIO_LIBRARY_SORT_FIELD_UNSPECIFIED
  in: query
  name: sort_by
  schema:
    default: SCENARIO_LIBRARY_SORT_FIELD_UNSPECIFIED
    enum:
    - SCENARIO_LIBRARY_SORT_FIELD_UNSPECIFIED
    - SCENARIO_LIBRARY_SORT_FIELD_NAME
    - SCENARIO_LIBRARY_SORT_FIELD_CREATED_AT
    type: string
- description: Sort direction. Defaults to ascending when unspecified.
  example: SORT_DIRECTION_UNSPECIFIED
  in: query
  name: sort_direction
  schema:
    default: SORT_DIRECTION_UNSPECIFIED
    enum:
    - SORT_DIRECTION_UNSPECIFIED
    - SORT_DIRECTION_ASC
    - SORT_DIRECTION_DESC
    type: string
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiListScenarioLibraryOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:read
summary: List Common Scenario & Goal Library
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_list_scenario_library.yml
