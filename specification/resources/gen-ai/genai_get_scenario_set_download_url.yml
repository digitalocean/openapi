description: To get a presigned download URL for a scenario set's canonical JSONL,
  send a GET request to `/v2/gen-ai/scenario_sets/{scenario_set_uuid}/download_url`.
operationId: genai_get_scenario_set_download_url
parameters:
- description: UUID of the scenario set.
  example: '"123e4567-e89b-12d3-a456-426614174000"'
  in: path
  name: scenario_set_uuid
  required: true
  schema:
    type: string
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiGetScenarioSetDownloadURLOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:read
summary: Get Download URL for Scenario Set
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_get_scenario_set_download_url.yml
