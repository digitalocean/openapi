description: |-
  Returns a V2 catalog card by catalog ID or model ID. Requires authentication.
  Visibility matches List Model Catalog V2.
operationId: genai_get_model_catalog_card_v2
parameters:
- description: Catalog ID of the model. Use `model_id` instead to look up by the inference model ID.
  example: 18bc9b8f-73c5-11f0-b074-4e013e2ddde4
  in: path
  name: id
  required: true
  schema:
    type: string
- description: Inference model ID, such as `llama3.1-70b-instruct`. Alternative to the catalog ID in the path.
  example: llama3.1-70b-instruct
  in: query
  name: model_id
  schema:
    type: string
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiGetModelCatalogCardV2Output
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:read
summary: Get Model Catalog Card V2
tags:
- Agent Platform API
x-codeSamples:
- $ref: examples/curl/genai_get_model_catalog_card_v2.yml
