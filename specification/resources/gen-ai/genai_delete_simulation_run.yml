description: To delete a simulation run, send a DELETE request to `/v2/gen-ai/simulation_runs/{run_uuid}`.
  For runs still in progress, cancel the run first, then retry the delete once
  the run reaches a terminal status.
operationId: genai_delete_simulation_run
parameters:
- description: |-
    UUID of the simulation run to delete. For runs still in progress, cancel
    the run first, then retry the delete once the run reaches a terminal
    status.
  example: '"123e4567-e89b-12d3-a456-426614174000"'
  in: path
  name: run_uuid
  required: true
  schema:
    type: string
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiDeleteSimulationRunOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:delete
summary: Delete Simulation Run
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_delete_simulation_run.yml
