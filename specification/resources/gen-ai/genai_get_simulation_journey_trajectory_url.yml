description: To get a presigned download URL for a journey's trajectory JSON, send
  a GET request to `/v2/gen-ai/simulation_runs/{run_uuid}/journeys/{journey_uuid}/trajectory_url`.
operationId: genai_get_simulation_journey_trajectory_url
parameters:
- description: UUID of the run the journey belongs to.
  example: '"123e4567-e89b-12d3-a456-426614174000"'
  in: path
  name: run_uuid
  required: true
  schema:
    type: string
- description: UUID of the journey.
  example: '"123e4567-e89b-12d3-a456-426614174000"'
  in: path
  name: journey_uuid
  required: true
  schema:
    type: string
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiGetSimulationJourneyTrajectoryURLOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:read
summary: Get Journey Trajectory Download URL
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_get_simulation_journey_trajectory_url.yml
