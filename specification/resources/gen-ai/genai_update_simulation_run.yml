description: To update a simulation run's display name, send a PUT request
  to `/v2/gen-ai/simulation_runs/{run_uuid}`. Only the name is mutable; run
  configuration and results are immutable.
operationId: genai_update_simulation_run
parameters:
- description: |-
    UUID of the simulation run to update. Returned by `CreateSimulationRun`
    and listed via `ListSimulationRuns`.
  example: '"123e4567-e89b-12d3-a456-426614174000"'
  in: path
  name: run_uuid
  required: true
  schema:
    type: string
requestBody:
  content:
    application/json:
      schema:
        $ref: ./definitions.yml#/apiUpdateSimulationRunInputPublic
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiUpdateSimulationRunOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:update
summary: Update Simulation Run
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_update_simulation_run.yml
