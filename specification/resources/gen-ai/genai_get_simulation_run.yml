description: To retrieve a simulation run, send a GET request to `/v2/gen-ai/simulation_runs/{run_uuid}`.
operationId: genai_get_simulation_run
parameters:
- description: UUID of the simulation run.
  example: '"123e4567-e89b-12d3-a456-426614174000"'
  in: path
  name: run_uuid
  required: true
  schema:
    type: string
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: ./definitions.yml#/apiGetSimulationRunOutput
    description: A successful response.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
- bearer_auth:
  - genai:read
summary: Retrieve Simulation Run
tags:
- GradientAI Platform
x-codeSamples:
- $ref: examples/curl/genai_get_simulation_run.yml
