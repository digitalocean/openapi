      description: Object storage bucket holding the trajectory JSON. Set when the
        journey finishes.
      example: example name
      type: string
    trajectory_bucket_region:
      description: Object storage bucket region for the trajectory JSON. Set when
        the journey finishes.
      example: example string
      type: string
    trajectory_spaces_key:
      description: Object storage key for the trajectory JSON. Set when the journey
        finishes.
      example: example string
      type: string
    updated_at:
      description: Time last updated at.
      example: "2023-01-01T00:00:00Z"
