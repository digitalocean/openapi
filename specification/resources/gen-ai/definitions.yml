     - RELEASE_STATUS_DEPLOYING: the release is currently being deployed
     - RELEASE_STATUS_RUNNING: the release is successfully deployed and running
     - RELEASE_STATUS_FAILED: the release deployment failed
     - RELEASE_STATUS_WAITING_FOR_UNDEPLOYMENT: the release is waiting to be undeployed/removed
