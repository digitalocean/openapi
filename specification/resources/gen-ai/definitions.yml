    model_evaluation_run linked to this simulation run and dispatches the
    evaluation automatically after the simulation finishes. The evaluation
    reuses the simulation run's judge_model_uuid.
  properties:
    metric_uuids:
      description: |-
        Evaluation metric UUIDs (from the evaluation metrics catalog). Must be
        simulation-eligible (multi-turn) metrics; the create request is rejected
