    Breakdown of journey outcomes by judge verdict. Reused wherever a
    success / failure / inconclusive tally is reported (run row, result summary,
    per-scenario rollup).
  properties:
    failure_count:
      description: Number of journeys with a FAILURE verdict.
      example: 123
      format: int64
      type: integer
    inconclusive_count:
      description: Number of journeys with an INCONCLUSIVE verdict.
      example: 123
      format: int64
      type: integer
    success_count:
      description: Number of journeys with a SUCCESS verdict.
      example: 123
      format: int64
      type: integer
  type: object
apiSimulationJourneySortField:
  default: SIMULATION_JOURNEY_SORT_FIELD_UNSPECIFIED
  description: |-
    Sortable fields for listing simulation journeys.

     - SIMULATION_JOURNEY_SORT_FIELD_SCENARIO: Sort by scenario_uuid then journey_index. Default.
     - SIMULATION_JOURNEY_SORT_FIELD_CREATED_AT: Sort by creation date.
     - SIMULATION_JOURNEY_SORT_FIELD_STATUS: Sort by journey status using lifecycle order.
     - SIMULATION_JOURNEY_SORT_FIELD_VERDICT: Sort by verdict (nulls last).
  enum:
  - SIMULATION_JOURNEY_SORT_FIELD_UNSPECIFIED
  - SIMULATION_JOURNEY_SORT_FIELD_SCENARIO
  - SIMULATION_JOURNEY_SORT_FIELD_CREATED_AT
  - SIMULATION_JOURNEY_SORT_FIELD_STATUS
  - SIMULATION_JOURNEY_SORT_FIELD_VERDICT
  example: SIMULATION_JOURNEY_SORT_FIELD_UNSPECIFIED
  type: string
apiSimulationJourneyStatus:
  default: SIMULATION_JOURNEY_STATUS_UNSPECIFIED
  description: |-
    Lifecycle status of a single journey.

     - SIMULATION_JOURNEY_STATUS_RUNNING: The journey is executing and a trajectory is available to retrieve.
     - SIMULATION_JOURNEY_STATUS_FINISHED: The journey reached a stop condition and produced a verdict.
     - SIMULATION_JOURNEY_STATUS_FAILED: The journey failed because of a cancel, timeout, or error.
     - SIMULATION_JOURNEY_STATUS_PREPARING: The journey is allocated but its trajectory is not available yet.
  enum:
  - SIMULATION_JOURNEY_STATUS_UNSPECIFIED
  - SIMULATION_JOURNEY_STATUS_RUNNING
  - SIMULATION_JOURNEY_STATUS_FINISHED
  - SIMULATION_JOURNEY_STATUS_FAILED
  - SIMULATION_JOURNEY_STATUS_PREPARING
  example: SIMULATION_JOURNEY_STATUS_UNSPECIFIED
  type: string
apiSimulationJourneyVerdict:
  default: SIMULATION_JOURNEY_VERDICT_UNSPECIFIED
  description: |-
    The judge's verdict for a journey.

     - SIMULATION_JOURNEY_VERDICT_SUCCESS: The candidate agent satisfied the scenario's stopping criteria.
     - SIMULATION_JOURNEY_VERDICT_FAILURE: The candidate agent did not satisfy the stopping criteria.
     - SIMULATION_JOURNEY_VERDICT_INCONCLUSIVE: No conclusive verdict (e.g. max_turns reached without the judge finishing).
  enum:
  - SIMULATION_JOURNEY_VERDICT_UNSPECIFIED
  - SIMULATION_JOURNEY_VERDICT_SUCCESS
  - SIMULATION_JOURNEY_VERDICT_FAILURE
  - SIMULATION_JOURNEY_VERDICT_INCONCLUSIVE
  example: SIMULATION_JOURNEY_VERDICT_UNSPECIFIED
  type: string
apiSimulationRun:
