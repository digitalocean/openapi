        Number of times each dataset row is evaluated (n-pass/epochs). 1 by
        default. Drives the avg@k/pass@k/cons@k aggregation in result_summary.
      example: 1
      format: int64
      type: integer
    error_description:
      description: Error description if the run failed or partially succeeded.
