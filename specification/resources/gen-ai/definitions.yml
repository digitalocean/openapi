      type: integer
    journey_uuid:
      description: UUID of the journey.
      example: 123e4567-e89b-12d3-a456-426614174000
      type: string
    judge_reasoning:
      description: Optional judge reasoning for the verdict.
      example: example string
      type: string
    run_uuid:
      description: UUID of the run this journey belongs to.
      example: 123e4567-e89b-12d3-a456-426614174000
      type: string
    scenario_uuid:
      description: UUID of the scenario this journey executed.
      example: 123e4567-e89b-12d3-a456-426614174000
      type: string
    session_id:
      description: Session identifier for this journey.
      example: 123e4567-e89b-12d3-a456-426614174000
      type: string
    status:
      $ref: '#/apiSimulationJourneyStatus'
    token_usage:
      $ref: '#/apiSimulationTokenUsage'
