    candidate_model_uuid:
      description: Candidate model being evaluated.
      example: 123e4567-e89b-12d3-a456-426614174000
      type: string
    completed_at:
      example: "2023-01-01T00:00:00Z"
      format: date-time
      type: string
    created_at:
      example: "2023-01-01T00:00:00Z"
      format: date-time
      type: string
    dataset_name:
      example: example name
      type: string
    dataset_uuid:
