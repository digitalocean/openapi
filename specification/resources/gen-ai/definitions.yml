    exploration_budget:
      description: Optional run-level journeys-per-scenario override. When set, overrides
        each scenario's exploration_budget.
      example: 123
      format: int64
      type: integer
    failure_reason:
      description: Human-readable explanation of a terminal FAILED status. Empty otherwise.
      example: example string
      type: string
    journeys_finished:
      description: Number of journeys that have finished (successfully or not).
      example: 123
      format: int64
      type: integer
    judge_model_name:
      description: Display name of the judge model (from the model catalog).
      example: example name
      type: string
    judge_model_uuid:
      description: Model used by the judge.
      example: 123e4567-e89b-12d3-a456-426614174000
      type: string
    max_turns:
      description: Optional run-level turn budget. When set, overrides each scenario's
        max_turns.
      example: 123
      format: int64
      type: integer
    name:
      description: Optional run name.
      example: example name
      type: string
    result_summary:
      $ref: '#/apiSimulationRunResultSummary'
    run_uuid:
      description: UUID of the run.
      example: 123e4567-e89b-12d3-a456-426614174000
      type: string
    scenario_count:
      description: Number of scenarios in the scenario set for this run.
      example: 123
      format: int64
      type: integer
    scenario_set_uuid:
      description: UUID of the scenario set being executed (must exist at run create).
      example: 123e4567-e89b-12d3-a456-426614174000
      type: string
    status:
      $ref: '#/apiSimulationRunStatus'
    total_journeys:
      description: Total number of journeys (sum of exploration budgets).
      example: 123
      format: int64
      type: integer
    updated_at:
      description: Time last updated at.
      example: "2023-01-01T00:00:00Z"
      format: date-time
      type: string
    user_simulator_config:
      description: Optional user simulator model settings such as temperature and
        max_tokens.
