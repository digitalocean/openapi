      example: "2023-01-01T00:00:00Z"
      format: date-time
      type: string
    duration_sec:
      description: Wall-clock time taken for the journey to complete, in seconds.
      example: "12345"
      format: uint64
      type: string
    failure_reason:
      description: Human-readable explanation of a terminal FAILED status. Empty otherwise.
      example: example string
      type: string
    journey_index:
      description: Zero-based index of this journey within its scenario's exploration
        budget.
      example: 123
