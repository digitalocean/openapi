operationId: vpcSubnets_update

summary: Update a VPC Subnet

description: |
  To update the name of a specific subnet within a VPC, send a PATCH request
  to `/v2/vpcs/$VPC_UUID/subnets/$SUBNET_UUID`.

tags:
  - VPC Subnets [Public Preview]

parameters:
  - $ref: 'parameters.yml#/vpc_uuid'
  - $ref: 'parameters.yml#/subnet_uuid'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/vpc_subnet.yml#/vpc_subnet_update'

responses:
  '200':
    $ref: 'responses/vpc_subnets.yml#/single_vpc_subnet'
  '401':
    $ref: '../../shared/responses/unauthorized.yml'
  '404':
    $ref: '../../shared/responses/not_found.yml'
  '429':
    $ref: '../../shared/responses/too_many_requests.yml'
  '500':
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl.yml#/update'

security:
  - bearer_auth:
      - 'vpc:update'
