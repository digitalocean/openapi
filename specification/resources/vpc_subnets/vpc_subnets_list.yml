operationId: vpcSubnets_list

summary: List VPC Subnets

description: |
  To list all subnets within a VPC, send a GET request to
  `/v2/vpcs/$VPC_UUID/subnets`.

tags:
  - VPC Subnets

parameters:
  - $ref: 'parameters.yml#/vpc_uuid'
  - $ref: '../../shared/parameters.yml#/per_page'
  - $ref: '../../shared/parameters.yml#/page'

responses:
  '200':
    $ref: 'responses/vpc_subnets.yml#/all_vpc_subnets'
  '401':
    $ref: '../../shared/responses/unauthorized.yml'
  '404':
    $ref: '../../shared/responses/not_found.yml'
  '429':
    $ref: '../../shared/responses/too_many_requests.yml'
  '500':
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl.yml#/list'

security:
  - bearer_auth:
      - 'vpc:read'
