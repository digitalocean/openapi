operationId: vpcSubnets_delete

summary: Delete a VPC Subnet

description: |
  To delete a specific subnet from a VPC, send a DELETE request to
  `/v2/vpcs/$VPC_UUID/subnets/$SUBNET_UUID`. A successful request returns a
  204 status code with no response body.

tags:
  - VPC Subnets

parameters:
  - $ref: 'parameters.yml#/vpc_uuid'
  - $ref: 'parameters.yml#/subnet_uuid'

responses:
  '204':
    $ref: '../../shared/responses/no_content.yml'
  '401':
    $ref: '../../shared/responses/unauthorized.yml'
  '404':
    $ref: '../../shared/responses/not_found.yml'
  '429':
    $ref: '../../shared/responses/too_many_requests.yml'
  '500':
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl.yml#/delete'

security:
  - bearer_auth:
      - 'vpc:delete'
      - 'vpc:update'
