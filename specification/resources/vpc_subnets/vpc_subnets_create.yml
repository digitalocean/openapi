operationId: vpcSubnets_create

summary: Create a VPC Subnet

description: |
  To create a subnet within a VPC, send a POST request to
  `/v2/vpcs/$VPC_UUID/subnets` with a name and, optionally, an IP range.

tags:
  - VPC Subnets

parameters:
  - $ref: 'parameters.yml#/vpc_uuid'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/vpc_subnet.yml#/vpc_subnet_create'

responses:
  '201':
    $ref: 'responses/vpc_subnets.yml#/single_vpc_subnet'
  '401':
    $ref: '../../shared/responses/unauthorized.yml'
  '404':
    $ref: '../../shared/responses/not_found.yml'
  '429':
    $ref: '../../shared/responses/too_many_requests.yml'
  '500':
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl.yml#/create'

security:
  - bearer_auth:
      - 'vpc:create'
      - 'vpc:update'
