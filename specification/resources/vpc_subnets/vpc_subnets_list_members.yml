operationId: vpcSubnets_list_members

summary: List the Member Resources of a VPC Subnet

description: |
  To list all resources that are members of a VPC subnet, send a GET request to
  `/v2/vpcs/$VPC_UUID/subnets/$SUBNET_UUID/members`.

  To list only members of a specific type, include the `resource_type` query
  parameter. Only resources that you are authorized to view are returned. For
  example, viewing Droplets requires the `droplet:read` scope.

tags:
  - VPC Subnets [Public Preview]

parameters:
  - $ref: 'parameters.yml#/vpc_uuid'
  - $ref: 'parameters.yml#/subnet_uuid'
  - $ref: 'parameters.yml#/resource_type'
  - $ref: '../../shared/parameters.yml#/per_page'
  - $ref: '../../shared/parameters.yml#/page'

responses:
  '200':
    $ref: 'responses/vpc_subnet_members.yml'
  '401':
    $ref: '../../shared/responses/unauthorized.yml'
  '404':
    $ref: '../../shared/responses/not_found.yml'
  '429':
    $ref: '../../shared/responses/too_many_requests.yml'
  '500':
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl.yml#/list_members'

security:
  - bearer_auth:
      - 'vpc:read'
