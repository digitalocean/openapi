operationId: sandboxes_post_pause

summary: Pause a Sandbox

description: |
  Pause a running sandbox. Resume it to use it again. An ephemeral sandbox
  cannot be paused.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'

responses:
  '200':
    $ref: 'responses/sandbox.yml'

  '400':
    description: The sandbox cannot be paused in its current state.
    headers:
      ratelimit-limit:
        $ref: '../../shared/headers.yml#/ratelimit-limit'
      ratelimit-remaining:
        $ref: '../../shared/headers.yml#/ratelimit-remaining'
      ratelimit-reset:
        $ref: '../../shared/headers.yml#/ratelimit-reset'
    content:
      application/json:
        schema:
          $ref: 'models/error.yml'
        example:
          id: bad_request
          message: The sandbox cannot be paused in its current state.
          request_id: 4851a473-1621-42ea-b2f9-5071c0ea8414

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_pause.yml'

security:
  - bearer_auth:
      - 'sandbox:update'
