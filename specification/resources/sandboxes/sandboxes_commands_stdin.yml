operationId: sandboxes_post_commands_stdin

summary: Write Sandbox Command Stdin

description: |
  Write stdin to a command started with `stdin=true`. Set `eof` to close.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'
  - $ref: 'parameters.yml#/pid'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/sandbox_command_stdin.yml'
      examples:
        Write And Close:
          value:
            data: aGVsbG8K
            eof: true

responses:
  '200':
    $ref: 'responses/sandbox_command_stdin_written.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_commands_stdin.yml'

security:
  - bearer_auth:
      - 'sandbox:update'
