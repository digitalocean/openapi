operationId: sandboxes_get_file_info

summary: Retrieve File Information

description: |
  Retrieve the name, type, size, mode, owner, and modification time of a file,
  directory, or symlink in the sandbox. When the path is a symlink,
  `symlink_target` is where it points. A missing path answers `404`; to test
  for a path without an error, use the exists route.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'
  - $ref: 'parameters.yml#/file_path'

responses:
  '200':
    $ref: 'responses/file_info.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '409':
    $ref: 'responses/errors.yml#/conflict'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_files_info.yml'

security:
  - bearer_auth:
      - 'sandbox:read'
