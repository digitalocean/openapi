operationId: sandboxes_get_files_exists

summary: Check That a File Exists

description: |
  Check whether a file, directory, or symlink exists at a path in the sandbox.
  A missing path answers `200` with `exists` false; `404` means the sandbox
  was not found. A false `exists` is omitted from the JSON body, so `{}`
  means the path does not exist.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'
  - $ref: 'parameters.yml#/file_path'

responses:
  '200':
    $ref: 'responses/file_exists.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '409':
    $ref: 'responses/errors.yml#/conflict'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_files_exists.yml'

security:
  - bearer_auth:
      - 'sandbox:read'
