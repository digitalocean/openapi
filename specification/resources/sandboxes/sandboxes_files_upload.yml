operationId: sandboxes_post_files_upload

summary: Upload a File

description: |
  Write the raw request body (`Content-Type: application/octet-stream`) to a
  path in the sandbox, up to 50 MiB.

  Query parameters: `path` (required) is where to write the file; with
  `is_archive`, the directory to extract into. `is_archive` means the body is
  a tar archive to extract at `path`.

  The optional `X-Content-Sha256` request header carries the lowercase hex
  SHA-256 of the body; the sandbox checks it after the write. Concurrent
  direct transfers are limited; over the limit the request answers `503`.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'
  - $ref: 'parameters.yml#/file_path'
  - $ref: 'parameters.yml#/is_archive'
  - $ref: 'parameters.yml#/x_content_sha256'

requestBody:
  description: The raw file content, or a tar archive when `is_archive` is true.
  required: true
  content:
    application/octet-stream:
      schema:
        type: string
        format: binary

responses:
  '200':
    $ref: 'responses/file_uploaded.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '409':
    $ref: 'responses/errors.yml#/conflict'

  '413':
    $ref: 'responses/errors.yml#/payload_too_large'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  '503':
    $ref: 'responses/errors.yml#/service_unavailable'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_files_upload.yml'

security:
  - bearer_auth:
      - 'sandbox:update'
