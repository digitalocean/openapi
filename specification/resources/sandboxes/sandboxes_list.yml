operationId: sandboxes_list

summary: List Sandboxes

description: |
  List the sandboxes of your team. When more results exist, the response
  carries a token for the next page.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/page_size'
  - $ref: 'parameters.yml#/page_token'
  - $ref: 'parameters.yml#/state'

responses:
  '200':
    $ref: 'responses/all_sandboxes.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_list.yml'

security:
  - bearer_auth:
      - 'sandbox:read'
