operationId: sandboxes_list_templates

summary: List Templates

description: |
  List your team's custom templates. Global base templates are not included;
  pass them by name on sandbox create.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/page_size'
  - $ref: 'parameters.yml#/page_token'

responses:
  '200':
    $ref: 'responses/all_templates.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_templates_list.yml'

security:
  - bearer_auth:
      - 'sandbox_templates:read'
