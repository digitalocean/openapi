operationId: sandboxes_get_commands_stream

summary: Attach to a Sandbox Command

description: |
  Stream output from a running command by `pid`. Unknown or exited pids return
  `404`. Each streamed chunk is a JSON object with either `result` (a command
  event) or `error` (a stream transport error).

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'
  - $ref: 'parameters.yml#/pid'

responses:
  '200':
    $ref: 'responses/sandbox_command_stream.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_commands_attach.yml'

security:
  - bearer_auth:
      - 'sandbox:read'
