operationId: sandboxes_get_snapshot

summary: Retrieve a Snapshot

description: |
  Retrieve a snapshot by its ID. Use it to poll a snapshot until it is
  `COMPLETE`. The snapshot must belong to your team.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/snapshot_id'

responses:
  '200':
    $ref: 'responses/snapshot.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_snapshots_get.yml'

security:
  - bearer_auth:
      - 'sandbox:read'
