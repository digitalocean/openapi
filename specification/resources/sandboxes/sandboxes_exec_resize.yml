operationId: sandboxes_post_exec_resize

summary: Resize a Sandbox Exec PTY

description: |
  Change the window size of a PTY exec. `rows` and `cols` must be between 1
  and 1000. Returns `409` when the exec is not a PTY.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'
  - $ref: 'parameters.yml#/exec_id'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/sandbox_exec_resize.yml'
      examples:
        Resize:
          value:
            rows: 40
            cols: 120

responses:
  '200':
    $ref: 'responses/sandbox_exec_resized.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '409':
    $ref: 'responses/errors.yml#/conflict'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_exec_resize.yml'

security:
  - bearer_auth:
      - 'sandbox:update'
