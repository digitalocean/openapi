operationId: sandboxes_delete_snapshot

summary: Delete a Snapshot

description: |
  Delete a snapshot. Sandboxes already started from it are not affected.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/snapshot_id'

responses:
  '200':
    $ref: 'responses/deleted.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_snapshots_delete.yml'

security:
  - bearer_auth:
      - 'sandbox:update'
