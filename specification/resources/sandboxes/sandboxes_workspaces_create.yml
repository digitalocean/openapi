operationId: sandboxes_create_workspace

summary: Create a Workspace

description: |
  Create a persistent workspace of the given size. A workspace is a durable
  disk that outlives any one sandbox. Attach it to a sandbox by passing its ID
  as `workspace_id` when you create the sandbox.

tags:
  - Sandboxes

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/workspace_create.yml'
      examples:
        Create Workspace:
          value:
            name: my-workspace
            size_limit_gib: 10

responses:
  '201':
    $ref: 'responses/workspace_created.yml'

  '200':
    $ref: 'responses/workspace.yml'

  '400':
    description: The body is not valid JSON, or it contains an unknown field.
    headers:
      ratelimit-limit:
        $ref: '../../shared/headers.yml#/ratelimit-limit'
      ratelimit-remaining:
        $ref: '../../shared/headers.yml#/ratelimit-remaining'
      ratelimit-reset:
        $ref: '../../shared/headers.yml#/ratelimit-reset'
    content:
      application/json:
        schema:
          $ref: 'models/error.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '409':
    $ref: 'responses/errors.yml#/conflict'

  '422':
    $ref: 'responses/errors.yml#/unprocessable_entity'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_workspaces_create.yml'

security:
  - bearer_auth:
      - 'sandbox_workspaces:create'
