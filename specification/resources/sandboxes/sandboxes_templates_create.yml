operationId: sandboxes_create_template

summary: Create a Template

description: |
  Create a team custom template by rebasing a customer OCI image onto an
  accepted base template. Kicks an asynchronous build; poll get template /
  list template builds. CPU and memory are chosen at sandbox create via
  `size_slug`, not at build time. There is no fluent build-step DSL or
  Dockerfile API.

tags:
  - Sandboxes

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/template_create.yml'
      examples:
        Create Template:
          value:
            name: my-custom-template
            base_template: coding-base
            source_oci_ref: registry.digitalocean.com/my-team/my-image:v1

responses:
  '201':
    $ref: 'responses/template_created.yml'

  '200':
    $ref: 'responses/template.yml'

  '400':
    description: The body is not valid JSON, or it contains an unknown field.
    headers:
      ratelimit-limit:
        $ref: '../../shared/headers.yml#/ratelimit-limit'
      ratelimit-remaining:
        $ref: '../../shared/headers.yml#/ratelimit-remaining'
      ratelimit-reset:
        $ref: '../../shared/headers.yml#/ratelimit-reset'
    content:
      application/json:
        schema:
          $ref: 'models/error.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '409':
    $ref: 'responses/errors.yml#/conflict'

  '422':
    $ref: 'responses/errors.yml#/unprocessable_entity'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_templates_create.yml'

security:
  - bearer_auth:
      - 'sandbox_templates:create'
