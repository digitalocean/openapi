sandbox_id:
  in: path
  name: sandbox_id
  description: The unique ID of the sandbox.
  required: true
  schema:
    type: string
  example: 01a0ef1a-d873-793d-ae6a-5dd6239be62a

page_size:
  in: query
  name: page_size
  required: false
  description: The maximum number of sandboxes to return.
  schema:
    type: integer
    format: int32
    example: 50
  example: 50

page_token:
  in: query
  name: page_token
  required: false
  description: The `next_page_token` of the previous page. Empty starts from the beginning.
  schema:
    type: string
    example: ''
  example: ''

state:
  in: query
  name: state
  required: false
  description: >-
    Return only sandboxes in this state. When unset, return sandboxes in any
    state.
  schema:
    $ref: 'models/sandbox_state.yml'
  example: SANDBOX_STATE_RUNNING

pid:
  in: path
  name: pid
  description: The process ID of the command in the sandbox.
  required: true
  schema:
    type: integer
    format: int64
  example: 42

template_id:
  in: path
  name: template_id
  description: The unique ID of the template.
  required: true
  schema:
    type: string
  example: 11111111-2222-4333-8444-555555555555

build_id:
  in: path
  name: build_id
  description: The unique ID of the template build.
  required: true
  schema:
    type: string
  example: 22222222-3333-4444-8555-666666666666

snapshot_id:
  in: path
  name: snapshot_id
  description: The ID of the snapshot.
  required: true
  schema:
    type: string
  example: 33333333-4444-4555-8666-777777777777

filter_sandbox_id:
  in: query
  name: sandbox_id
  required: false
  description: >-
    Return only the snapshots of this sandbox. When unset, return every
    snapshot of your team.
  schema:
    type: string
  example: 01a0ef1a-d873-793d-ae6a-5dd6239be62a
