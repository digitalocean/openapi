operationId: sandboxes_list_files

summary: List Files in a Directory

description: |
  List the files, directories, and symlinks in a directory of the sandbox.
  `depth` sets how many levels to list: `1`, the default, lists the
  directory's own entries; `2` also lists the entries of its subdirectories,
  and so on. Symlinks inside the directory are listed, not followed.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'
  - $ref: 'parameters.yml#/file_path'
  - $ref: 'parameters.yml#/list_depth'

responses:
  '200':
    $ref: 'responses/file_list.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '409':
    $ref: 'responses/errors.yml#/conflict'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_files_list.yml'

security:
  - bearer_auth:
      - 'sandbox:read'
