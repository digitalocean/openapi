operationId: sandboxes_create_command

summary: Start a Sandbox Command

description: |
  Start a command and return its `pid`. The process keeps running after this
  call returns. Use the attach stream to read output.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/sandbox_command_start.yml'
      examples:
        Start Bash:
          value:
            cmd: bash
            args:
              - "-lc"
              - "echo hello"
            cwd: /workspace

responses:
  '200':
    $ref: 'responses/sandbox_command_started.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_commands_start.yml'

security:
  - bearer_auth:
      - 'sandbox:update'
