operationId: sandboxes_list_workspaces

summary: List Workspaces

description: |
  List your team's persistent workspaces, optionally filtered by state.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/page_size'
  - $ref: 'parameters.yml#/page_token'
  - $ref: 'parameters.yml#/workspace_state'

responses:
  '200':
    $ref: 'responses/all_workspaces.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_workspaces_list.yml'

security:
  - bearer_auth:
      - 'sandbox_workspaces:read'
