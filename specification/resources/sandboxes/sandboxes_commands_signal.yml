operationId: sandboxes_post_commands_signal

summary: Signal a Sandbox Command

description: |
  Send `SIGTERM` or `SIGKILL` by `pid`. Defaults to `SIGTERM`.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'
  - $ref: 'parameters.yml#/pid'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/sandbox_command_signal_request.yml'
      examples:
        SIGTERM:
          value:
            signal: SANDBOX_COMMAND_SIGNAL_SIGTERM

responses:
  '200':
    $ref: 'responses/deleted.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_commands_signal.yml'

security:
  - bearer_auth:
      - 'sandbox:update'
