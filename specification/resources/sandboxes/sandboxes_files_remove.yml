operationId: sandboxes_post_files_remove

summary: Remove a File

description: |
  Remove a file from the sandbox, or a directory with everything in it.
  Removing a path that does not exist succeeds and changes nothing.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/file_remove.yml'
      examples:
        Remove File:
          value:
            path: /workspace/old.txt

responses:
  '200':
    $ref: 'responses/file_removed.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '409':
    $ref: 'responses/errors.yml#/conflict'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_files_remove.yml'

security:
  - bearer_auth:
      - 'sandbox:update'
