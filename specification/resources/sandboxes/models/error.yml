type: object

description: >
  A DigitalOcean API error body. The gateway builds this from the request
  status: `id` from the error class, `message` from the status message, and
  `request_id` when present.

properties:
  id:
    type: string
    description: A short, stable ID for the error, for example `not_found`.
    example: not_found

  message:
    type: string
    description: A message that explains the error.
    example: sandbox not found

  request_id:
    type: string
    description: The ID of the request. Give it to support when you report a problem.
    example: 11111111-1111-4111-8111-111111111111
