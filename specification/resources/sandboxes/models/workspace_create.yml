type: object

description: The body of a create-workspace request.

required:
  - size_limit_gib

properties:
  name:
    type: string
    description: An optional label for the workspace.
    example: my-workspace

  size_limit_gib:
    type: integer
    format: int64
    minimum: 1
    maximum: 100
    description: The size limit of the workspace, in GiB. At most 100.
    example: 10
