type: string

description: The status of a single rebase build.

enum:
  - TEMPLATE_BUILD_STATUS_UNSPECIFIED
  - TEMPLATE_BUILD_STATUS_PENDING
  - TEMPLATE_BUILD_STATUS_BUILDING
  - TEMPLATE_BUILD_STATUS_SUCCEEDED
  - TEMPLATE_BUILD_STATUS_FAILED

default: TEMPLATE_BUILD_STATUS_UNSPECIFIED

example: TEMPLATE_BUILD_STATUS_SUCCEEDED
