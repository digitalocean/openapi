description: >-
  The template was accepted and a build was started. `Location` may be set to
  the new template.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'
  Location:
    description: The URL of the newly created template.
    schema:
      type: string
    example: /v2/sandboxes/templates/11111111-2222-4333-8444-555555555555

content:
  application/json:
    schema:
      type: object
      properties:
        template:
          $ref: '../models/template.yml'
    examples:
      Created Template:
        value:
          template:
            template_id: 11111111-2222-4333-8444-555555555555
            name: my-custom-template
            status: TEMPLATE_STATUS_PENDING
            spec:
              base_template: coding-base
              image:
                registry: registry.digitalocean.com
                repository: my-team/my-image
                tag: v1
            created_at: "2026-11-20T12:00:00Z"
            updated_at: "2026-11-20T12:00:00Z"
