description: >-
  A streaming response of command events. Each chunk is a JSON object with
  either `result` (a sandbox command event) or `error` (a stream transport
  error), matching the grpc-gateway stream envelope.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      type: object
      properties:
        result:
          $ref: '../models/sandbox_command_event.yml'
        error:
          $ref: '../models/stream_error.yml'
    examples:
      Started Event:
        value:
          result:
            started:
              pid: 42
      Stdout Event:
        value:
          result:
            stdout: aGVsbG8K
