description: >-
  A streaming response of exec events. Each chunk is a JSON object with either
  `result` (an exec event) or `error` (a stream transport error), matching the
  grpc-gateway stream envelope.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      type: object
      properties:
        result:
          $ref: '../models/sandbox_exec_event.yml'
        error:
          $ref: '../models/stream_error.yml'
    examples:
      Started Event:
        value:
          result:
            started:
              exec_id: 01a0ef1a-d873-793d-ae6a-5dd6239be62a
      Stdout Event:
        value:
          result:
            stdout: aGVsbG8K
