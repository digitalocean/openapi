description: Stdin bytes were accepted.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      type: object
      properties:
        offset:
          type: string
          format: int64
          description: >-
            Bytes the guest has accepted after this write. Encoded as a string
            per protobuf JSON.
          example: "6"
    examples:
      Stdin Written:
        value:
          offset: "6"
