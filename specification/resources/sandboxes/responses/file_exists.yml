description: >-
  Whether the path exists. A missing path answers `200` with `exists` false
  (omitted from the JSON body, so `{}` means the path does not exist). `404`
  means the sandbox was not found.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      type: object
      properties:
        exists:
          type: boolean
          description: >-
            True when a file, directory, or symlink exists at `path`. Omitted
            when false.
          example: true
    examples:
      Exists:
        value:
          exists: true
      Missing:
        value: {}
