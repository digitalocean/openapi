description: >-
  The sandbox was created and is running. `Location` is set to the new sandbox.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'
  Location:
    description: The URL of the newly created sandbox.
    schema:
      type: string
    example: /v2/sandboxes/01a0ef1a-d873-793d-ae6a-5dd6239be62a

content:
  application/json:
    schema:
      type: object
      properties:
        sandbox:
          $ref: '../models/sandbox_info.yml'
    examples:
      Created Sandbox:
        value:
          sandbox:
            sandbox_id: 01a0ef1a-d873-793d-ae6a-5dd6239be62a
            template: base
            state: SANDBOX_STATE_RUNNING
            size_slug: s-1vcpu-2gb
            created_at: "2026-11-20T12:00:00Z"
