description: >-
  The workspace was created. `Location` may be set to the new workspace.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'
  Location:
    description: The URL of the newly created workspace.
    schema:
      type: string
    example: /v2/sandboxes/workspaces/44444444-5555-4666-8777-888888888888

content:
  application/json:
    schema:
      type: object
      properties:
        workspace:
          $ref: '../models/workspace.yml'
    examples:
      Created Workspace:
        value:
          workspace:
            workspace_id: 44444444-5555-4666-8777-888888888888
            name: my-workspace
            size_limit_gib: 10
            state: WORKSPACE_STATE_CREATING
            bytes_used: "0"
            created_at: "2026-11-20T12:00:00Z"
