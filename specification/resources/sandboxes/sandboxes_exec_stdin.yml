operationId: sandboxes_post_exec_stdin

summary: Write Sandbox Exec Stdin

description: |
  Write stdin bytes to a running exec. `offset` is the number of bytes the
  guest has already accepted. `eof` closes stdin on a pipe exec; on a PTY it
  sends VEOF (`0x04`).

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'
  - $ref: 'parameters.yml#/exec_id'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/sandbox_exec_stdin.yml'
      examples:
        Write And Close:
          value:
            data: aGVsbG8K
            offset: "0"
            eof: true

responses:
  '200':
    $ref: 'responses/sandbox_exec_stdin_written.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '409':
    $ref: 'responses/errors.yml#/conflict'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_exec_stdin.yml'

security:
  - bearer_auth:
      - 'sandbox:update'
