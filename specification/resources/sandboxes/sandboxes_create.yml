operationId: sandboxes_create

summary: Create a Sandbox

description: |
  Create a sandbox from a template. A successful create responds `201 Created`,
  with `Location` set to the new sandbox.

tags:
  - Sandboxes

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/sandbox_create.yml'
      examples:
        Create Sandbox:
          value:
            template: base
            size_slug: s-1vcpu-2gb
            allow_internet_access: true

responses:
  '201':
    $ref: 'responses/sandbox_created.yml'

  '400':
    description: The body is not valid JSON, or it contains an unknown field.
    headers:
      ratelimit-limit:
        $ref: '../../shared/headers.yml#/ratelimit-limit'
      ratelimit-remaining:
        $ref: '../../shared/headers.yml#/ratelimit-remaining'
      ratelimit-reset:
        $ref: '../../shared/headers.yml#/ratelimit-reset'
    content:
      application/json:
        schema:
          $ref: 'models/error.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    description: Template not found.
    headers:
      ratelimit-limit:
        $ref: '../../shared/headers.yml#/ratelimit-limit'
      ratelimit-remaining:
        $ref: '../../shared/headers.yml#/ratelimit-remaining'
      ratelimit-reset:
        $ref: '../../shared/headers.yml#/ratelimit-reset'
    content:
      application/json:
        schema:
          $ref: 'models/error.yml'
        example:
          id: not_found
          message: Template not found.
          request_id: 4851a473-1621-42ea-b2f9-5071c0ea8414

  '409':
    $ref: 'responses/errors.yml#/conflict'

  '422':
    $ref: 'responses/errors.yml#/unprocessable_entity'

  '429':
    $ref: 'responses/errors.yml#/too_many_requests_team_limit'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_create.yml'

security:
  - bearer_auth:
      - 'sandbox:create'
