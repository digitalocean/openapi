operationId: sandboxes_post_files_move

summary: Move or Rename a File

description: |
  Move or rename a file, directory, or symlink in the sandbox. Both `source`
  and `destination` must be inside the workspace. Missing parent directories
  of the destination are created, and a file already at the destination is
  replaced. The response is the entry at its new path.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/file_move.yml'
      examples:
        Move File:
          value:
            source: /workspace/old.txt
            destination: /workspace/new.txt

responses:
  '200':
    $ref: 'responses/file_moved.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '409':
    $ref: 'responses/errors.yml#/conflict'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_files_move.yml'

security:
  - bearer_auth:
      - 'sandbox:update'
