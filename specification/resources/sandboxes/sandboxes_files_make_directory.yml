operationId: sandboxes_post_files_make_directory

summary: Create a Directory

description: |
  Create a directory in the sandbox, with any missing parent directories. When
  the directory already exists, nothing changes: `created` is false, and is
  omitted from the JSON body. `entry` describes the directory in both cases.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/sandbox_id'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/file_make_directory.yml'
      examples:
        Make Directory:
          value:
            path: /workspace/outdir

responses:
  '200':
    $ref: 'responses/file_directory_created.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '409':
    $ref: 'responses/errors.yml#/conflict'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_files_make_directory.yml'

security:
  - bearer_auth:
      - 'sandbox:update'
