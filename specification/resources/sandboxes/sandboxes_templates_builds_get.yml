operationId: sandboxes_get_template_build

summary: Retrieve a Template Build

description: |
  Retrieve a build for a team custom template.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/template_id'
  - $ref: 'parameters.yml#/build_id'

responses:
  '200':
    $ref: 'responses/template_build.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_templates_builds_get.yml'

security:
  - bearer_auth:
      - 'sandbox_templates:read'
