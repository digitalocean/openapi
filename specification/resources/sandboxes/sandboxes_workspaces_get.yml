operationId: sandboxes_get_workspace

summary: Retrieve a Workspace

description: |
  Retrieve a workspace by ID. The workspace must belong to your team.

tags:
  - Sandboxes

parameters:
  - $ref: 'parameters.yml#/workspace_id'

responses:
  '200':
    $ref: 'responses/workspace.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/sandboxes_workspaces_get.yml'

security:
  - bearer_auth:
      - 'sandbox_workspaces:read'
