operationId: harness_post_session_sandbox_exec
summary: ExecInSandbox runs a one-shot command inside the session's sandbox.
description: |-
  Runs `argv` directly in the guest (no shell). The default response is buffered JSON.
  Stdout and stderr are capped at 1 MiB each; truncation is indicated via response headers when present.
  A non-zero exit code is still HTTP 200.
  With Accept `text/event-stream` or `stream=1`, the response is an event stream of stdout, stderr, and exit.
  Set `keep_stdin_open` to leave the process stdin open. The stream then starts with `event: started` and an `exec_id`.
  Later bytes are POST `/v2/agents/sessions/{session_id}/sandbox/exec/{exec_id}/stdin`.
  `keep_stdin_open` without the event stream returns 400.
  If the session cannot accept interactive stdin, the call returns 409 before any event-stream header.
tags:
- Harness Runtime
parameters:
- in: path
  name: session_id
  required: true
  description: The session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/definitions.yml#/exec_in_sandbox_request
  description: Command to run inside the sandbox.
responses:
  '200':
    description: Command finished (check exit_code in the body).
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/exec_in_sandbox_response
  '400':
    description: Invalid argv or request body, or keep_stdin_open without an event stream.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '402':
    description: The team is blocked by the prepayment gate.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '403':
    description: Session belongs to another team.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: Session is not in a state that can run exec, or interactive stdin is not available for this session.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '423':
    description: This session is unavailable; contact support.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_post_session_sandbox_exec.yml
security:
- bearer_auth:
  - agent_harness_session:operate
