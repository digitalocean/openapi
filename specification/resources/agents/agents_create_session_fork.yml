operationId: harness_create_session_fork
summary: ForkSession creates child sessions from a checkpoint of this session.
description: 'Each child boots a fresh sandbox from the checkpoint''s machine-state capture and is drivable exactly like any other session (input, HITL), with parent_session_id and fork_id set for lineage. When from_checkpoint_id is omitted, an implicit checkpoint of the session "now" is captured first and the children fork from that. All-or-nothing: on failure nothing is left running.'
tags:
- Harness Runtime
parameters:
- in: path
  name: session_id
  required: true
  description: The session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
requestBody:
  required: false
  content:
    application/json:
      schema:
        $ref: models/definitions.yml#/fork_session_request
  description: 'Optional; an empty or omitted body forks a single child from an implicit checkpoint of "now".'
responses:
  '200':
    description: 'The created child sessions (each a full Session, PROVISIONING -> READY).'
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/fork_session_response
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: Session belongs to another team.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: 'Team is at the active-session quota, the checkpoint is not READY, or the source session is itself a fork.'
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '501':
    description: Forking is not supported for this agent/substrate.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '423':
    description: This session is unavailable; contact support.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_create_session_fork.yml
security:
- bearer_auth:
  - agent_harness_session:create
