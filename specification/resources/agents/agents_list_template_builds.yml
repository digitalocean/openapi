operationId: harness_list_template_builds
summary: ListTemplateBuilds returns build history for a template.
description: ListTemplateBuilds returns build history for a template.
tags:
- Harness Runtime
parameters:
- in: path
  name: template_id
  required: true
  description: The template UUID.
  schema:
    type: string
    format: uuid
    example: 11111111-2222-3333-4444-555555555555
  example: 11111111-2222-3333-4444-555555555555
- in: query
  name: page_size
  required: false
  description: Page size. Defaults to 50 when omitted or non-positive.
  schema:
    type: integer
    format: int32
    example: 50
  example: 50
- in: query
  name: page_token
  required: false
  description: Optional pagination cursor (opaque). Empty starts from the beginning.
  schema:
    type: string
    example: ''
  example: ''
responses:
  '200':
    description: A successful response.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/list_template_builds_response
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_list_template_builds.yml
security:
- bearer_auth:
  - agents:read
