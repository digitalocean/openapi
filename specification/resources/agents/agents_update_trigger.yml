operationId: harness_update_trigger
summary: UpdateTrigger updates, pauses, or re-enables a trigger.
description: |-
  Partial update: only the supplied fields change. `kind` and `webhook.provider` are immutable
  (409 on change). Mutable: `name` (409 on duplicate), `status` (active<->paused), `prompt_template`,
  `output`, `session_template` (fresh), `bound_session_id` (reuse), `cron.cron_expr` /
  `cron.timezone` (recomputes next_run_at). Re-enabling never produces a catch-up run. PATCHing
  session_template is a full replacement, so every spec.secrets slot value the new manifest declares
  must be resupplied (secret values are never echoed back), or the request is a 400.
tags:
- Harness Runtime
parameters:
- in: path
  name: trigger_id
  required: true
  description: The trigger UUID.
  schema:
    type: string
    example: b1a0c6de-1f2e-4a3b-9c8d-0e1f2a3b4c5d
  example: b1a0c6de-1f2e-4a3b-9c8d-0e1f2a3b4c5d
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/definitions.yml#/update_trigger_request
  description: The fields to change.
responses:
  '200':
    description: The updated trigger.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/get_trigger_response
  '400':
    description: Validation failed.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: The caller is not permitted to create the backing agent config for this trigger.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: Duplicate name, or an attempt to change an immutable field (kind, provider).
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '422':
    description: The team's trigger limit has been reached.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '503':
    description: An upstream dependency needed to validate the trigger is temporarily unavailable; retry.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '502':
    description: The backing agent config service returned an unexpected error.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_update_trigger.yml
security:
- bearer_auth:
  - agent_harness_session:manage
