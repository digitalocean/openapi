operationId: harness_list_trigger_executions
summary: ListTriggerExecutions returns a trigger's execution history.
description: Keyset-paginated. The large `payload` field is omitted from list items; fetch a single
  execution to read it.
tags:
- Harness Runtime
parameters:
- in: path
  name: trigger_id
  required: true
  description: The trigger UUID.
  schema:
    type: string
    example: b1a0c6de-1f2e-4a3b-9c8d-0e1f2a3b4c5d
  example: b1a0c6de-1f2e-4a3b-9c8d-0e1f2a3b4c5d
- in: query
  name: page_size
  required: false
  description: Page size. Defaults to 50 when omitted or non-positive; server-clamped.
  schema:
    type: integer
    format: int32
    minimum: 1
    example: 50
  example: 50
- in: query
  name: page_token
  required: false
  description: Opaque keyset cursor returned by the previous page. Empty starts from the beginning.
  schema:
    type: string
    example: ''
  example: ''
- in: query
  name: status
  required: false
  description: Optional filter by execution status.
  schema:
    $ref: models/definitions.yml#/trigger_execution_status
  example: succeeded
responses:
  '200':
    description: A successful response.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/list_trigger_executions_response
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: Trigger belongs to another team.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_list_trigger_executions.yml
security:
- bearer_auth:
  - agent_harness_session:read
