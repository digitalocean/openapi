operationId: agents_create_session
summary: CreateSession provisions a sandbox and starts a Harness Runtime session.
description: |-
  Returns once the session row is allocated. Sandbox boot completes asynchronously.

  Two mutually exclusive request forms are selected by Content-Type (same contract as
  harness-api `harness.swagger.json`):
  - YAML (`application/x-yaml`, `application/yaml`, `text/yaml`, `text/x-yaml`): the environment
    spec. Two environment-spec formats are accepted during the dual-format transition: the flat
    format (primary) and the legacy `agents.digitalocean.com/v1alpha1` envelope (deprecated). A
    top-level `apiVersion` key selects the legacy parser; its absence selects flat. Internally
    persists a durable Environment Config, then creates the session.
  - JSON (`application/json`): `{name, config_id}` loads the config, resolves its credentials from
    Secrets Manager at the version pinned when the config was created, and creates the session.

  The OpenAPI `requestBody` schemas the JSON form for client generation (Autorest cannot emit a
  multi–content-type body). The live API still accepts the YAML forms listed above.

  Successful responses may include `config_id` on the session. `X-Device-UUID` (if present) is
  persisted on the session row. Query parameters `openai_session_id` and `resume_on_topoff` apply to
  both forms; when both the JSON body field and `?resume_on_topoff=` are present, the query
  parameter wins.
tags:
- Harness Runtime
parameters:
- in: header
  name: X-Device-UUID
  required: false
  description: Optional hardware device id forwarded by doctl. Persisted on the session row for lifecycle
    attribution. Values over 128 bytes are ignored.
  schema:
    type: string
    example: device-uuid-example
  example: device-uuid-example
- in: query
  name: openai_session_id
  required: false
  description: 'OpenAI Agents API session id (sess_…) for adapter: codex-agentapi. doctl creates the OpenAI
    session before calling DO and passes the resulting id here; harness-api persists it for correlation.
    Empty/omitted for every other agent kind.'
  schema:
    type: string
    example: sess_abc123
  example: sess_abc123
- in: query
  name: resume_on_topoff
  required: false
  description: Opt the new session in to automatic resumption when the team's prepayment balance is restored.
    Defaults to false. Exists as a query parameter so the environment spec (YAML body) form can carry it too.
    On the application/json form the body field is idiomatic, but this parameter wins when both are present.
    Must be exactly one of true/false/1/0; anything else is a 400.
  schema:
    type: boolean
    example: false
  example: false
requestBody:
  required: true
  description: |-
    CreateSessionConfigRequest with `application/json`. The live API also accepts a raw environment
    spec under YAML Content-Types (see operation description); those forms are omitted from `content`
    so generated clients (pydo/autorest) can emit this operation.
  content:
    application/json:
      schema:
        $ref: models/definitions.yml#/create_session_config_request
responses:
  '200':
    description: Session row allocated; sandbox boot continues asynchronously.
    headers: &id002
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/create_session_response
  '400':
    description: Invalid manifest/config JSON, incompatible credentials, or invalid query parameter.
    headers: *id002
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: Secrets Manager denied access to a pinned credential.
    headers: *id002
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: Team is at the active-session quota, or a live session name already exists.
    headers: *id002
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '413':
    description: JSON body exceeds 16 KiB or YAML body exceeds 1 MiB.
    headers: *id002
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '415':
    description: Unsupported Content-Type.
    headers: *id002
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '501':
    description: Requested capability is not available.
    headers: *id002
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '503':
    description: Secrets Manager is unavailable.
    headers: *id002
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_create_session.yml
security:
- bearer_auth:
  - agents:create
