operationId: harness_get_workspace
summary: Get a persistent workspace.
description: >-
  Returns one persistent workspace by its ID, including its state and when its files were last saved.
  Use it to wait for a workspace to return to `AVAILABLE` after the session that held it was removed.
tags:
- Harness Runtime
parameters:
- in: path
  name: workspace_id
  required: true
  description: The workspace ID. Workspace names are not accepted.
  schema:
    type: string
    example: 019a2f4e-8c1d-7b3a-9e5f-2d6c8a1b4e70
  example: 019a2f4e-8c1d-7b3a-9e5f-2d6c8a1b4e70
responses:
  '200':
    description: A successful response.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/get_workspace_response
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '501':
    description: Persistent workspaces are not enabled for this team.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '503':
    description: Workspace state is temporarily unavailable. Retry.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_get_workspace.yml
security:
- bearer_auth:
  - agent_harness_session:read
