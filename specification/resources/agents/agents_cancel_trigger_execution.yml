operationId: harness_cancel_trigger_execution
summary: CancelExecution ends a running execution and frees the trigger's in-flight slot.
description: Fails the execution and frees the trigger's in-flight slot. A fresh-mode session is
  destroyed outright. A reuse-mode session is only paused, not stopped - harness has no run-interrupt
  call, so the agent's turn may still be in flight server-side; this frees the queue, not necessarily
  the agent's work. A non-running execution is a no-op that still returns 200.
tags:
- Harness Runtime
parameters:
- in: path
  name: trigger_id
  required: true
  description: The trigger UUID.
  schema:
    type: string
    example: b1a0c6de-1f2e-4a3b-9c8d-0e1f2a3b4c5d
  example: b1a0c6de-1f2e-4a3b-9c8d-0e1f2a3b4c5d
- in: path
  name: execution_id
  required: true
  description: The execution UUID.
  schema:
    type: string
    example: 7c1f9e2a-3b4c-5d6e-7f80-91a2b3c4d5e6
  example: 7c1f9e2a-3b4c-5d6e-7f80-91a2b3c4d5e6
- in: query
  name: force
  required: false
  description: Cancel even if the execution has not started a run yet (the worker's own dispatch may
    still be in flight). Without this, that case returns 409; reclaim clears it automatically within
    15m regardless.
  schema:
    type: boolean
    example: false
  example: false
responses:
  '200':
    description: A successful response.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/get_trigger_execution_response
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: Execution has not started a run yet (the worker's dispatch is still in flight); retry
      shortly, or pass force=true.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_cancel_trigger_execution.yml
security:
- bearer_auth:
  - agent_harness_session:operate
