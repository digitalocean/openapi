operationId: agents_create_session_checkpoint
summary: CreateCheckpoint captures the session's live sandbox state as a durable checkpoint.
description: 'Synchronous: blocks until the capture reaches READY and returns the terminal Checkpoint — clients never see PENDING on this endpoint and need no poll loop. The checkpoint binds the machine-state capture to the event-log cursor at the cut, so it can later seed forks (POST .../fork) and rollback. Checkpoints are taken between turns; a session with an active turn in flight returns 409.'
tags:
- Agents
parameters:
- in: path
  name: session_id
  required: true
  description: The session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
requestBody:
  required: false
  content:
    application/json:
      schema:
        $ref: models/definitions.yml#/create_checkpoint_request
  description: Optional; an empty or omitted body creates an unlabeled checkpoint.
responses:
  '200':
    description: 'Checkpoint captured. The returned checkpoint is terminal (status READY).'
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/create_checkpoint_response
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: Session belongs to another team.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: 'Session busy (an active turn is in flight), session not running, or team checkpoint storage quota exceeded.'
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '501':
    description: Checkpoints are not supported for this agent/substrate.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '423':
    description: This session is unavailable; contact support.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_create_session_checkpoint.yml
security:
- bearer_auth:
  - agents:create
