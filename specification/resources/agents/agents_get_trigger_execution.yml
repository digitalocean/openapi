operationId: harness_get_trigger_execution
summary: GetTriggerExecution returns a single execution, including its payload.
description: Returns the full execution row, including the `payload`, `output_text`, and
  `output_truncated` fields omitted from list items.
tags:
- Harness Runtime
parameters:
- in: path
  name: trigger_id
  required: true
  description: The trigger UUID.
  schema:
    type: string
    example: b1a0c6de-1f2e-4a3b-9c8d-0e1f2a3b4c5d
  example: b1a0c6de-1f2e-4a3b-9c8d-0e1f2a3b4c5d
- in: path
  name: execution_id
  required: true
  description: The execution UUID.
  schema:
    type: string
    example: 7c1f9e2a-3b4c-5d6e-7f80-91a2b3c4d5e6
  example: 7c1f9e2a-3b4c-5d6e-7f80-91a2b3c4d5e6
responses:
  '200':
    description: A successful response.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/get_trigger_execution_response
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: Trigger belongs to another team.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_get_trigger_execution.yml
security:
- bearer_auth:
  - agent_harness_session:read
