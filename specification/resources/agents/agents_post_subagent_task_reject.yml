operationId: harness_post_subagent_task_reject
summary: RejectSubagentTask records the parent's verdict that a task's result is not accepted.
description: >-
  Records a reject verdict with a `reason`. The result is not integrated. `attempt` is the fence,
  as on accept: a verdict on an attempt that moved on cannot land. How many further attempts a task
  gets is bounded by the run's `max_attempts`. Agent swarms must be enabled for the team; otherwise
  the route answers 404.
tags:
- Harness Runtime
parameters:
- in: path
  name: session_id
  required: true
  description: The parent session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
- in: path
  name: run_id
  required: true
  description: The swarm run id returned when the run was created.
  schema:
    type: string
    format: uuid
    example: 9b2e6f10-4c3a-4d7e-8a15-0f6d2c9e7b41
  example: 9b2e6f10-4c3a-4d7e-8a15-0f6d2c9e7b41
- in: path
  name: task_id
  required: true
  description: The task id from the run's `tasks` list.
  schema:
    type: string
    format: uuid
    example: 3f8a1d52-7b60-4e9c-a2d4-5c1e8b7f9a03
  example: 3f8a1d52-7b60-4e9c-a2d4-5c1e8b7f9a03
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/definitions.yml#/reject_subagent_task_request
responses:
  '200':
    description: Verdict recorded.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/swarm_task
  '400':
    description: Malformed JSON, missing `attempt`, or missing `reason`.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: >-
      The caller holds no access grant on the session, or the caller is a child session: only the
      parent may call these routes.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: >-
      Branch on `id`. `stale_attempt`: the presented `attempt` is no longer the task's current
      attempt; read the run again. Otherwise the task is not integrating, or the parent session is
      not running.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_post_subagent_task_reject.yml
security:
- bearer_auth:
  - agent_harness_session:operate
