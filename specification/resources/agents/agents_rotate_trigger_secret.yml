operationId: harness_post_trigger_rotate_secret
summary: RotateTriggerSecret issues a new webhook secret.
description: |-
  Webhook triggers only (409 for cron). Issues a new secret (shown once) and moves the old value to
  the previous slot, where it keeps verifying deliveries until previous_secret_expires_at. Default
  grace is 5 minutes when grace_period_seconds is omitted, so deliveries already in flight (signed
  with the old value) still succeed while the customer updates their external system. After that
  instant the old value is refused with 401. Pass grace_period_seconds=0 to retire the old secret on
  this call (breach response), or a positive value (up to the server max, default 1 hour) for a custom
  window; above the max is 400.
tags:
- Harness Runtime
parameters:
- in: path
  name: trigger_id
  required: true
  description: The trigger UUID.
  schema:
    type: string
    example: b1a0c6de-1f2e-4a3b-9c8d-0e1f2a3b4c5d
  example: b1a0c6de-1f2e-4a3b-9c8d-0e1f2a3b4c5d
- in: query
  name: grace_period_seconds
  required: false
  description: How long the outgoing secret keeps verifying deliveries. Omit for the default (5 minutes).
    0 retires the old secret immediately (compromised-secret path). Positive values set a custom window
    up to the server max (default 1 hour); above the max is 400. Send at most once with an explicit
    non-negative integer - bare keys, empty values, non-integers, negatives, and duplicates are 400.
  schema:
    type: integer
    minimum: 0
    example: 300
  example: 300
responses:
  '200':
    description: The new secret, shown once.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/rotate_secret_response
  '400':
    description: Invalid grace_period_seconds.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: The trigger is not a webhook trigger.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_rotate_trigger_secret.yml
security:
- bearer_auth:
  - agent_harness_session:manage
