operationId: harness_list_regions
summary: ListRegions returns the regions the caller's team may create sessions and agent configs in.
description: Per-team catalog the UI (and other clients) render as the region picker, instead of hardcoding
  the list. The default region is always listed and is marked `is_default`; every other open region is
  listed only when the team holds its placement grant. The set is exactly what CreateSession and CreateAgentConfig
  placement admit, so every `slug` returned here is accepted as the region a session or config is created
  in, and a slug missing here is refused. Legacy regions are never listed. Sorted by slug; no pagination.
tags:
- Harness Runtime
responses:
  '200':
    description: The regions the team may place resources in.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/harness_regions_response
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_list_regions.yml
security:
- bearer_auth:
  - agent_harness_session:read
