operationId: harness_list_regions
summary: ListRegions returns the regions the caller's team may create sessions and agent configs in.
description: Per-team catalog the UI (and other clients) render as the region picker, instead of hardcoding
  the list. A region is chosen by the API host you call, not by a field in the request body, so a returned
  `slug` tells you which regional host to target — `ric1` means `https://api-ric1.digitalocean.com`. The
  default region is always listed and is marked `is_default`; its resources are also reachable on the
  region-less host, `https://api.digitalocean.com`. Every other open region is listed only when the team
  holds its placement grant, so a create on a listed region's host is admitted and a region missing from
  this list is refused. Teams not yet on the regional routing rollout see only the default region, and
  their responses carry no `region` field. Legacy regions are never listed. Sorted by slug; no pagination.
tags:
- Harness Runtime
responses:
  '200':
    description: The regions the team may place resources in.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/harness_regions_response
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_list_regions.yml
security:
- bearer_auth:
  - agent_harness_session:read
