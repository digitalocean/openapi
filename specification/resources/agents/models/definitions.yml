agent_kind:
  type: string
  enum:
    - AGENT_KIND_UNSPECIFIED
    - AGENT_KIND_CLAUDE_CODE
    - AGENT_KIND_OPENCODE
    - AGENT_KIND_CODEX_CLI
    - AGENT_KIND_CURSOR_CLI
    - AGENT_KIND_NONE
    - AGENT_KIND_CUSTOM
    - AGENT_KIND_HERMES
    - AGENT_KIND_OPENAI_CODEX
    - AGENT_KIND_LANGGRAPH
    - AGENT_KIND_CREWAI
  default: AGENT_KIND_UNSPECIFIED
  description: >-
    AgentKind identifies what runs inside the session sandbox. CreateSession accepts CLAUDE_CODE,
    OPENCODE, CODEX_CLI, CURSOR_CLI, OPENAI_CODEX, LANGGRAPH, and CREWAI (the supported set is
    overridable via HARNESS_SUPPORTED_AGENT_KINDS); other values are rejected with 400.
    AGENT_KIND_OPENAI_CODEX is the OpenAI sandbox-provider kind (DO runs codex exec-server; the
    agent loop lives at OpenAI). AGENT_KIND_LANGGRAPH is the LangGraph framework adapter.
    AGENT_KIND_CREWAI is the CrewAI Crew framework adapter: like LANGGRAPH the template bakes no
    agent code, so spec.env must supply FRAMEWORK_REPO and FRAMEWORK_REPO_SHA; a Crew kickoff is
    one-shot and exposes no HITL surface. CREWAI is additionally gated per team and returns 400 for
    teams it is not enabled for.
  example: AGENT_KIND_UNSPECIFIED

agent_manifest:
  type: object
  description: >-
    Customer-authored agents.yaml Agent manifest, sent as the CreateSession request body with a YAML
    Content-Type. Two formats are accepted during the dual-format transition: the FLAT format
    (primary - no envelope, snake_case, duration strings; authoritative published schema
    contracts/agent.flat.schema.json, field reference docs/agent-manifest.md) and the legacy
    v1alpha1 envelope documented by the properties below (DEPRECATED; schema
    contracts/agent.v1alpha1.schema.json; parses append a deprecation notice to session.warnings). A
    top-level apiVersion key selects the legacy parser; its absence selects flat. Untrusted input:
    every value is a request that is validated and clamped server-side. Decoding is strict in both
    formats: unknown or misspelled fields are rejected with HTTP 400 (with did-you-mean and
    legacy-spelling hints on the flat path).
  properties:
    apiVersion:
      type: string
      description: >-
        Legacy envelope only - must be "agents.digitalocean.com/v1alpha1", and its presence is what
        routes the document to the deprecated legacy parser. Flat-format manifests carry no version
        key (the endpoint owns the contract); required, with kind and spec, when authoring the
        legacy format.
      enum:
        - agents.digitalocean.com/v1alpha1
      example: agents.digitalocean.com/v1alpha1
    kind:
      type: string
      description: Must be "Agent".
      enum:
        - Agent
      example: Agent
    metadata:
      type: object
      properties:
        name:
          type: string
          description: >-
            Optional team-unique session name: 1-64 chars of letters, digits, '-', '.', '_',
            starting and ending alphanumeric; case-insensitive; must not be UUID-shaped. Omit to
            have the control plane generate one ("session-<agent-type>-<date-time>"). Unique among
            the team's ACTIVE (non-terminal) sessions; destroying a session frees its name for
            reuse.
          example: example
        description:
          type: string
          description: >-
            Free-form description (max 1024 chars), stored and echoed back for Console / catalog
            surfaces.
          example: Use when ...
        labels:
          type: object
          additionalProperties:
            type: string
            example: example
          example: {}
    spec:
      type: object
      required:
        - runtime
      properties:
        permissions:
          $ref: '#/permissions'
        mode:
          type: string
          description: >-
            Explicit lifecycle discriminator. Defaults to "interactive" (spec.serving forbidden);
            "served" requires spec.serving.
          enum:
            - interactive
            - served
          example: interactive
        runtime:
          type: object
          description: >-
            Canonical adapter ids: claude-code | opencode | codex | cursor | hermes | codex-agentapi
            | custom. codex-agentapi is the OpenAI sandbox-provider runtime (DO runs codex
            exec-server; the agent loop lives at OpenAI) and pairs with the opaque
            spec.runtime.config block. codex-cli and cursor-cli are deprecated aliases (accepted
            with a create-time warning). The framework adapters (openai-agents, claude-agent-sdk,
            crewai, langgraph) are declared but not yet supported; CreateSession rejects them.
            adapter: custom requires the custom block.
          required:
            - adapter
          properties:
            adapter:
              type: string
              enum:
                - claude-code
                - opencode
                - codex
                - cursor
                - hermes
                - codex-agentapi
                - custom
                - codex-cli
                - cursor-cli
                - openai-agents
                - claude-agent-sdk
                - crewai
                - langgraph
              example: claude-code
            custom:
              type: object
              description: >-
                BYO container; requires adapter: custom. image is required and should be
                digest-pinned.
              required:
                - image
              properties:
                image:
                  type: string
                  example: example.registry/image@sha256:abc
                entrypoint:
                  type: array
                  items:
                    type: string
                    example: example
                  example:
                    - example
            config:
              type: object
              description: >-
                OPAQUE, provider-specific runtime config. Only for adapter: codex-agentapi today,
                where it is the OpenAI Agents API create-session body (agent/environment/input) that
                doctl forwards verbatim to OpenAI's POST /v1/agents/sessions; harness-api stores and
                echoes it but never parses or validates its contents (so DO stays forward-compatible
                as OpenAI's schema evolves). The OpenAI session_id is passed on the create call (the
                openai_session_id query parameter), not in this block.
              additionalProperties: true
              example: {}
        workspace:
          type: object
          description: Repositories the session works against.
          properties:
            repos:
              type: array
              description: >-
                GitHub OWNER/REPO entries, unique. The first entry becomes the session's repo_hint;
                the full list is the forward shape for multi-repo sessions.
              items:
                type: string
                example: example
              example:
                - example
        sandbox:
          type: object
          properties:
            template:
              type: string
              description: >-
                Optional sandbox template. Empty (or the legacy placeholder "coding") means "no
                preference": the template derives from the adapter.
              example: example
            persistentWorkspace:
              type: boolean
              example: true
            idleTimeoutSeconds:
              type: integer
              format: int64
              description: Inactivity suspend timeout. 0 means tenant policy default.
              example: 1
            maxLifetimeSeconds:
              type: integer
              format: int64
              description: >-
                Hard wall-clock ceiling for the whole session, independent of activity. Accepted,
                not yet enforced (returns a warning).
              example: 1
            sizeSlug:
              type: string
              description: >-
                Requested sandbox size (catalog: GET /v2/agents/sessions/sandbox/sizes). Empty means
                the service default.
              example: example
            mounts:
              type: array
              maxItems: 8
              description: >-
                Requested data mounts. Accepted, not yet enforced (returns a warning).
                accessKeyRef/secretKeyRef name declared tenantSecret slots in spec.secrets,
                validated at create; declare those slots with env: false so the keys stay
                mount-scoped and out of the guest env.
              items:
                type: object
                required:
                  - type
                  - path
                  - bucket
                  - accessKeyRef
                  - secretKeyRef
                properties:
                  type:
                    type: string
                    enum:
                      - s3fuse
                    example: s3fuse
                  path:
                    type: string
                    description: Absolute guest path the mount appears at.
                    example: /mnt/data
                  bucket:
                    type: string
                    example: my-bucket
                  endpoint:
                    type: string
                    description: Optional storage endpoint override; https:// only.
                    example: https://nyc3.digitaloceanspaces.com
                  readOnly:
                    type: boolean
                    example: true
                  accessKeyRef:
                    type: string
                    description: Names a declared tenantSecret slot in spec.secrets.
                    example: my-secret
                  secretKeyRef:
                    type: string
                    description: Names a declared tenantSecret slot in spec.secrets.
                    example: my-secret
            egress:
              type: object
              description: >-
                Requested egress policy (legacy envelope). unrestricted opts out of platform-default
                host allowlists and cannot combine with allow / allowIps / vpcUuid / subnetUuid.
                Absent or empty means no destination ACL (same as unrestricted). Flat authors prefer
                egress: unrestricted (scalar), a bare host list, or an object with allow_hosts /
                allow_ips / vpc_uuid / subnet_uuid. Platform host defaults are unioned only when
                allow names something; allowIps does not trigger that union (IP-only turns the
                destination ACL on without domain rules). VPC attachment is create-time immutable;
                ownership is verified at session create. Allowlists are a request only: the server
                intersects them with tenant + platform policy and can only narrow them.
              properties:
                allow:
                  type: array
                  items:
                    type: object
                    required:
                      - host
                    properties:
                      host:
                        type: string
                        example: api.example.com
                allowIps:
                  type: array
                  description: Exact IPv4/IPv6 literals (not CIDRs).
                  items:
                    type: string
                    example: example
                  example:
                    - example
                vpcUuid:
                  type: string
                  description: Customer VPC UUID. Create-time immutable.
                  example: example
                subnetUuid:
                  type: string
                  description: Optional subnet within vpcUuid.
                  example: example
                unrestricted:
                  type: boolean
                  description: >-
                    When true, opts out of the platform-default host allowlist union. Mutually
                    exclusive with allow / allowIps / vpcUuid / subnetUuid.
                  example: true
        model:
          type: object
          description: >-
            Accepted, not yet enforced (returns a warning). Model routing (Plano); catalog-validated
            when enforcement lands.
          properties:
            default:
              type: string
              example: example
            routing:
              type: string
              example: example
            profile:
              type: string
              example: example
        tools:
          type: object
          description: Accepted, not yet enforced (returns a warning). Exactly one of mcpServers or bundle.
          properties:
            mcpServers:
              type: array
              items:
                type: object
                description: >-
                  Exactly one form per entry: CATALOG (ref - do.* only, the reserved DO-owned
                  namespace, e.g. do.actions; there is no tenant-registered catalog) or INLINE (name
                  + https url, optional brokered auth - the path for any non-DO server). Mixing
                  forms is a 400. tools entries are individual tool names or toolbelt:<name>[@<int>]
                  group references (catalog refs only) - selection only, disposition stays in
                  spec.permissions. Inline hosts are not auto-allowed for egress - list them under
                  spec.sandbox.egress.allow.
                properties:
                  ref:
                    type: string
                    description: >-
                      DO-owned catalog reference (catalog form); do.* only, e.g. do.actions.
                      Mutually exclusive with name/url/auth.
                    pattern: ^do\.[a-z0-9]([a-z0-9._-]{0,59}[a-z0-9])?$
                    example: do.actions
                  name:
                    type: string
                    description: >-
                      Inline server name (required with url): 1-64 chars of lowercase letters,
                      digits, '-', '.', '_', starting/ending alphanumeric. Unique across the list.
                      Must not start with do. (reserved for catalog refs).
                    pattern: ^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?$
                    example: example
                  url:
                    type: string
                    description: Inline server endpoint; https:// only.
                    example: https://example.com
                  tools:
                    type: array
                    description: >-
                      Optional selection allowlist; omitted means all tools the server advertises.
                      Each entry is an individual tool name with an optional integer version pin
                      (e.g. web_search, execute_code@3) or a toolbelt reference - a server-defined
                      named tool group written toolbelt:<name>[@<int>] (e.g. toolbelt:read-only@1;
                      catalog refs only). Versions are integer pins (no semver). The server owns
                      belt expansion; a pinned tool or belt attaches exactly that version, an
                      unpinned one resolves at session create and is frozen for the session (no
                      floating latest). Entries non-empty, unique per server. The selection bounds
                      the session and is never preloaded into the session MCP tools/list; see
                      preloadTools.
                    items:
                      type: string
                      example: example
                    example:
                      - example
                  preloadTools:
                    type: array
                    description: >-
                      Catalog form only. Individual tools (optional integer pin) advertised directly
                      in the session MCP tools/list next to the
                      action_search/action_invoke/action_code meta tools. Each entry must appear in
                      tools when tools is set; toolbelt references are rejected. Every preloaded
                      schema is in the model's context on every turn, so keep this to a handful of
                      tools. Omitted means nothing is preloaded.
                    items:
                      type: string
                      example: example
                    example:
                      - example
                  auth:
                    type: object
                    description: >-
                      Brokered credential for an INLINE server (invalid on the catalog form).
                      secretRef names a declared tenantSecret slot in spec.secrets, validated at
                      create; the slot is resolved server-side and sent as an HTTP header. Plaintext
                      credentials are never accepted.
                    required:
                      - secretRef
                    properties:
                      header:
                        type: string
                        description: HTTP header the credential is sent in. Defaults to Authorization.
                        example: Authorization
                      secretRef:
                        type: string
                        description: Tenant-vault secret name.
                        example: my-secret
            bundle:
              type: string
              example: default
        skills:
          type: array
          description: >-
            Inline agent skills (SKILL.md shape): reusable markdown instructions the agent loads on
            demand, selected by description. Accepted, not yet enforced (returns a warning). Max 32
            entries; instructions additionally capped at 256 KiB summed across the list so a valid
            manifest always fits the request-body limits. v0 is inline-only - remote skill sources
            come later as an additive field.
          maxItems: 32
          items:
            type: object
            required:
              - name
              - description
              - instructions
            properties:
              name:
                type: string
                description: >-
                  Unique across the list; 1-64 chars of lowercase letters, digits, and single hyphen
                  separators - no consecutive hyphens, per the Agent Skills spec (safe as a
                  directory name at materialization).
                pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                maxLength: 64
                example: example
              description:
                type: string
                description: >-
                  Load-bearing: the agent reads it to decide WHEN to load the skill (progressive
                  disclosure); write it as "Use when ...". Max 1024 chars.
                maxLength: 1024
                example: Use when ...
              instructions:
                type: string
                description: The markdown body (the content below the SKILL.md frontmatter). Max 32 KiB.
                maxLength: 32768
                example: Use when diagnosing errors.
              license:
                type: string
                description: Optional standard passthrough (e.g. Apache-2.0).
                example: Apache-2.0
              metadata:
                type: object
                description: >-
                  Optional string-map passthrough (e.g. author), rendered into the frontmatter
                  verbatim.
                additionalProperties:
                  type: string
                  example: example
                example: {}
              allowedTools:
                type: array
                description: >-
                  Advisory scoping of which tools the skill expects to use (experimental in the
                  skills standard). NOT a security boundary - spec.permissions remains the only
                  enforcement surface.
                items:
                  type: string
                  example: example
                example:
                  - example
        env:
          type: object
          description: >-
            Non-secret guest env (debug-readable - never put secrets here; use spec.secrets).
            Reserved platform keys (TEAM_ID, SESSION_ID, SANDBOX_ID, CONTROL_PLANE_CALLBACK_URL,
            SANDBOX_TEMPLATE, SANDBOX_AGENT_WORKDIR, SIZE_SLUG, SANDBOX_IMAGE_ID, SANDBOX_OCI_REF,
            PLANO_PERMISSION_*) are rejected. Credential-looking values (dop_v1_..., sk-...,
            ghp_...) trigger a create-time warning.
          additionalProperties:
            type: string
            example: example
          example: {}
        memory:
          type: object
          description: Accepted, not yet enforced (returns a warning).
          required:
            - backend
          properties:
            backend:
              type: string
              example: example
            scope:
              type: string
              enum:
                - tenant
                - user
                - agent
                - session
              example: tenant
        secrets:
          type: array
          description: >-
            Declared credential requirements. source tenantSecret is enforced today: value is
            write-only plaintext, extracted into Secrets Manager at create and never persisted or
            returned. source oauth requires provider, carries no value, and is accepted but not yet
            enforced. ref is legacy and ignored. env false keeps the resolved value out of the guest
            environment (mount-only slots).
          items:
            type: object
            required:
              - name
              - source
            properties:
              name:
                type: string
                example: example
              source:
                type: string
                enum:
                  - oauth
                  - tenantSecret
                example: oauth
              provider:
                type: string
                example: openai
              ref:
                type: string
                example: do.actions
              value:
                type: string
                description: Write-only tenantSecret plaintext; never persisted or returned.
                example: sk-example
              env:
                type: boolean
                description: >-
                  Whether the resolved credential is injected into the guest env. Omitted means
                  true; false is for mount-only slots (tenantSecret only).
                example: true
        defaults:
          type: object
          properties:
            budget:
              type: object
              description: >-
                Accepted, not yet enforced (returns a warning). Advisory per-run ceilings, clamped
                server-side to tenant policy.
              properties:
                maxCostUSD:
                  type: number
                  example: 1
                maxSteps:
                  type: integer
                  example: 1
                maxWallClockSeconds:
                  type: integer
                  format: int64
                  example: 1
                onBreach:
                  type: string
                  enum:
                    - pause
                    - humanInput
                    - fail
                  example: pause
        serving:
          type: object
          description: Present only when spec.mode is "served" (autoscaled fleet).
          properties:
            minReplicas:
              type: integer
              example: 1
            maxReplicas:
              type: integer
              example: 1
            targetConcurrency:
              type: integer
              example: 1
            scaleToZero:
              type: object
              properties:
                idleSeconds:
                  type: integer
                  format: int64
                  example: 1
create_session_config_request:
  type: object
  additionalProperties: false
  required:
    - name
    - config_id
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
      description: >-
        Session name, independent of the config name. Must satisfy the existing environment-spec
        metadata.name rules and must not be UUID-shaped.
      example: demo-agent
    config_id:
      type: string
      format: uuid
      example: 11111111-2222-3333-4444-555555555555
    resume_on_topoff:
      type: boolean
      description: >-
        Opt the new session in to automatic resumption when the team's prepayment balance is
        restored. Defaults to false. Session-scoped, not config-scoped: the referenced config never
        confers this, so one shared config cannot enrol every session created from it. Omit to leave
        the default (or to let the ?resume_on_topoff= query parameter supply it).
      example: false
  description: >-
    Strict application/json CreateSession form. Loads config_id, resolves the config's single
    internal secret binding, and creates the session. Body capped at 16 KiB; no inline secrets.

create_session_response:
  type: object
  properties:
    session:
      $ref: '#/session'
error:
  $ref: ../../../shared/models/error.yml
get_session_response:
  type: object
  properties:
    session:
      $ref: '#/session'
hitl_outcome:
  type: string
  enum:
  - HITL_OUTCOME_UNSPECIFIED
  - HITL_OUTCOME_APPROVE
  - HITL_OUTCOME_REJECT
  - HITL_OUTCOME_DEFER
  default: HITL_OUTCOME_UNSPECIFIED
  description: HITLOutcome is the user's decision on a HITL request. DEFER backs off this attempt without
    treating it as a rejection.
  example: HITL_OUTCOME_UNSPECIFIED
list_sessions_response:
  type: object
  properties:
    sessions:
      type: array
      items:
        $ref: '#/session'
    next_page_token:
      type: string
      description: Opaque cursor for the next page. Empty when there are no further pages.
      example: example
permission_filesystem:
  type: object
  description: Filesystem boundary, enforced by the microVM (read-only root + bind-mounted writable roots)
    for every agent.
  properties:
    mode:
      type: string
      enum:
      - read-only
      - workspace-write
      example: read-only
    allowWrite:
      type: array
      description: Additional writable paths beyond the workspace. Values must not contain shell-style
        ${VAR}/$VAR expansions.
      items:
        type: string
        example: example
      example:
      - example
permission_network:
  type: object
  description: Network boundary. Narrows (subtract-only) spec.sandbox.egress; link-local/internal addresses
    stay blocked by the broader egress policy.
  properties:
    default:
      type: string
      enum:
      - allow
      - deny
      example: allow
    allow:
      type: array
      items:
        type: string
        example: example
      example:
      - example
permission_rule:
  type: object
  required:
  - tool
  - action
  properties:
    tool:
      type: string
      description: Tool taxonomy this rule matches (e.g. bash, file.read, file.write, web.fetch, git.*,
        mcp).
      example: example
    match:
      type: object
      description: 'Optional keys narrowing the rule (e.g. {"command": "npm run deploy"} for bash). Values
        are globs and must not contain shell-style ${VAR}/$VAR expansions.'
      additionalProperties:
        type: string
      properties: {}
    action:
      type: string
      enum:
      - allow
      - ask
      - deny
      example: allow
    enforcement:
      type: string
      description: What happens when the agent cannot enforce the rule exactly. "strict" rejects the session;
        "best-effort" degrades to the closest more-restrictive form and warns (never widens). Defaults
        to strict for deny rules, best-effort otherwise.
      enum:
      - strict
      - best-effort
      example: strict
permissions:
  type: object
  description: 'Customer-declared tool-execution permission policy (spec.permissions). REQUEST only: the
    policy engine resolves it (∩ tenant ∩ platform) into the canonical policy and validates it against
    the (agent, version) capability descriptor. Absent or empty means the agent keeps its built-in default
    gating — no policy is shipped to the sandbox.'
  properties:
    defaultAction:
      type: string
      description: Disposition for tool calls that match no rule. Defaults to "ask" when omitted.
      enum:
      - allow
      - ask
      - deny
      example: allow
    rules:
      type: array
      description: 'Ordered match→action rules. Declared order is authoritative: the LAST matching rule
        wins (author-order last-match).'
      items:
        $ref: '#/permission_rule'
    filesystem:
      $ref: '#/permission_filesystem'
    network:
      $ref: '#/permission_network'
resolution_source:
  type: string
  enum:
  - RESOLUTION_SOURCE_UNSPECIFIED
  - RESOLUTION_SOURCE_INLINE_KEYSTROKE
  - RESOLUTION_SOURCE_OUT_OF_BAND
  default: RESOLUTION_SOURCE_UNSPECIFIED
  description: How a HITL resolution was triggered. Defaults to RESOLUTION_SOURCE_OUT_OF_BAND when omitted.
  example: RESOLUTION_SOURCE_UNSPECIFIED
resolve_hitl_request:
  type: object
  properties:
    outcome:
      $ref: '#/hitl_outcome'
    reason:
      type: string
      description: Optional free-text reason. Captured in the audit trail; not interpreted.
      example: example
    source:
      $ref: '#/resolution_source'
  required:
  - outcome
resolved_rule:
  type: object
  description: A rule after resolution (∩ tenant ∩ platform), carrying a stable id for audit correlation.
  properties:
    id:
      type: string
      description: Stable rule id assigned during resolution; correlates with the PolicyDenied event's
        matched rule.
      example: example
    tool:
      type: string
      example: example
    match:
      type: object
      additionalProperties:
        type: string
      properties: {}
    action:
      type: string
      enum:
      - allow
      - ask
      - deny
      example: allow
    enforcement:
      type: string
      enum:
      - strict
      - best-effort
      example: strict
rule_verdict:
  type: object
  description: Validation outcome for one resolved rule.
  properties:
    rule:
      $ref: '#/resolved_rule'
    verdict:
      type: string
      description: exact — enforced precisely as written; degraded — renderable only in a more-restrictive
        form (deny→ask), warned; unsupported — cannot be enforced (strict ⇒ session reject); unverified
        — no descriptor available, rendered conservatively but unproven.
      enum:
      - exact
      - degraded
      - unsupported
      - unverified
      example: exact
    rendered:
      type: string
      description: 'The disposition the agent will actually enforce: the requested action when exact/unverified,
        the more-restrictive target when degraded, omitted when unsupported (cannot render).'
      enum:
      - allow
      - ask
      - deny
      example: allow
    reason:
      type: string
      description: Human-readable explanation of the verdict.
      example: example
    suggestion:
      type: string
      description: 'Optional actionable hint (e.g. "set enforcement: best-effort, or target a capable
        agent").'
      example: example
sandbox_size:
  type: object
  description: A customer-selectable sandbox (microVM) size.
  properties:
    slug:
      type: string
      description: DO size slug; submit as spec.sandbox.sizeSlug on CreateSession. e.g. "mars-2vcpu-4gb".
      example: mars-2vcpu-4gb
    vcpus:
      type: integer
      format: int64
      description: vCPU count (for display).
      example: 2
    memory_mb:
      type: integer
      format: int64
      description: Memory in MB (for display).
      example: 4096
    price_per_hour_usd:
      type: number
      format: double
      description: Hourly on-demand price in USD (for display).
      example: 0.00003
    price_per_month_usd:
      type: number
      format: double
      description: Monthly on-demand price in USD, assuming continuous usage (for display).
      example: 93.744
sandbox_sizes_response:
  type: object
  description: Response for ListSandboxSizes.
  properties:
    sizes:
      type: array
      description: Selectable sizes, ordered smallest-to-largest.
      items:
        $ref: '#/sandbox_size'
send_input_request:
  type: object
  properties:
    text:
      type: string
      description: The user message to deliver into the session. Required and non-empty.
      example: example
  required:
  - text
send_input_response:
  type: object
  properties:
    run_id:
      type: string
      description: The run id the input was attributed to. Clients can correlate against the run.started
        event on the stream. May be empty if OHR returned no run id.
      example: example
session:
  type: object
  description: Session is the user-facing record of a environment session + sandbox pair.
  properties:
    session_id:
      type: string
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    name:
      type: string
      description: >-
        User-assignable display name, unique per team among non-terminal sessions. Usable in place
        of session_id by clients (doctl / Console resolve it to the id via the ListSessions ?name=
        filter; the {session_id} path stays UUID-only). Supplied via the environment-spec metadata.name,
        or auto-generated ("session-<agent-type>-<date-time>") when omitted.
      example: demo-agent
    parent_session_id:
      type: string
      description: >-
        Lineage: id of the session this one was forked from. Omitted/empty for root (non-fork)
        sessions.
      example: example
    fork_id:
      type: string
      format: uuid
      description: >-
        Lineage: branch label assigned when this session was created by ForkSession (or rollback's
        internal fork). Omitted/empty for root sessions.
      example: 11111111-2222-3333-4444-555555555555
    fork_from_checkpoint_id:
      type: string
      description: >-
        Lineage: harness-api checkpoint id (cp_<hex>) the child booted from at fork time. Drives OHP
        inherited-history replay on attach. Omitted/empty for root sessions and legacy forks created
        before this field was persisted.
      example: example
    agent_kind:
      $ref: '#/agent_kind'
    status:
      $ref: '#/session_status'
    sandbox_id:
      type: string
      description: >-
        Sandbox identity for support / debugging. Informational; omitted until a sandbox is
        allocated.
      example: example
    created_at:
      type: string
      format: date-time
      example: '2026-08-01T12:00:00Z'
    last_event_at:
      type: string
      format: date-time
      description: >-
        Timestamp of the most recent event in this session's canonical stream. Drives the inactivity
        policy that destroys idle sessions.
      example: '2026-08-01T12:00:00Z'
    keep_warm:
      type: boolean
      description: >-
        Session is exempt from idle auto-pause (manifest keep_warm, or the agent-kind default:
        hermes sessions keep warm). Pause requests against such a session are rejected with 409.
        Omitted when false.
      example: false
    resume_on_topoff:
      type: boolean
      description: >-
        Session consents to being resumed automatically when the team's prepayment balance is
        restored after a low-balance pause. Defaults to false at create time; may be toggled later
        via PATCH /v2/agents/sessions/{session_id} (resume_on_topoff only). Only a session paused
        with reason low_balance whose latest run did not complete is ever resumed automatically - a
        session the customer paused themselves, or one that idled out, stays paused regardless. Not
        an environment-spec field, and forks do not inherit it. Omitted when false.
      example: false
    pause_reason:
      type: string
      description: >-
        Why this session is paused. Present only when status is SESSION_STATUS_PAUSED; omitted
        otherwise. Known values: manual (PauseSession RPC), idle (inactivity auto-pause),
        low_balance (prepay gate). Clients should treat an unrecognized value as an opaque reason
        string.
      example: example
    idle_timeout_seconds:
      type: integer
      format: int64
      description: >-
        This session's own idle-pause timeout (manifest idle_timeout). Omitted when the session uses
        the deployment-wide default.
      example: 60
    repo_hint:
      type: string
      description: >-
        Optional repository hint supplied at session creation (first spec.workspace.repos entry of
        the manifest). Not authoritative; the agent may change repos in-session.
      example: example
    warnings:
      type: array
      items:
        type: string
      description: >-
        Non-fatal advisories computed from the manifest at create time: one entry per populated
        accepted-but-not-yet-enforced section (flat names: secrets, model, tools, memory, budget,
        max_lifetime, mounts; legacy manifests get the corresponding spec.* paths), a deprecation
        entry when a legacy-envelope manifest or an adapter alias (codex-cli, cursor-cli) is used,
        and a heuristic entry per credential-looking spec.env value. Populated on the CreateSession
        response only.
      example: []
    config_id:
      type: string
      format: uuid
      description: >-
        Durable Environment Config UUID the session was created from (inline manifests persist a config
        too, named after the session). Persisted and returned on create/get/list; absent only for
        sessions created before config references were stored.
      example: 11111111-2222-3333-4444-555555555555
    openai_session_id:
      type: string
      description: >-
        OpenAI Agents API session id (sess_…) this DO sandbox hosts. Populated only for
        AGENT_KIND_OPENAI_CODEX sessions (empty otherwise). Non-secret correlation metadata; a
        client (doctl agents attach) reads it to bridge to the OpenAI session. See
        docs/design/openai-sandbox-provider.md.
      example: example
    openai_environment_id:
      type: string
      description: >-
        OpenAI Agents API environment id (env_…), captured from the resolved CODEX_ENVIRONMENT_ID
        guest env value. Populated only for AGENT_KIND_OPENAI_CODEX sessions. Non-secret correlation
        metadata.
      example: example

session_origin:
  type: object
  additionalProperties: false
  description: Server-returned product workflow provenance.
  required:
  - product
  properties:
    product:
      type: string
      enum:
      - direct
      - simulation
      - evaluation
      example: direct
    resource_id:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,254}$
      description: Opaque product-owned correlation identifier (external_id).
      example: sim-run-123
    verified:
      type: boolean
      readOnly: true
      description: True only when OHS established this claim through a trusted product adapter.
      example: true
session_origin_request:
  type: object
  additionalProperties: false
  description: Product workflow provenance. Omission creates a verified direct session. Simulation and
    evaluation require resource_id; direct forbids it.
  required:
  - product
  properties:
    product:
      type: string
      enum:
      - direct
      - simulation
      - evaluation
      description: Workflow that created the session.
      example: direct
    resource_id:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,254}$
      description: Opaque product-owned correlation identifier (external_id). Required for simulation/evaluation
        and forbidden for direct.
      example: sim-run-123
session_status:
  type: string
  enum:
    - SESSION_STATUS_UNSPECIFIED
    - SESSION_STATUS_PROVISIONING
    - SESSION_STATUS_READY
    - SESSION_STATUS_DETACHED
    - SESSION_STATUS_DESTROYING
    - SESSION_STATUS_DESTROYED
    - SESSION_STATUS_FAILED
    - SESSION_STATUS_PAUSED
    - SESSION_STATUS_ALL
    - SESSION_STATUS_LOCKED
  default: SESSION_STATUS_UNSPECIFIED
  description: >-
    SessionStatus is the lifecycle state of the sandbox + agent pair. SESSION_STATUS_ALL is a
    ListSessions status-filter value only -- no session is ever actually in this status.
    SESSION_STATUS_LOCKED is reserved for internal use and never appears in an end-user-facing
    response.
  example: SESSION_STATUS_UNSPECIFIED

stream_event:
  type: object
  description: The JSON payload carried in each SSE event's `data:` field (canonical SPI event envelope).
    The SSE `event:` field repeats `type`, and the `id:` field repeats `event_id`.
  properties:
    event_id:
      type: string
      example: example
    run_id:
      type: string
      example: example
    tenant_id:
      type: string
      description: DO Team ID rendered as a decimal string.
      example: example
    session_id:
      type: string
      example: example
    trace_parent:
      type: string
      example: example
    timestamp:
      type: string
      format: date-time
      example: '2026-07-27T12:00:00Z'
    seq:
      type: integer
      format: int64
      description: Producer-supplied sequence number; nonzero values increase monotonically within an
        ingress stream.
      example: 1
    source_event_id:
      type: string
      example: example
    source_event_type:
      type: string
      example: example
    source_tenant_id:
      type: string
      description: Optional runtime-native tenant identifier; distinct from authoritative tenant_id.
      example: example
    producer:
      type: string
      description: Server-assigned component that submitted the event.
      enum:
      - agent
      - ohr
      - ohp
      - ohs
      example: agent
    definition_id:
      type: string
      example: example
    revision_id:
      type: string
      example: example
    credential_binding_set_id:
      type: string
      example: example
    type:
      type: string
      description: Canonical SPI event type. The SSE `event:` field carries the same value.
      enum:
      - run.started
      - run.token_delta
      - run.tool_call_started
      - run.tool_call_completed
      - run.human_input_requested
      - run.human_input_received
      - run.completed
      - run.failed
      - run.paused
      - run.resumed
      - session.updated
      - run.state_checkpointed
      - run.handoff
      - run.usage_recorded
      - run.sandbox_allocated
      - run.sandbox_released
      - run.cost_accrued
      - run.log
      - policy.denied
      - stream.state
      example: run.started
    data:
      type: object
      description: 'Type-specific payload, discriminated by `type` (canonical SPI shapes; numeric fields
        are JSON numbers):

        - run.started: {agent}

        - run.token_delta: {text}

        - run.tool_call_started: {tool_call_id, name, input}

        - run.tool_call_completed: {tool_call_id, ok, duration_ms, summary}

        - run.human_input_requested: {hitl_id, payload}

        - run.human_input_received: {hitl_id, outcome, actor, reason}

        - run.completed: {total_tokens_in, total_tokens_out, run_cost_micros}

        - run.failed: {code, message}

        - run.paused: {reason}

        - run.resumed: {}

        - session.updated: {}

        - run.state_checkpointed: {checkpoint_id, digest}

        - run.handoff: {from, to, description}

        - run.usage_recorded: {step_id, model_id, usage: {input_tokens, output_tokens, cached_input_tokens,
        reasoning_tokens, tool_seconds}}

        - run.sandbox_allocated: {sandbox_id, kind, template}

        - run.sandbox_released: {sandbox_id, exit_code, duration_ms}

        - run.cost_accrued: {running_total_micros, delta_micros}

        - run.log: {level, message, fields}'
      properties: {}
validation_result:
  type: object
  description: 'Response of POST /v2/agents/sessions/policy/validate: per-rule verdicts for the (agent,
    version). The same shape is persisted per session in session_policies.verdicts.'
  properties:
    agent:
      type: string
      example: example
    version:
      type: string
      example: example
    ok:
      type: boolean
      description: False when any strict rule is unsupported or unverified — i.e. CreateSession would
        reject this policy for this (agent, version).
      example: true
    defaultAction:
      type: string
      description: Catch-all disposition AS SHIPPED (after unverified allow→ask downgrade). When defaultActionVerdict
        is degraded, this remains the shipped value; see defaultActionRendered for what the agent will
        actually enforce.
      enum:
      - allow
      - ask
      - deny
      example: allow
    defaultActionVerdict:
      type: string
      description: exact — agent can enforce the catch-all as written; degraded — agent cannot enforce
        the requested defaultAction (warn-only; shipped value unchanged); omitted when no descriptor was
        available to classify against.
      enum:
      - exact
      - degraded
      - unsupported
      - unverified
      example: exact
    defaultActionRendered:
      type: string
      description: 'Disposition the agent will actually enforce as the catch-all: equals defaultAction
        when exact; the more-restrictive degrade target (usually ask) when degraded.'
      enum:
      - allow
      - ask
      - deny
      example: allow
    defaultActionReason:
      type: string
      description: Human-readable explanation when defaultActionVerdict is degraded.
      example: example
    verdicts:
      type: array
      items:
        $ref: '#/rule_verdict'
workspace_part_upload_url:
  type: object
