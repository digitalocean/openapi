      example: '2026-07-27T12:00:00Z'
agent_config_summary:
  type: object
  description: Lightweight list representation; the manifest is available from config reads, not list
    responses.
  required:
  - id
  - name
  - agentspec_schema_version
  - content_hash
  - created_by
  - created_at
  - updated_at
  properties:
    id:
      type: string
      format: uuid
      example: 019fb39c-14d9-7080-933e-b9b90e25acda
    name:
      type: string
      example: support-agent
    agentspec_schema_version:
      type: string
      description: >-
        The manifest contract the server accepted at create time: the manifest's own apiVersion
        for legacy envelope parses (currently agents.digitalocean.com/v1alpha1), or
        agents.digitalocean.com/flat.v1 for flat-format parses.
      example: agents.digitalocean.com/v1alpha1
    content_hash:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: Lowercase SHA-256 hex digest of the canonical sanitized manifest JSON.
      example: 75803fef24dc731824ecd4a1853c76153c7d8503534092b94da3ca3f31a882f4
    created_by:
      type: string
      description: Authenticated user identity that created the config.
      example: user-1
    created_at:
      type: string
      format: date-time
      example: '2026-08-01T12:00:00Z'
    updated_at:
      type: string
      format: date-time
      example: '2026-08-01T12:00:00Z'
agent_config_credential_slot:
  type: object
  required:
  - name
  properties:
    name:
      type: string
      example: OPENAI_API_KEY
    source:
      type: string
      enum:
      - tenantSecret
      - oauth
      example: tenantSecret
    provider:
      type: string
      example: openai
agent_config:
  type: object
  description: 'Immutable team-scoped Environment Config: one sanitized manifest per config. There is no update; clone to a new config to change content.'
  required:
  - id
  - name
  - agentspec_schema_version
  - manifest
  - content_hash
  - created_by
  - created_at
  - updated_at
  properties:
    id:
      type: string
      format: uuid
      example: 019fb39c-14d9-7080-933e-b9b90e25acda
    name:
      type: string
      example: support-agent
    agentspec_schema_version:
      type: string
      description: >-
        The manifest contract the server accepted at create time: the manifest's own apiVersion
        for legacy envelope parses (currently agents.digitalocean.com/v1alpha1), or
        agents.digitalocean.com/flat.v1 for flat-format parses.
      example: agents.digitalocean.com/v1alpha1
    manifest:
      description: >-
        Canonical runnable environment spec JSON, immutable after create.
        Validated non-secret spec.env and spec.permissions remain; spec.secrets
        retains name/source/provider but omits ref and the write-only value;
        metadata.name is cleared while safe metadata such as labels remains.
      allOf:
      - $ref: '#/agent_manifest'
    content_hash:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: Lowercase SHA-256 hex digest of the canonical sanitized manifest JSON.
      example: 75803fef24dc731824ecd4a1853c76153c7d8503534092b94da3ca3f31a882f4
    insights:
      allOf:
      - $ref: '#/insights_opt_in'
      - description: >-
          The per-signal telemetry opt-in recorded at create time. Absent when the customer
          expressed no choice. This echoes the create-time request only: a customer who later
          re-toggles a signal from the Insights settings page changes their enablement there,
          not here.
    created_by:
      type: string
      description: Authenticated user identity that created the config.
      example: user-1
    created_at:
      type: string
      format: date-time
      example: '2026-08-01T12:00:00Z'
    updated_at:
      type: string
      format: date-time
      example: '2026-08-01T12:00:00Z'
    credentials:
      type: array
      description: Redacted credential slot metadata (name/source/provider). Secret values are never
        included.
      items:
        $ref: '#/agent_config_credential_slot'
agent_config_response:
  type: object
  properties:
    config:
      $ref: '#/agent_config'
list_agent_configs_response:
  type: object
  properties:
    configs:
      type: array
      items:
        $ref: '#/agent_config_summary'
    next_page_token:
      type: string
      example: ''
agent_config_create_request:
  type: object
  additionalProperties: false
  description: >-
    Environment Config create body. Credentials are not request fields: every secret is declared
    in the environment spec under secrets (or legacy spec.secrets), with tenantSecret slots
    carrying plaintext in a write-only value extracted into Secrets Manager and never returned.
  required:
  - name
  - manifest_yaml
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$
      description: Config name, case-insensitively unique among the team's active configs.
      example: support-agent
    manifest_yaml:
      type: string
      maxLength: 524288
      description: Customer environment-spec YAML text. The HTTP JSON body is capped at 1 MiB and this field is capped
        at 512 KiB.
      example: |
        apiVersion: agents.digitalocean.com/v1alpha1
        kind: Agent
        spec:
          runtime:
            adapter: opencode
    insights:
      allOf:
      - $ref: '#/insights_opt_in'
      - description: >-
          Optional per-signal Insights telemetry opt-in. Travels beside manifest_yaml, never
          inside it: the manifest is immutable and content-hashed, while this value can be
          changed later from the Insights settings page. When omitted, no choice is recorded
          and the product default applies.
checkpoint_kind:
  type: string
  enum:
    - explicit
    - implicit
  description: >-
    How the checkpoint came to exist: explicit - requested via CreateCheckpoint; implicit - minted
    automatically by the platform (on run completion, or when ForkSession is called without
    from_checkpoint_id).
  example: explicit
checkpoint_status:
  type: string
  enum:
    - PENDING
    - READY
    - FAILED
  description: >-
    Capture lifecycle: PENDING -> READY | FAILED. Only READY checkpoints are forkable/restorable.
    CreateCheckpoint blocks until terminal, so PENDING is only ever observable via list/get while a
    capture is in flight.
  example: READY
insights_opt_in:
  type: object
  additionalProperties: false
  properties:
    metrics:
      type: boolean
      nullable: true
      description: >-
        Accepted and stored for parity with the Insights schema, but metrics are always collected:
        unregistered metrics are dropped at ingest rather than opted out of here.
    logs:
      type: boolean
      nullable: true
      description: Whether the agent's logs are sent to Insights.
    traces:
      type: boolean
      nullable: true
      description: Whether the agent's traces are sent to Insights.
  description: >-
    Per-signal DigitalOcean Insights telemetry opt-in, mirroring the Insights-owned schema
    insights.telemetry.opt_in. Each signal is independently optional and tri-state: omitted or null
    records that the customer expressed no choice and falls back to the product default, which is
    NOT equivalent to false.
checkpoint:
  type: object
  description: >-
    Checkpoint is a durable capture of a session's live sandbox machine state bound to the event-log
    cursor at the cut. READY checkpoints seed forks (ForkSession) and rollback. Internal fields
    (team_id, the substrate checkpoint id, event_seq) are never serialized.
  properties:
    checkpoint_id:
      type: string
      description: Public checkpoint id, stable for the checkpoint's lifetime (e.g. cp_9f2c1a4b).
      example: cp_9f2c1a4b
    session_id:
      type: string
      description: Owning session.
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    status:
      $ref: '#/checkpoint_status'
    kind:
      $ref: '#/checkpoint_kind'
    label:
      type: string
      description: Optional user-supplied label from CreateCheckpoint; empty when omitted.
      example: before-refactor
    event_id:
      type: string
      description: >-
        Event-log cursor (ULID) of the last event included in the cut; forks resume event replay
        from here.
      example: 01JABCDEFGHJKLMNPQRSTVWXYZ
    size_bytes:
      type: integer
      format: int64
      description: Size of the captured machine state. 0 until the checkpoint reaches READY.
      example: 1048576
    created_at:
      type: string
      format: date-time
      example: '2026-08-01T12:00:00Z'
    error_message:
      type: string
      description: Client-safe failure detail; set only when status is FAILED.
      example: capture timed out
sandbox_template_image_source:
  type: object
  properties:
    registry:
      type: string
      example: registry.digitalocean.com
    repository:
      type: string
      example: my-team/agent-base
    tag:
      type: string
      example: latest
    digest:
      type: string
      example: sha256:deadbeef
sandbox_template_spec:
  type: object
  properties:
    base_template:
      type: string
      description: >-
        Base template key. One of: coding-base, coding-claude-code, coding-codex, coding-hermes,
        coding-opencode, langgraph.
      example: coding-opencode
    image:
      $ref: '#/sandbox_template_image_source'
sandbox_template_build:
  type: object
  required:
    - build_id
    - status
    - created_at
    - updated_at
  properties:
    build_id:
      type: string
      format: uuid
      example: 11111111-2222-3333-4444-555555555555
    template_id:
      type: string
      format: uuid
      example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    name:
      type: string
      example: my-custom-template
    spec:
      $ref: '#/sandbox_template_spec'
    status:
      type: string
      enum:
        - STATUS_UNSPECIFIED
        - PENDING
        - BUILDING
        - SUCCEEDED
        - FAILED
      example: SUCCEEDED
    error:
      type: string
      example: ''
    created_at:
      type: string
      format: date-time
      example: '2026-08-01T12:00:00Z'
    updated_at:
      type: string
      format: date-time
      example: '2026-08-01T12:05:00Z'
sandbox_template:
  type: object
  required:
    - template_id
    - name
    - status
    - created_at
    - updated_at
  properties:
    template_id:
      type: string
      format: uuid
      example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    name:
      type: string
      example: my-custom-template
    spec:
      $ref: '#/sandbox_template_spec'
    status:
      type: string
      enum:
        - TEMPLATE_STATUS_UNSPECIFIED
        - TEMPLATE_STATUS_PENDING
        - TEMPLATE_STATUS_BUILDING
        - TEMPLATE_STATUS_READY
        - TEMPLATE_STATUS_FAILED
      example: TEMPLATE_STATUS_READY
    created_at:
      type: string
      format: date-time
      example: '2026-08-01T12:00:00Z'
    updated_at:
      type: string
      format: date-time
      example: '2026-08-01T12:05:00Z'
create_checkpoint_request:
  type: object
  properties:
    label:
      type: string
      description: Optional human-readable label stored on the checkpoint; "" if omitted.
create_checkpoint_response:
  type: object
  description: >-
    Terminal result of the synchronous capture: checkpoint.status is READY on success. Failures are
    reported through the error envelope, never as a FAILED checkpoint here.
  properties:
    checkpoint:
      $ref: '#/checkpoint'
get_checkpoint_response:
  type: object
  properties:
    checkpoint:
      $ref: '#/checkpoint'
list_checkpoints_response:
  type: object
  properties:
    checkpoints:
      type: array
      items:
        $ref: '#/checkpoint'
      description: Newest first.
    next_page_token:
      type: string
      description: Opaque cursor for the next page. Empty when there are no further pages.
delete_checkpoint_response:
  type: object
  properties:
    checkpoint_id:
      type: string
      description: Echo of the requested checkpoint id.
    deleted:
      type: boolean
      description: Always true on 200 (delete is idempotent).
rollback_to_checkpoint_response:
  type: object
  description: 'The session after in-place rollback: same session_id, sandbox_id swapped to the restored VM.'
  properties:
    session:
      $ref: '#/session'
fork_session_request:
  type: object
  properties:
    from_checkpoint_id:
      type: string
      description: >-
        Checkpoint to fork from; must be READY. Omitted/empty means capture an implicit checkpoint
        of the session "now" first and fork from that.
    count:
      type: integer
      format: int32
      description: >-
        Number of child sessions to create, 1-4. Defaults to 1 when omitted; a value outside 1-4 is
        rejected with 400.
      default: 1
      minimum: 1
      maximum: 4
fork_session_response:
  type: object
  properties:
    sessions:
      type: array
      items:
        $ref: '#/session'
      description: >-
        The created child sessions, each a full Session with parent_session_id and fork_id set
        (PROVISIONING -> READY) and drivable exactly like any other session.
patch_session_request:
  type: object
  additionalProperties: false
  properties:
    resume_on_topoff:
      type: boolean
      description: >-
        When present, sets whether this session opts in to automatic resumption when the team's
        prepayment balance is restored after a low-balance pause. Session-scoped consent, not
        config-scoped. Omitted properties are not modified.
      example: false
  description: >-
    PATCH body for /v2/agents/sessions/{session_id}: an allowlisted subset of session-scoped
    settings (never environment-spec / config mutation). At least one property below must be present; {}
    is 400. Unknown top-level keys are rejected with 400. New patchable fields will be added here as
    optional properties over time.

agent_config_clone_request:
  type: object
  additionalProperties: false
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$
      description: New config name, unique among the team's active configs.
    secrets:
      type: object
      maxProperties: 32
      description: >-
        Write-only map from tenantSecret logical slot to plaintext. Required when the source
        declares those slots; never copied from the source.
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 32768
    oauth_assignments:
      type: object
      maxProperties: 32
      description: >-
        Write-only map from oauth logical slot to an OAuth assignment UUID. Required when the source
        declares those slots; never copied from the source.
      additionalProperties:
        type: string
        format: uuid
  description: >-
    Clone body: required new name plus write-only credentials for any declared slots. No lineage
    field.
create_template_request:
  type: object
  required:
    - name
    - base_template
    - source_oci_ref
  properties:
    name:
      type: string
    base_template:
      type: string
      description: >-
        Base template key. One of: coding-base, coding-claude-code, coding-codex, coding-hermes,
        coding-opencode, langgraph.
    source_oci_ref:
      type: string
create_template_response:
  type: object
  properties:
    template:
      $ref: '#/sandbox_template'
update_template_request:
  type: object
  properties:
    source_oci_ref:
      type: string
    base_template:
      type: string
get_template_response:
  type: object
  properties:
    template:
      $ref: '#/sandbox_template'
list_templates_response:
  type: object
  properties:
    templates:
      type: array
      items:
        $ref: '#/sandbox_template'
    next_page_token:
      type: string
delete_template_response:
  type: object
  properties:
    template_id:
      type: string
      format: uuid
    deleted:
      type: boolean
get_template_build_response:
  type: object
  properties:
    build:
      $ref: '#/sandbox_template_build'
list_template_builds_response:
  type: object
  properties:
    builds:
      type: array
      items:
        $ref: '#/sandbox_template_build'
    next_page_token:
      type: string

exec_in_sandbox_request:
  type: object
  properties:
    argv:
      type: array
      items:
        type: string
      description: Program and arguments. Required and non-empty; run directly, with no shell interpretation.
      example:
        - uname
        - '-a'
    workdir:
      type: string
      description: >-
        Working directory inside the sandbox. Empty uses the sandbox default (/workspace); not
        restricted to the workspace root.
      example: /workspace
    stdin:
      type: string
      format: byte
      description: >-
        Optional base64 stdin payload, delivered in full and then closed so the process sees EOF.
        One-shot only — there is no streaming stdin on this endpoint.
      example: ''
    timeout_seconds:
      type: integer
      format: int64
      description: >-
        Optional timeout. Clamped server-side (default 60, maximum 240) regardless of the value
        sent.
      example: 60
  required:
    - argv

exec_in_sandbox_response:
  type: object
  properties:
    exit_code:
      type: integer
      format: int32
      description: The guest process's exit code. Non-zero is still a 200 response.
      example: 0
    stdout:
      type: string
      description: Buffered stdout, capped at 1 MiB. Check X-Exec-Stdout-Truncated for drops.
      example: Linux
    stderr:
      type: string
      description: Buffered stderr, capped at 1 MiB. Check X-Exec-Stderr-Truncated for drops.
      example: ''
    duration_ms:
      type: integer
      format: int64
      description: Wall-clock duration the guest reported for the command.
      example: 12

trigger_kind:
  type: string
  enum:
    - webhook
    - cron
  description: How the trigger fires - on an event (webhook) or on a schedule (cron). Immutable after create.
  example: webhook

trigger_status:
  type: string
  enum:
    - active
    - paused
  description: Trigger lifecycle state. Soft-deleted triggers are never returned (404).
  example: active

trigger_session_mode:
  type: string
  enum:
    - fresh
    - reuse
  description: >-
    fresh = a new session is created from the trigger's spec on every firing and destroyed after.
    reuse = the trigger binds an existing PAUSED session, resumed on each firing and paused after;
    multiple triggers may bind one session.
  example: fresh

trigger_output_mode:
  type: string
  enum:
    - none
    - email
    - slack
  description: >-
    none = nothing pushed; the result stays in run history for self-serve. email = the collected run
    output is emailed to a configured address. slack = the collected run output is posted to a Slack
    incoming webhook URL (channel fixed by the webhook at install time).
  example: email

webhook_provider_key:
  type: string
  enum:
    - github
    - gitlab
    - custom
  description: Signature-verification scheme applied to a delivery. Omitted on create defaults to custom.
  example: github

trigger_execution_status:
  type: string
  enum:
    - pending
    - running
    - succeeded
    - failed
  description: Per-firing outcome.
  example: succeeded

webhook_signature_scheme:
  type: string
  enum:
    - hmac-sha256
    - plaintext
    - do-signature-v1
  description: >-
    How the external system authenticates a delivery: hmac-sha256 over the raw body (github), a
    plaintext token replayed verbatim (gitlab), or do-signature-v1 (`t=<unix>,v1=<hex>` over
    `{unix}.{body}`, custom).
  example: hmac-sha256

slack_output_write:
  type: object
  description: >-
    Slack destination on create/update. webhook_url is required when mode=slack; must be
    https://hooks.slack.com/services/...; stored encrypted and never returned.
  required:
    - webhook_url
  properties:
    webhook_url:
      type: string
      description: Slack incoming webhook URL (https://hooks.slack.com/services/...). The channel is bound to this URL at install time.
      example: https://hooks.slack.com/services/T0000/B0000/XXXX

trigger_output_read:
  type: object
  description: Output-delivery configuration as seen on reads. The email address and Slack webhook URL are write-only and never returned.
  properties:
    mode:
      $ref: '#/trigger_output_mode'
    email_configured:
      type: boolean
      description: True when an email address is stored (mode=email).
      example: true
    slack_configured:
      type: boolean
      description: True when a Slack incoming webhook URL is stored (mode=slack).
      example: false

trigger_output_write:
  type: object
  description: >-
    Output-delivery configuration on create/update. Exactly one of email / slack is required for the
    matching mode and forbidden otherwise; destinations are stored encrypted and never returned.
  required:
    - mode
  properties:
    mode:
      $ref: '#/trigger_output_mode'
    email:
      type: string
      description: Destination address; required iff mode=email.
      example: oncall@example.com
    slack:
      $ref: '#/slack_output_write'

webhook_config:
  type: object
  description: Present iff kind=webhook. The secret is never in this object (see create_trigger_response / rotate_secret_response).
  properties:
    provider:
      $ref: '#/webhook_provider_key'
    webhook_url:
      type: string
      description: The Payload URL to configure in the external system.
      example: https://api.digitalocean.com/v2/agents/triggers/b1a0.../webhook

cron_config:
  type: object
  description: Present iff kind=cron.
  properties:
    cron_expr:
      type: string
      description: Cron expression; must parse with the scanner's cron library.
      example: 0 9 * * 1-5
    timezone:
      type: string
      description: IANA timezone (e.g. "America/New_York").
      example: America/New_York
    next_run_at:
      type: string
      format: date-time
      description: Read-only; server-computed next fire time.
      example: '2026-07-27T13:00:00Z'

trigger:
  type: object
  description: >-
    A single automation bound to exactly one agent/session (agent == session in v1). The nested block
    present depends on `kind` (webhook xor cron) and `session_mode` (fresh => session_template; reuse
    => bound_session_id). `agent_kind` is read-only and derived; the webhook secret, the output email
    address / Slack webhook URL, and any env values inside session_template are write-only and never
    returned.
  properties:
    trigger_id:
      type: string
      description: Server-allocated UUID; opaque to clients.
      example: b1a0c6de-1f2e-4a3b-9c8d-0e1f2a3b4c5d
    kind:
      $ref: '#/trigger_kind'
    name:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$
      description: Unique per team among non-deleted triggers. Same rules as session names; not UUID-form.
      example: nightly-deploy-check
    status:
      $ref: '#/trigger_status'
    session_mode:
      $ref: '#/trigger_session_mode'
    agent_kind:
      $ref: '#/agent_kind'
    prompt_template:
      type: string
      description: The prompt sent on each fire. Opaque to clients; payload-interpolation syntax is server-defined. For cron triggers it must not reference payload placeholders.
      example: Review the latest push and summarize risks.
    output:
      $ref: '#/trigger_output_read'
    session_template:
      type: string
      description: Present iff session_mode=fresh. The agents.yaml Agent manifest used to CREATE a session on each fire, returned with its env values REDACTED.
      example: ''
    bound_session_id:
      type: string
      format: uuid
      description: Present iff session_mode=reuse. UUID of the existing PAUSED session this trigger resumes; may be shared by multiple triggers.
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    webhook:
      $ref: '#/webhook_config'
    cron:
      $ref: '#/cron_config'
    created_at:
      type: string
      format: date-time
      example: '2026-07-27T12:00:00Z'
    updated_at:
      type: string
      format: date-time
      example: '2026-07-27T12:00:00Z'

create_webhook_config:
  type: object
  description: webhook block on create. Omitting provider defaults to custom.
  properties:
    provider:
      $ref: '#/webhook_provider_key'

create_cron_config:
  type: object
  description: cron block on create.
  required:
    - cron_expr
    - timezone
  properties:
    cron_expr:
      type: string
      example: 0 9 * * 1-5
    timezone:
      type: string
      description: IANA timezone.
      example: America/New_York

create_trigger_request:
  type: object
  description: See the CreateTrigger operation description for the conditional-requirement matrix. team_id is NOT accepted here - it is derived from the authenticated principal.
  required:
    - kind
    - name
    - session_mode
    - prompt_template
    - output
  properties:
    kind:
      $ref: '#/trigger_kind'
    name:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$
      description: Team-unique (among non-deleted triggers) trigger name. Same rules as session names; not UUID-form.
      example: nightly-deploy-check
    session_mode:
      $ref: '#/trigger_session_mode'
    prompt_template:
      type: string
      description: The prompt sent on each fire. For cron it must not contain payload-interpolation placeholders.
      example: Review the latest push and summarize risks.
    output:
      $ref: '#/trigger_output_write'
    session_template:
      type: string
      description: fresh only. Full agents.yaml Agent manifest (YAML or JSON). Any embedded env values are split out and encrypted server-side.
      example: ''
    bound_session_id:
      type: string
      format: uuid
      description: reuse only. UUID of an existing session owned by the team.
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    webhook:
      $ref: '#/create_webhook_config'
    cron:
      $ref: '#/create_cron_config'

update_trigger_request:
  type: object
  description: Partial update. Only the supplied fields change. kind and webhook.provider are immutable. Sending status alone is how pause/re-enable work.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$
      description: New team-unique trigger name. Same charset/length rules as create.
      example: nightly-deploy-check
    status:
      $ref: '#/trigger_status'
    prompt_template:
      type: string
      example: Review the latest push and summarize risks.
    output:
      $ref: '#/trigger_output_write'
    session_template:
      type: string
      description: fresh triggers only. A session_template PATCH is a full replacement of the stored template; you must resupply every spec.secrets slot value the new manifest declares, or the request is a 400.
      example: ''
    bound_session_id:
      type: string
      format: uuid
      description: reuse triggers only. UUID of an existing session owned by the team.
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    cron:
      $ref: '#/create_cron_config'

create_trigger_response:
  type: object
  properties:
    trigger:
      $ref: '#/trigger'
    webhook_secret:
      type: string
      description: The generated webhook secret. Present for webhook triggers only and shown EXACTLY ONCE - it is never returned again. Paste it into the external system's webhook configuration.
      example: whsec_a1b2c3d4e5f6

get_trigger_response:
  type: object
  properties:
    trigger:
      $ref: '#/trigger'

list_triggers_response:
  type: object
  properties:
    triggers:
      type: array
      items:
        $ref: '#/trigger'
    next_page_token:
      type: string
      description: Opaque cursor for the next page. Empty when there are no further pages.
      example: ''

rotate_secret_response:
  type: object
  properties:
    webhook_secret:
      type: string
      description: The new webhook secret, shown once.
      example: whsec_f6e5d4c3b2a1
    previous_secret_expires_at:
      type: string
      format: date-time
      description: The instant the outgoing secret stops verifying deliveries. Omitted when grace_period_seconds=0.
      example: '2026-07-27T12:05:00Z'
    previous_secret_revoked:
      type: boolean
      description: True when grace_period_seconds=0 retired the old secret on this call. Exactly one of this and previous_secret_expires_at is present.
      example: false

trigger_execution:
  type: object
  description: One row per firing (webhook delivery or cron tick).
  properties:
    execution_id:
      type: string
      example: 7c1f9e2a-3b4c-5d6e-7f80-91a2b3c4d5e6
    trigger_id:
      type: string
      example: b1a0c6de-1f2e-4a3b-9c8d-0e1f2a3b4c5d
    status:
      $ref: '#/trigger_execution_status'
    session_id:
      type: string
      description: The run's session. Populated once the session is created (fresh) or is known (reuse); empty before then.
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    run_id:
      type: string
      description: Populated once SendInput acks; correlation/audit only. May be empty.
      example: ''
    failure_reason:
      type: string
      description: Client-safe reason when status=failed; absent otherwise. One of a fixed set of messages; do not parse it or match on substrings. Quote the execution_id when contacting support.
      example: ''
    created_at:
      type: string
      format: date-time
      example: '2026-07-27T12:00:00Z'
    updated_at:
      type: string
      format: date-time
      example: '2026-07-27T12:00:05Z'
    payload:
      type: string
      description: The raw webhook body or cron tick metadata. Returned by GetTriggerExecution only; omitted from list items. Cleared for terminal executions after the payload retention window (default 7 days from creation).
      example: ''
    output_text:
      type: string
      description: The doctl-parity transcript rendered from the run's SPI events. Returned by GetTriggerExecution only; omitted from list items.
      example: ''
    output_truncated:
      type: boolean
      description: True when output_text is incomplete. Returned by GetTriggerExecution only; omitted from list items.
      example: false

list_trigger_executions_response:
  type: object
  properties:
    executions:
      type: array
      items:
        $ref: '#/trigger_execution'
    next_page_token:
      type: string
      description: Opaque cursor for the next page. Empty when there are no further pages.
      example: ''

get_trigger_execution_response:
  type: object
  properties:
    execution:
      $ref: '#/trigger_execution'

webhook_provider_signature:
  type: object
  properties:
    header:
      type: string
      description: HTTP header the external system sends the signature/token in.
      example: X-Hub-Signature-256
    scheme:
      $ref: '#/webhook_signature_scheme'

webhook_provider:
  type: object
  properties:
    key:
      $ref: '#/webhook_provider_key'
    display_name:
      type: string
      example: GitHub
    description:
      type: string
      example: Verify deliveries with an HMAC-SHA256 signature over the raw body.
    docs_url:
      type: string
      example: https://docs.github.com/webhooks
    paste_hint:
      type: string
      description: Per-provider instruction for where the generated secret goes in the external system.
      example: Paste into the webhook's Secret field.
    signature:
      $ref: '#/webhook_provider_signature'

list_webhook_providers_response:
  type: object
  properties:
    providers:
      type: array
      items:
        $ref: '#/webhook_provider'

reusable_session:
  type: object
  description: The hosted-agents Session shape (subset), returned verbatim from an internal ListSessions(status=PAUSED). Enum spellings match the sessions API.
  properties:
    session_id:
      type: string
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    name:
      type: string
      example: demo-agent
    agent_kind:
      $ref: '#/agent_kind'
    status:
      $ref: '#/session_status'
    created_at:
      type: string
      format: date-time
      example: '2026-07-27T12:00:00Z'
    last_event_at:
      type: string
      format: date-time
      example: '2026-07-27T12:00:00Z'

list_reusable_sessions_response:
  type: object
  properties:
    sessions:
      type: array
      items:
        $ref: '#/reusable_session'
    next_page_token:
      type: string
      description: Opaque cursor for the next page. Empty when there are no further pages.
      example: ''

webhook_accepted_response:
  type: object
  properties:
    execution_id:
      type: string
      description: The queued (or deduped-existing) execution. Absent when the trigger is paused (202 with empty body).
      example: 7c1f9e2a-3b4c-5d6e-7f80-91a2b3c4d5e6

stream_state:
  type: object
  description: >-
    Body carried in the `data` of a `stream.state` control frame. It describes the stream itself, not
    an agent event; render it as status rather than transcript. Emitted by OHP, which opens every
    stream with one.
  properties:
    state:
      type: string
      enum:
        - catching_up
        - live
        - degraded
        - superseded
        - rolled_back
      description: >-
        catching_up (replay being written; always first), live (replay done, now following the
        session), degraded (still delivering but a dependency is impaired), superseded (another attach
        from the same device took over; do not auto-reconnect), rolled_back (session restored to an
        earlier checkpoint; reconnect head-anchored after discarding the resume cursor).
      example: live
    cursor:
      type: string
      description: Position the client should resume from; empty while the position is not whole.
      example: ''
    truncated:
      type: boolean
      description: Set on catching_up when the window skipped events between the client's resume point and what was sent.
      example: false

ingress_url_state:
  type: string
  enum:
    - INGRESS_URL_STATE_PENDING
    - INGRESS_URL_STATE_READY
  description: 'PENDING: route not yet published, URL not servable. READY: servable. There is no failed state; the substrate retries until READY.'
  example: INGRESS_URL_STATE_READY

session_ingress_url:
  type: object
  description: >-
    A publicly routable HTTPS URL to one guest port of the session's sandbox. The hostname is stable
    while the session runs; it is revoked on pause and lock, and rollback moves the session to a new
    sandbox, so re-fetch after resume, unlock or rollback. Requests must carry the caller's DO token as
    a Bearer header.
  properties:
    ingress_url_id:
      type: string
      example: 3f2a1b0c-9d8e-7f6a-5b4c-3d2e1f0a9b8c
    session_id:
      type: string
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    port:
      type: integer
      format: int64
      description: Guest port the URL fronts; 8000 (OpenHands Agent Server) today.
      example: 8000
    url:
      type: string
      description: Immutable HTTPS origin, e.g. https://<id>.nyc3.sandbox.ondigitalocean.com.
      example: https://abc123.nyc3.sandbox.ondigitalocean.com
    state:
      $ref: '#/ingress_url_state'
    created_at:
      type: string
      format: date-time
      example: '2026-07-27T12:00:00Z'

get_ingress_url_response:
  type: object
  properties:
    ingress_url:
      $ref: '#/session_ingress_url'
