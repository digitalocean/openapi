lang: bash
source: |-
  curl -X PATCH \
    -H "Content-Type: application/json" \
    -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
    -d '{"manifest_yaml":"permissions:\n  defaultAction: ask\n  rules:\n    - tool: bash\n      match: {command: npm test}\n      action: allow\n    - tool: web.fetch\n      action: deny\n"}' \
    "https://api.digitalocean.com/v2/harness-runtime/sessions/{session_id}"
label: cURL (permissions)
