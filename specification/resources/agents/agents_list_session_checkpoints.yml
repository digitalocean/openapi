operationId: harness_list_session_checkpoints
summary: ListCheckpoints enumerates a session's checkpoints, newest first.
description: Keyset-paginated on an opaque cursor, like ListSessions.
tags:
- Harness Runtime
parameters:
- in: path
  name: session_id
  required: true
  description: The session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
- in: query
  name: page_size
  required: false
  description: Page size. Defaults to 50 when omitted or non-positive.
  schema:
    type: integer
    format: int32
    example: 50
  example: 50
- in: query
  name: page_token
  required: false
  description: Opaque keyset cursor returned by the previous page. Empty starts from the beginning.
  schema:
    type: string
    example: ''
  example: ''
responses:
  '200':
    description: A successful response.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/list_checkpoints_response
  '400':
    description: Invalid page_token.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: Session belongs to another team.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '423':
    description: This session is unavailable; contact support.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_list_session_checkpoints.yml
security:
- bearer_auth:
  - agent_harness_session:read
