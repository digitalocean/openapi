operationId: harness_update_subagent_run
summary: UpdateSwarmRun records the parent's verdicts on tasks in a swarm run.
description: >-
  Records one verdict per listed task: `accept`, `reject` or `cancel`. Each verdict presents the
  task's current `attempt` as a fence, so a verdict on a result that was since superseded cannot
  land. The verdicts are applied together: if any one is refused, none is recorded and the 409
  names the task. The platform records the verdict; it never judges the result.


  To steer, interrupt, stop or read one child, use the existing session routes on the task's
  `session_id` (input, cancel, delete and events); this route only records verdicts. Agent swarms
  must be enabled for the team; otherwise the route answers 404.
tags:
- Harness Runtime
parameters:
- in: path
  name: session_id
  required: true
  description: The parent session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
- in: path
  name: run_id
  required: true
  description: The swarm run id returned when the run was created.
  schema:
    type: string
    format: uuid
    example: 9b2e6f10-4c3a-4d7e-8a15-0f6d2c9e7b41
  example: 9b2e6f10-4c3a-4d7e-8a15-0f6d2c9e7b41
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/definitions.yml#/update_swarm_run_request
responses:
  '200':
    description: Verdicts recorded. Returns the run and its tasks.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/get_swarm_run_response
  '400':
    description: >-
      Malformed JSON; no `tasks`; a task listed twice; a missing `task_id`, `attempt` or
      `verdict`; or a `reject` without `note`.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: >-
      The caller holds no access grant on the session, or the caller is a child session: only the
      parent may call these routes.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: >-
      Branch on `id`. `out_of_bounds`: an accepted result touches a path outside the task's
      `owned_paths`. `stale_attempt`: the presented `attempt` is no longer the task's current
      attempt (the task was abandoned and reopened); read the run again and decide on the new
      attempt. Otherwise a task is not in a status that takes this verdict (only an `integrating`
      task takes `accept` or `reject`, and a `done` task cannot be cancelled), or the run or the
      parent session is not running.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_update_subagent_run.yml
security:
- bearer_auth:
  - agent_harness_session:operate
