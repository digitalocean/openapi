operationId: harness_delete_workspace
summary: Delete a persistent workspace.
description: >-
  Permanently deletes a persistent workspace and its files. Only a workspace that is `AVAILABLE` or
  `FAILED` can be deleted; remove the session that holds it first. Workspaces are never deleted
  automatically.
tags:
- Harness Runtime
parameters:
- in: path
  name: workspace_id
  required: true
  description: The workspace ID. Workspace names are not accepted.
  schema:
    type: string
    example: 019a2f4e-8c1d-7b3a-9e5f-2d6c8a1b4e70
  example: 019a2f4e-8c1d-7b3a-9e5f-2d6c8a1b4e70
responses:
  '204':
    description: Workspace deleted; no response body.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: The request has no user identity.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: >-
      The workspace is attached to a session, is still being saved, or cannot be deleted right now.
      Remove the session that holds it, or retry.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '501':
    description: Persistent workspaces are not enabled for this team.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '503':
    description: Workspace state is temporarily unavailable. Retry.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_delete_workspace.yml
security:
- bearer_auth:
  - agent_harness_session:manage
