operationId: harness_update_session
summary: Update a session's settings.
description: |-
  Updates the settings of an existing session. Changes apply to this session only; the agent
  config the session was created from is not modified.

  Each request makes one of two kinds of update, and the two can't be combined:

  - **Session preferences**: set `resume_on_topoff`. Applied immediately; returns `200`.
  - **Session settings**: set `manifest_yaml` to a partial manifest that holds only the sections
    to change. Applied in the background; returns `202`.

  An empty body (`{}`) returns `400`.

  ### Updatable session settings

  | Section | What it changes | Agent restart |
  | --- | --- | --- |
  | `tools` | The session's Action Gateway tools (`do.actions` entries). Custom MCP servers can't be changed. | No (LangGraph and CrewAI: yes) |
  | `env` | Environment variables (name and value). | Yes |
  | `env.HARNESS_INFERENCE_MODEL` | The model, for sessions that use DigitalOcean Serverless Inference. | Yes |
  | `secrets` | Plain secrets (name and value). | Yes |
  | `permissions` | The permission policy: the default action and the full rules list. What can change depends on the agent; see below. | No (LangGraph: yes for `do.actions` rules or `default`) |

  Sections you omit are not changed. Each section you include replaces that section in full; see
  `manifest_yaml` for the exact rules.

  The only way to change a session's model is to set `HARNESS_INFERENCE_MODEL` in `env`. This
  works only for sessions that were created with a DigitalOcean Serverless Inference model;
  sessions that use a third-party model provider can't change their model. A top-level `model`
  section returns `400`.

  The following can't be changed on an existing session: custom MCP servers (`422`), egress rules,
  GitHub OAuth connections, URL-bound secrets, and platform-managed model keys. To use a different
  custom MCP server, create a new session.

  ### Changing permissions

  `permissions` replaces the whole policy: `default` and the full `rules` list. A rule you leave
  out is removed. Use the same fields as when you create the session. `permissions: {}` removes
  the policy, so the agent goes back to its built-in default. `permissions: null` returns `400`.

  The agent is not restarted; the new rules apply from its next tool call once the update is
  `APPLIED`. On `langgraph`, a change to `do.actions/<tool>` rules or `default` restarts the
  agent, as a `tools` change does.

  Only sessions created after live permissions updates were released can change `permissions`.
  An older session returns `409`; create a new session instead.

  What can change depends on the session's agent:

  - `claude-code`, `opencode`: `default` and every rule type (`bash`, `file.read`, `file.write`,
    `web.fetch`, `mcp`, `do.actions/<tool>`), with `allow`, `ask`, or `deny`.
  - `openhands`: `default` and `bash`, `file.read`, `file.write`, and `web.fetch` rules. Not
    `mcp` or `do.actions/<tool>` rules.
  - `codex`: `default` and `bash` and `do.actions/<tool>` rules, with `allow`, `ask`, or `deny`.
    Not `file.read`, `file.write`, `web.fetch`, or `mcp` rules.
  - `hermes`, `langgraph`: `do.actions/<tool>` rules with `allow` or `deny`, and `default` set to
    `allow` or `deny`. Not `ask`, and no other rule types.
  - `crewai`, `cursor`, and any other agent: nothing.

  `permissions.filesystem` and `permissions.network` can't be changed on any agent.

  Only the differences from the current policy are checked: rules you add, remove, or change, and
  a changed `default`. Rules you keep as they are never cause a refusal.

  If any change can't be applied on the session's agent, the request returns `409` and nothing is
  applied, including changes to other sections. The error message names the unsupported changes
  and what the agent can change. Remove them and send the update again. For example:

  ```
  permissions can't change live on hermes for: bash rule "rm -rf *" (only do.actions allow/deny rules can change on this agent). Remove these changes and send the update again (update_unsupported)
  ```

  If the agent itself refuses a change after the request is accepted, the update ends `FAILED`
  with `session.update.reverted` set to `true`, and `session.update.detail` says to remove the
  permission changes the agent can't take and send the update again.

  ### Tracking an update

  1. A request that changes the session settings returns `202` with `outcome` set to `ACCEPTED`.
     The session status becomes `SESSION_STATUS_UPDATING`.
  2. Poll [`GET /v2/harness-runtime/sessions/{session_id}`](#operation/harness_get_session)
     every 2 to 5 seconds until the status is `SESSION_STATUS_READY`, or `SESSION_STATUS_PAUSED`
     if the session was paused when you sent the update. The session returns to that status
     whether the update succeeded or failed.
  3. Read `session.update.state`:
     - `APPLIED`: the update is live.
     - `APPLIED_RESTARTED`: the update is live and the agent was restarted to apply it.
     - `FAILED`: the update did not take effect. `session.update.detail` explains why, and
       `session.update.reverted` is `true` if the previous settings were restored.

  Tool updates usually finish within a few seconds, except on `langgraph` and `crewai`, where
  they restart the agent. Updates to `env` (including the model) or `secrets` restart the agent
  and can take up to about two minutes.

  If the request matches the session's current settings, it returns `200` with `outcome` set to
  `UNCHANGED` and nothing is applied.

  ### Versioning

  Each accepted update is recorded with its own `update_id` and the manifest hashes before and
  after the change (`session.update.previous_hash` and `session.update.manifest_hash`). When an
  update fails, the session is rolled back to its previous settings and `session.update.reverted`
  is `true`. Once a session's settings differ from its agent config, the session reports
  `config_drifted: true`, `config_diff` lists the changed entries, and `manifest` holds the
  settings the session now runs with (without secret values).

  ### Requirements

  - The session status must be `SESSION_STATUS_READY`, `SESSION_STATUS_DETACHED`, or
    `SESSION_STATUS_PAUSED`. A paused session is resumed to apply the update and paused again
    afterwards, unless it was paused for zero balance. Any other status returns `409`, including
    `SESSION_STATUS_PROVISIONING`, `SESSION_STATUS_UPDATING`, a session paused for zero balance,
    and a destroyed or failed session. A locked session returns `423`.
  - The session must be idle: no agent turn running and no approval pending (`409`).
  - Session settings updates must be enabled for your team.
  - Not every agent runtime supports every section, or every `permissions` change (see Changing
    permissions above). An unsupported change returns `409`, and nothing is applied.
tags:
- Harness Runtime
parameters:
- in: path
  name: session_id
  required: true
  description: The session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/definitions.yml#/patch_session_request
  description: Set either `resume_on_topoff` or `manifest_yaml`, not both.
responses:
  '200':
    description: >-
      The session was updated (`resume_on_topoff`), or the requested session settings match the
      current ones and nothing was applied (`outcome` is `UNCHANGED`).
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/patch_session_response
  '202':
    description: >-
      The session settings update was accepted and is being applied. The session status is
      `SESSION_STATUS_UPDATING`. Poll the session until the status is `SESSION_STATUS_READY`, or
      `SESSION_STATUS_PAUSED` if the session was paused when you sent the update, then read
      `session.update` to see whether the update was applied.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/patch_session_response
  '400':
    description: >-
      The request is invalid. For example: the body is empty or not valid JSON, `manifest_yaml` is
      not valid YAML, a field or manifest section is not recognized, a value is invalid, or both
      `resume_on_topoff` and `manifest_yaml` are set. A top-level `model` section (set
      `env.HARNESS_INFERENCE_MODEL` instead) and `permissions: null` also return `400`.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: >-
      You don't have access to this session, or session settings updates are not enabled for your
      team (`manifest_yaml` only).
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: >-
      The session can't be updated right now. For example, it is still provisioning, already
      updating, running an agent turn, waiting on an approval, paused for zero balance, or
      destroyed, or its agent runtime doesn't support the change. The error message gives the
      reason. For a `permissions` change the agent can't apply, the message names the unsupported
      changes and ends with `(update_unsupported)`; nothing is applied, so remove them and send
      the update again. A session created before live permissions updates were released can't
      change `permissions`; create a new session.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '422':
    description: >-
      The change can only be made by creating a new session. For example: adding, removing, or
      changing a custom MCP server in `tools`, changing a reserved platform key or a secret that is
      not a plain value (such as a URL-bound or OAuth secret), or
      adding, removing, or changing `HARNESS_INFERENCE_MODEL` on a session that doesn't use
      DigitalOcean Serverless Inference.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '423':
    description: The session is unavailable. Contact support.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_update_session.yml
- $ref: examples/curl/agents_update_session_permissions.yml
security:
- bearer_auth:
  - agent_harness_session:manage
