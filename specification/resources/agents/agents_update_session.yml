operationId: harness_update_session
summary: PatchSession updates an existing session (session-scoped settings or live config).
description: >-
  Partial update of an existing session. Send exactly one of: `resume_on_topoff` (session-scoped
  consent), or `manifest_yaml` (live config update of `tools`, `env` and `secrets`). The two cannot be
  combined, and `{}` is 400. With `manifest_yaml`, absent sections are untouched; `model` and
  `permissions` return 501. A config update that changes something returns 202 with outcome ACCEPTED and
  the session in SESSION_STATUS_UPDATING (update state APPLYING): poll GET on the session every 2-5
  seconds until the status leaves UPDATING, then read `session.update` (APPLIED, APPLIED_RESTARTED or
  FAILED). A tools-only update usually finishes in seconds; env and secret changes restart the agent and
  can take about two minutes. A manifest that changes nothing returns 200 with outcome UNCHANGED.
  Terminal sessions (DESTROYED, FAILED) cannot be patched.
tags:
- Harness Runtime
parameters:
- in: path
  name: session_id
  required: true
  description: The session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/definitions.yml#/patch_session_request
  description: 'PATCH body: either resume_on_topoff or manifest_yaml (not both).'
responses:
  '200':
    description: Updated session snapshot, or outcome UNCHANGED when a manifest changes nothing.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/patch_session_response
  '202':
    description: Config update accepted and applying; the session is SESSION_STATUS_UPDATING. Poll the session until the status changes.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/patch_session_response
  '400':
    description: 'Malformed body, invalid YAML, unknown field or manifest section, invalid values, both properties set, or no recognized patchable properties.'
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: Session belongs to another team, or the team is not enrolled in the config-update feature (manifest_yaml only).
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: Session is in a terminal state, not running, paused for zero balance, already updating, busy, or does not support the change (for example env and secrets on a non-hermes session). The message says which.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '422':
    description: The change needs a new session (requires_new_session).
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '423':
    description: This session is unavailable; contact support.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '501':
    description: '`model` or `permissions` sent in manifest_yaml; not supported yet.'
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_update_session.yml
security:
- bearer_auth:
  - agent_harness_session:manage
