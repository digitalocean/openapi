operationId: harness_delete_subagent_run
summary: DestroySwarmRun stops a swarm run and its children.
description: >-
  Moves the run to `cancelled`, moves every task that has not reached a terminal status to
  `cancelled`, and destroys the live child sessions after a short grace period. Idempotent:
  destroying a run that is already finished, or already destroyed, still answers 204; only a run
  the caller never had answers 404. Results the parent already accepted are not undone. Never
  billing-gated, so a team blocked at the prepay gate can still stop spend. Agent swarms must be
  enabled for the team; otherwise the route answers 404.
tags:
- Harness Runtime
parameters:
- in: path
  name: session_id
  required: true
  description: The parent session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
- in: path
  name: run_id
  required: true
  description: The swarm run id returned when the run was created.
  schema:
    type: string
    format: uuid
    example: 9b2e6f10-4c3a-4d7e-8a15-0f6d2c9e7b41
  example: 9b2e6f10-4c3a-4d7e-8a15-0f6d2c9e7b41
responses:
  '204':
    description: The run is stopped; no response body.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: >-
      The caller holds no access grant on the session, or the caller is a child session: only the
      parent may call these routes.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_delete_subagent_run.yml
security:
- bearer_auth:
  - agent_harness_session:operate
