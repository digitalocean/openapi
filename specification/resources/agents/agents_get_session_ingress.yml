operationId: harness_get_session_ingress
summary: GetIngressURL returns the public HTTPS URL of the session's OpenHands Agent Server.
description: |-
  Publishes the URL on first call and returns it. Idempotent while the session runs: the same URL is
  returned until the session is paused, locked or rolled back, after which the next call returns a new
  hostname (pause and lock revoke the URL; rollback moves the session to a new sandbox, so re-fetch
  after resume, unlock or rollback). The URL fronts guest port 8000 (the OpenHands Agent Server,
  HTTP + WebSocket) and replaces the port-forward bridge for browser clients. Requests to the URL carry
  the caller's DO token as a Bearer header. Poll until `state` is INGRESS_URL_STATE_READY; there is no
  failed state. Only OpenHands sessions support ingress, and it is gated per team.
tags:
- Harness Runtime
parameters:
- in: path
  name: session_id
  required: true
  description: The session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
responses:
  '200':
    description: A successful response.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/get_ingress_url_response
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: Session belongs to another team.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: Session is not running.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '423':
    description: This session is unavailable; contact support.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '501':
    description: Public ingress is not supported for this agent kind or sandbox substrate.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_get_session_ingress.yml
security:
- bearer_auth:
  - agent_harness_session:read
