operationId: harness_cancel_session_turn
summary: Cancel the agent turn in flight.
description: Stops the turn `POST /input` started. Pass `run_id` from that response to name the turn;
  an empty body cancels whichever turn is in flight. `outcome` is `acked` when the agent accepted the
  interrupt, `no_turn` when nothing addressable was running, and `unsupported` when this agent cannot
  be interrupted. A team that is not enabled for turn cancel receives 403. A cancel starts nothing and
  is not blocked by the prepayment gate.
tags:
- Harness Runtime
parameters:
- in: path
  name: session_id
  required: true
  description: The session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
requestBody:
  required: false
  content:
    application/json:
      schema:
        $ref: models/definitions.yml#/cancel_session_turn_request
responses:
  '200':
    description: The cancel was delivered. See `outcome` for what the agent did with it.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/cancel_session_turn_response
  '400':
    description: The body is not valid JSON.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: The session belongs to another team, or this team is not enabled for turn cancel.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '503':
    description: The agent is not accepting requests yet. Retry once the session is ready.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_cancel_session_turn.yml
security:
- bearer_auth:
  - agent_harness_session:operate
