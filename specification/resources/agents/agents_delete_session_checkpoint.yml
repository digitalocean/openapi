operationId: agents_delete_session_checkpoint
summary: DeleteCheckpoint removes a checkpoint and its underlying machine-state capture.
description: 'Idempotent: deleting an already-gone checkpoint still returns 200. Removes the DB row and the substrate checkpoint.'
tags:
- Harness Runtime
parameters:
- in: path
  name: session_id
  required: true
  description: The session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
- in: path
  name: checkpoint_id
  required: true
  description: The checkpoint id.
  schema:
    type: string
    example: cp_9f2c1a4b
  example: cp_9f2c1a4b
responses:
  '200':
    description: Checkpoint deleted.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/delete_checkpoint_response
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    description: Session belongs to another team.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '404':
    $ref: ../../shared/responses/not_found.yml
  '423':
    description: This session is unavailable; contact support.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_delete_session_checkpoint.yml
security:
- bearer_auth:
  - agents:delete
