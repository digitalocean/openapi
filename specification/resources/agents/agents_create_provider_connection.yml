operationId: harness_create_provider_connection
summary: Create a provider connection for one actor.
description: Creates the connection `{provider}` will use for `user_id`. `user_id` is the actor
  identifier the connection acts for, not a DigitalOcean user id. Each actor has at most one active,
  pending, or expired connection per provider. If `user_id` already has one, the request fails with
  `409`. Find that connection's id with `GET /v2/agents/auth/{provider}/connections?user_id=...`, then
  resume or restart it with `POST /v2/agents/auth/{provider}/connections/{connection_id}/reconnect`,
  which keeps its scopes. Revoked connections do not count toward the limit, and list responses omit
  them. If the only connection `user_id` has for `{provider}` is revoked, for example by `DELETE`,
  create starts it again under the same connection id, with the scopes in this request. To change a
  connection's scopes, delete it and then create it. A successful create returns the connection as
  `pending`, with an `authorization` object for the interactive step. No token is returned. `github`
  is the provider served today.
tags:
- Harness Runtime
parameters:
- in: path
  name: provider
  required: true
  description: Provider key. `github` is the provider served today.
  schema:
    type: string
    example: github
  example: github
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/definitions.yml#/create_provider_connection_request
responses:
  '200':
    description: The new connection, `pending`, with the authorization steps the user has to complete.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/provider_connection_response
  '400':
    description: The body is missing, is not the documented JSON object, or omits `user_id`.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: '`user_id` already has an active, pending, or expired connection for `{provider}`. List the connections filtered by `user_id` to find its id, then reconnect it.'
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '501':
    description: Provider connections are not enabled.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_create_provider_connection.yml
security:
- bearer_auth:
  - agent_harness_session:create
