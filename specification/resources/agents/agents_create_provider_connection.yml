operationId: harness_create_provider_connection
summary: Create a provider connection for one actor.
description: Creates the connection `{provider}` will use for `user_id`. `user_id` is the actor
  identifier the connection acts for, not a DigitalOcean user id. Each actor has at most one connection
  per provider; if `user_id` already has an active, pending, or expired connection for `{provider}`, the
  request fails with `409`, and `POST /v2/agents/auth/{provider}/connections/{connection_id}/reconnect`
  resumes or restarts it instead. The response includes an `authorization` object while the user still
  has to complete the interactive step. No token is returned. `github` is the provider served today.
tags:
- Harness Runtime
parameters:
- in: path
  name: provider
  required: true
  description: Provider key. `github` is the provider served today.
  schema:
    type: string
    example: github
  example: github
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/definitions.yml#/create_provider_connection_request
responses:
  '200':
    description: The connection, plus authorization steps when it is still pending.
    headers:
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/provider_connection_response
  '400':
    description: The body is missing, is not the documented JSON object, or omits `user_id`.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    description: '`user_id` already has an active, pending, or expired connection for `{provider}`. Reconnect it instead.'
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '501':
    description: Provider connections are not enabled.
    headers: *id001
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/error
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_create_provider_connection.yml
security:
- bearer_auth:
  - agent_harness_session:create
