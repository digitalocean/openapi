operationId: harness_get_trigger_by_session
summary: Get the newest trigger bound to a session, or the trigger of its newest execution.
description: >-
  Returns the newest trigger whose bound session is this one. Deleted triggers are skipped.
  When none is bound, returns the trigger of the newest execution for this session, again
  skipping deleted triggers. A session can be bound to more than one trigger; only the newest
  is returned. 404 when neither lookup matches.
tags:
- Harness Runtime
parameters:
- in: path
  name: session_id
  required: true
  description: The session UUID.
  schema:
    type: string
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
responses:
  '200':
    description: The newest trigger bound to this session, or the trigger of its newest execution.
    headers: &id001
      ratelimit-limit:
        $ref: ../../shared/headers.yml#/ratelimit-limit
      ratelimit-remaining:
        $ref: ../../shared/headers.yml#/ratelimit-remaining
      ratelimit-reset:
        $ref: ../../shared/headers.yml#/ratelimit-reset
    content:
      application/json:
        schema:
          $ref: models/definitions.yml#/get_trigger_response
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/agents_get_trigger_by_session.yml
security:
- bearer_auth:
  - agent_harness_session:read
