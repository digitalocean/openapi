type: object
description: Request body to create a new signals data deletion job.
properties:
  type:
    type: string
    description: >-
      The scope of the deletion. `agent` deletes data for one agent and
      requires `agent_id`. `inference` deletes data for the team's Serverless
      Inference requests.
    enum:
      - agent
      - inference
    example: agent
  team_id:
    type: integer
    format: int64
    description: The team whose data should be deleted. Must match the authenticated team.
    example: 12345678
  agent_id:
    type: string
    format: uuid
    description: >-
      The agent whose data should be deleted. For Harness Runtime, this is the
      Environment Config ID. Required when `type` is `agent`; must be omitted
      when `type` is `inference`.
    example: 01a10d3f-2c09-764f-99f8-458e521627f3
required:
  - type
  - team_id
additionalProperties: false
