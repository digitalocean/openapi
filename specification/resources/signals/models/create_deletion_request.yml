type: object
description: Request body to create a new signals data deletion job.
properties:
  type:
    type: string
    description: >-
      The scope of the deletion. `agent` deletes Signals conversations for one
      Harness Runtime agent and requires `agent_id`. `inference` deletes
      Serverless Inference Signals conversations for the whole team
      (team-wide; omit `agent_id`).
    enum:
      - agent
      - inference
    example: agent
  team_id:
    type: integer
    format: int64
    description: The team whose data should be deleted. Must match the authenticated team.
    example: 12345678
  agent_id:
    type: string
    format: uuid
    description: >-
      The Harness Runtime Environment Config ID of the agent whose
      conversations should be deleted. This is the agent UUID (`agent_id`).
      Required when `type` is `agent`; must be omitted when `type` is
      `inference`.
    example: 01a10d3f-2c09-764f-99f8-458e521627f3
required:
  - type
  - team_id
additionalProperties: false
