type: object
description: Request body to create a new signals data deletion job.
properties:
  type:
    type: string
    description: >-
      The scope of the deletion. `agent` deletes Signals conversations for one
      Harness Runtime environment and requires `agent_id`. `inference` deletes
      Serverless Inference Signals conversations for the whole team
      (team-wide; omit `agent_id`).
    enum:
      - agent
      - inference
    example: agent
  team_id:
    type: integer
    format: int64
    description: >-
      Numeric team ID for the deletion. Required for both `agent` and
      `inference`. Must equal the team associated with your API token
      (personal access token or OAuth token). The API does not fill this
      field from the token when it is omitted — omitting `team_id` is a
      `400`; a mismatched value is a `403`. Clients such as `doctl` may
      look up this value for you when you omit `--team-id`.
    example: 12345678
  agent_id:
    type: string
    format: uuid
    description: >-
      The Harness Runtime Environment Config ID of the environment whose
      conversations should be deleted. This is the environment's `agent_id`.
      Required when `type` is `agent`; must be omitted when `type` is
      `inference`.
    example: 01a10d3f-2c09-764f-99f8-458e521627f3
required:
  - type
  - team_id
additionalProperties: false
