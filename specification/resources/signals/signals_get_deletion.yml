operationId: signals_get_deletion

summary: Retrieve a Data Deletion Job

description: |
  To retrieve the status and details of a signals data deletion job, send a
  GET request to `/v1/signals/deletions/{deletion_id}`.

tags:
  - Signals

parameters:
  - $ref: 'parameters.yml#/deletion_id'

responses:
  '200':
    $ref: 'responses/deletion_job_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/signals_get_deletion.yml'

security:
  - bearer_auth:
      - 'signals:read'
