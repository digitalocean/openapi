operationId: signals_list_session_dialogues

summary: List Dialogues for a Session

description: |
  To list the dialogue turns within a specific session, send a GET request to
  `/v1/signals/sessions/{session_id}/dialogues`. Each dialogue represents a
  single turn of conversation between a user and the agent, along with
  any signals detected. Results are paginated using cursor-based pagination.

tags:
  - Signals

parameters:
  - $ref: 'parameters.yml#/session_id'
  - $ref: 'parameters.yml#/limit'
  - $ref: 'parameters.yml#/after'
  - $ref: 'parameters.yml#/start_time'
  - $ref: 'parameters.yml#/end_time'
  - $ref: 'parameters.yml#/signal_type'

responses:
  '200':
    $ref: 'responses/list_dialogues_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/signals_list_dialogues.yml'

security:
  - bearer_auth:
      - 'signals:read'
