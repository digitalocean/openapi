operationId: signals_get_export

summary: Retrieve an Export Job

description: |
  To retrieve the status and details of a signals export job, send a GET
  request to `/v1/signals/exports/{export_id}`.

tags:
  - Signals

parameters:
  - $ref: 'parameters.yml#/export_id'

responses:
  '200':
    $ref: 'responses/export_job_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/signals_get_export.yml'

security:
  - bearer_auth:
      - 'signals:read'
