operationId: signals_get_export_download

summary: Get Export Download URL

description: |
  To retrieve a pre-signed download URL for a completed export, send a GET
  request to `/v1/signals/exports/{export_id}/download`. The export must have
  a `complete` status. The URL is temporary and will expire.

tags:
  - Signals

parameters:
  - $ref: 'parameters.yml#/export_id'

responses:
  '200':
    $ref: 'responses/export_download_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/signals_get_export_download.yml'

security:
  - bearer_auth:
      - 'signals:read'
