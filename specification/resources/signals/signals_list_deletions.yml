operationId: signals_list_deletions

summary: List Data Deletion Jobs

description: |
  To list signals data deletion jobs for your team, newest first, send a GET
  request to `/v1/signals/deletions`. Results are paginated using
  cursor-based pagination with `limit` and `after` parameters.

tags:
  - Signals

parameters:
  - $ref: 'parameters.yml#/limit'
  - $ref: 'parameters.yml#/after'

responses:
  '200':
    $ref: 'responses/list_deletions_response.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/signals_list_deletions.yml'

security:
  - bearer_auth:
      - 'signals:read'
