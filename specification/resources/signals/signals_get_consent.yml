operationId: signals_get_consent

summary: Retrieve Consent for an Agent

description: |
  To retrieve the consent record for a specific GenAI agent, send a GET
  request to `/v1/consent/{agent_id}`. The response includes an `allowed`
  field indicating whether the team is permitted to use signals for this agent.

tags:
  - Signals

parameters:
  - $ref: 'parameters.yml#/agent_id'

responses:
  '200':
    $ref: 'responses/agent_consent_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/signals_get_consent.yml'

security:
  - bearer_auth:
      - 'signals:read'
