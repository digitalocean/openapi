operationId: signals_get_export_options

summary: Get Export Options

description: |
  To retrieve the available filter options for creating an export, send a GET
  request to `/v1/signals/exports/options`. The response lists valid signal
  types that can be used in the `signal_type` filter when creating an export.

tags:
  - Signals

responses:
  '200':
    $ref: 'responses/export_options_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/signals_get_export_options.yml'

security:
  - bearer_auth:
      - 'signals:read'
