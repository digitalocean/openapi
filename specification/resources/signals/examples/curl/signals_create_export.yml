lang: cURL
source: |-
  # Export one Harness Runtime environment
  curl -X POST \
    -H "Content-Type: application/json" \
    -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
    -d '{"environment_id":"01a0f3d5-b58d-7c99-a743-7ca0397b7f5d","signal_type":["ExecutionFailureToolNotFound"]}' \
    "https://api.digitalocean.com/v1/signals/exports"

  # Export the team's Serverless Inference Signals (no environment_id)
  curl -X POST \
    -H "Content-Type: application/json" \
    -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
    -d '{"type":"inference","signal_type":["MisalignmentCorrection"]}' \
    "https://api.digitalocean.com/v1/signals/exports"
