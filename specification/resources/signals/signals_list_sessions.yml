operationId: signals_list_agent_sessions

summary: List Sessions for an Agent

description: |
  To list signals sessions for a specific agent, send a GET request to
  `/v1/signals/agents/{agent_id}/sessions`. Results are paginated using cursor-based
  pagination with `limit` and `after` parameters.

tags:
  - Signals

parameters:
  - $ref: 'parameters.yml#/agent_id'
  - $ref: 'parameters.yml#/limit'
  - $ref: 'parameters.yml#/after'
  - $ref: 'parameters.yml#/start_time'
  - $ref: 'parameters.yml#/end_time'
  - $ref: 'parameters.yml#/signal_type'

responses:
  '200':
    $ref: 'responses/list_sessions_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/signals_list_sessions.yml'

security:
  - bearer_auth:
      - 'signals:read'
