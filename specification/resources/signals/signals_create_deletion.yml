operationId: signals_create_deletion

summary: Create a Data Deletion Job

description: |
  To permanently delete Signals data, send a POST request to
  `/v1/signals/deletions`. Deletion cannot be undone.

  Two deletion types are supported:

  - `agent` — deletes sessions, dialogues, and signal reports for one Harness
    Runtime agent. Requires `agent_id`. On create, that agent's data is hidden
    from Signals reads immediately and Signals collection is disabled for the
    agent. Wait until the job is `complete` before enabling Signals for the
    agent again.
  - `inference` — deletes sessions, dialogues, and signal reports for the
    team's Serverless Inference requests made at or before the deletion
    watermark. On create, in-scope inference data is hidden from Signals reads
    immediately and team inference collection (`source=inference`) is disabled.

  The job runs asynchronously; poll the get endpoint until `status` is
  `complete` or `failed`. DigitalOcean may retry transient processing errors
  while a job is still active. If a job ends as `failed`, in-scope data stays
  hidden and collection stays off; send the same create request again to retry.
  Export files created earlier are not deleted and remain available until they
  expire.

  Note: Deletion removes session, dialogue, and related Signals event data for
  the requested scope. Aggregated Insights or metrics charts may still show
  historical summary datapoints after deletion; those aggregates are not the
  same as recoverable session or dialogue content.

  The endpoint is idempotent: if a queued or running job already exists for
  the same target, it is returned with `200 OK`. A new job returns
  `202 Accepted`. Each team can have a limited number of active jobs;
  requests beyond that limit return `429 Too Many Requests`.

tags:
  - Signals

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/create_deletion_request.yml'
      examples:
        Agent:
          value:
            type: agent
            team_id: 12345678
            agent_id: 01a10d3f-2c09-764f-99f8-458e521627f3
        Inference:
          value:
            type: inference
            team_id: 12345678

responses:
  '200':
    $ref: 'responses/deletion_job_response.yml'

  '202':
    $ref: 'responses/deletion_job_accepted_response.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/signals_create_deletion.yml'

security:
  - bearer_auth:
      - 'signals:delete'
