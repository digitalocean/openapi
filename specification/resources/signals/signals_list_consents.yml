operationId: signals_list_consents

summary: List All Consent Records

description: |
  To list all signals consent records for your team, send a GET request to
  `/v1/consent`. Each record indicates whether signals collection is enabled
  for a specific agent.

tags:
  - Signals

responses:
  '200':
    $ref: 'responses/list_consents_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/signals_list_consents.yml'

security:
  - bearer_auth:
      - 'signals:read'
