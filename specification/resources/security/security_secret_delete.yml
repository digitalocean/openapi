operationId: security_delete_secret

summary: Delete Secret

description: |-
  To schedule a secret for deletion, send a DELETE request to `/v2/security/secrets/{secret}`.

  `region` is required. The secret is pending deletion and can be restored
  until it is permanently removed.

tags:
  - Security

parameters:
  - $ref: 'parameters.yml#/secret'
  - $ref: 'parameters.yml#/secret_region'

responses:
  '204':
    $ref: '../../shared/responses/no_content.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '409':
    $ref: '../../shared/responses/conflict.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/security_secret_delete.yml'

security:
  - bearer_auth:
      - 'security:delete'
