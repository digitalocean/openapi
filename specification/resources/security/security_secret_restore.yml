operationId: security_post_restore_secret

summary: Restore Secret

description: |-
  To restore a secret that is pending deletion, send a POST request to `/v2/security/secrets/{secret}/restore`.

  `region` is required. The response contains the secret metadata and does not
  include secret values.

tags:
  - Security

parameters:
  - $ref: 'parameters.yml#/secret'
  - $ref: 'parameters.yml#/secret_region'

responses:
  '200':
    $ref: 'responses/secret_list_item.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '409':
    $ref: '../../shared/responses/conflict.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/security_secret_restore.yml'

security:
  - bearer_auth:
      - 'security:create'
