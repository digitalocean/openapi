operationId: security_revert_secret

summary: Revert Secret

description: |-
  To revert a secret to a prior version, send a POST request to
  `/v2/security/secrets/{secret}/versions/{version}/revert`.

  `region` is required. `current_version` must be the secret's current version.
  If it does not match, the request returns a `409` response. A successful
  revert creates a new version with the contents of the target version.

tags:
  - Security

parameters:
  - $ref: 'parameters.yml#/secret'
  - $ref: 'parameters.yml#/secret_version'
  - $ref: 'parameters.yml#/secret_region'

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - current_version
        properties:
          current_version:
            type: integer
            format: int32
            minimum: 1
            example: 3
            description: The current version of the secret. Used to reject the request if the secret changed.

responses:
  '200':
    $ref: 'responses/create_secret.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '409':
    $ref: '../../shared/responses/conflict.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/security_secret_revert.yml'

security:
  - bearer_auth:
      - 'security:update'
