operationId: security_list_secrets

summary: List Secrets

description: |-
  To list secrets across all configured regions, send a GET request to `/v2/security/secrets`.

  The response includes secret metadata only. Secret values are not returned.
  Use `name` to return secrets whose names start with that prefix, and
  `include_deleted` to include secrets that are pending deletion.

tags:
  - Security

parameters:
  - $ref: '../../shared/parameters.yml#/per_page'
  - $ref: '../../shared/parameters.yml#/page'
  - $ref: 'parameters.yml#/include_deleted'
  - $ref: 'parameters.yml#/secret_name_prefix'

responses:
  '200':
    $ref: 'responses/secrets.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/security_secrets_list.yml'

security:
  - bearer_auth:
      - 'security:read'
