severity:
  in: query
  name: severity
  required: false
  description: The finding severity level to include.
  schema:
    type: string
    enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
  example: CRITICAL

scan_id:
  in: path
  name: scan_id
  description: The scan UUID.
  required: true
  schema:
    type: string
    format: uuid
  example: 497dcba3-ecbf-4587-a2dd-5eb0665e6880

finding_uuid:
  in: path
  name: finding_uuid
  description: The finding UUID.
  required: true
  schema:
    type: string
    format: uuid
  example: 50e14f43-dd4e-412f-864d-78943ea28d91

suppression_uuid:
  in: path
  name: suppression_uuid
  description: The suppression UUID to remove.
  required: true
  schema:
    type: string
    format: uuid
  example: 5b3b2b2d-5c9c-4a61-9e2f-4d8f80f30a12

secret:
  in: path
  name: secret
  description: The name of the secret.
  required: true
  schema:
    type: string
  example: my-database-password

secret_region:
  in: query
  name: region
  description: The region where the secret is stored.
  required: true
  schema:
    type: string
  example: nyc3

secret_version:
  in: path
  name: version
  description: The target version to revert to. Reverting creates a new version with the contents of this version.
  required: true
  schema:
    type: integer
    format: int32
    minimum: 1
  example: 1

include_deleted:
  in: query
  name: include_deleted
  description: Whether to include secrets that are pending deletion.
  required: false
  schema:
    type: boolean
    default: false
  example: false

secret_name_prefix:
  in: query
  name: name
  description: Only return secrets whose names start with this value.
  required: false
  schema:
    type: string
  example: app
