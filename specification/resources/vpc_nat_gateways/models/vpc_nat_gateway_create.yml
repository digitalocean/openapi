type: object

properties:
  name:
    type: string
    example: my-vpc-nat-gateway
    description: The human-readable name of the VPC NAT gateway.

  type:
    type: string
    enum:
      - PUBLIC
    example: PUBLIC
    description: The type of the VPC NAT gateway.

  region:
    type: string
    enum:
      - nyc1
      - nyc2
      - nyc3
      - ams2
      - ams3
      - sfo1
      - sfo2
      - sfo3
      - sgp1
      - lon1
      - fra1
      - tor1
      - blr1
      - syd1
      - atl1
    example: tor1
    description: The region in which the VPC NAT gateway is created.

  size:
    type: integer
    example: 1
    description: The size of the VPC NAT gateway.

  vpcs:
    type: array
    items:
      type: object
      properties:
        vpc_uuid:
          type: string
          example: 0d3db13e-a604-4944-9827-7ec2642d32ac
          description: The unique identifier of the VPC to which the NAT gateway is attached.
        default_gateway:
          type: boolean
          example: true
          description: The classification of the NAT gateway as the default egress route for the VPC traffic.
      required:
        - vpc_uuid
    description: An array of VPCs associated with the VPC NAT gateway.

  udp_timeout_seconds:
    type: integer
    example: 30
    description: The UDP timeout in seconds for the VPC NAT gateway.

  icmp_timeout_seconds:
    type: integer
    example: 30
    description: The ICMP timeout in seconds for the VPC NAT gateway.

  tcp_timeout_seconds:
    type: integer
    example: 30
    description: The TCP timeout in seconds for the VPC NAT gateway.

  egresses:
    type: object
    description: >-
      An optional object specifying the public egress IP address to assign to
      the VPC NAT gateway. Provide this only to use a specific address. If
      omitted, DigitalOcean allocates a public IP address automatically.
    properties:
      public_gateways:
        type: array
        description: >-
          An array containing a single public gateway object that sets the
          gateway's public egress IP address.
        items:
          type: object
          description: >-
            Specify the address using either `ip` or `ipv4`. Both fields accept
            the same value and `ip` takes precedence if both are provided. The
            assigned address is returned in the `ipv4` field of GET and list
            responses.
          properties:
            ip:
              type: string
              example: 203.0.113.42
              description: >-
                The public egress IP address to assign to the VPC NAT gateway,
                and the preferred field for setting it. Provide an unassigned
                Bring Your Own IP (BYOIP) address on your account in the same
                region to use your own IP address. This field is only applied
                when creating the gateway and cannot be changed afterward. The
                assigned address is returned as `ipv4` in GET and list
                responses.
            ipv4:
              type: string
              example: 203.0.113.42
              description: >-
                An alternative to `ip` for setting the public egress IP address
                on create. Accepts the same value as `ip`, which takes
                precedence if both are provided. This field is only applied when
                creating the gateway and cannot be changed afterward.

required:
  - name
  - type
  - region
  - size
  - vpcs
