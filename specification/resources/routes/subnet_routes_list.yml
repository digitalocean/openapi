operationId: routes_list_subnet

summary: List VPC Subnet Routes

description: |
  To list routes for a VPC subnet, send a GET request to
  `/v2/vpcs/$VPC_UUID/subnets/$SUBNET_UUID/routes`. The response includes
  VPC-scoped routes propagated into the subnet and subnet-scoped routes.

tags:
  - Routes

parameters:
  - $ref: 'parameters.yml#/vpc_uuid'
  - $ref: 'parameters.yml#/subnet_uuid'
  - $ref: '../../shared/parameters.yml#/per_page'
  - $ref: '../../shared/parameters.yml#/page'

responses:
  '200':
    $ref: 'responses/routes.yml#/all_routes'
  '401':
    $ref: '../../shared/responses/unauthorized.yml'
  '404':
    $ref: '../../shared/responses/not_found.yml'
  '429':
    $ref: '../../shared/responses/too_many_requests.yml'
  '500':
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl.yml#/list_subnet'

security:
  - bearer_auth:
      - 'route:read'
