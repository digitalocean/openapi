operationId: vpcSubnetRoutes_create

summary: Create a VPC Subnet Route

description: |
  To add a static route to a VPC subnet, send a POST request to
  `/v2/vpcs/$VPC_UUID/subnets/$SUBNET_UUID/routes`. This route is additional
  to the routes the VPC already propagates to the subnet. The server assigns
  the route's `id` and `type`.

  Droplet targets must use a numeric ID. A Droplet UUID or another invalid
  `target_urns` value returns a 422 response.

tags:
  - VPC Routes [Public Preview]

parameters:
  - $ref: 'parameters.yml#/vpc_uuid'
  - $ref: 'parameters.yml#/subnet_uuid'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/route.yml#/route_create'

responses:
  '201':
    $ref: 'responses/routes.yml#/single_route'
  '400':
    $ref: '../../shared/responses/bad_request.yml'
  '401':
    $ref: '../../shared/responses/unauthorized.yml'
  '404':
    $ref: '../../shared/responses/not_found.yml'
  '422':
    $ref: '../../shared/responses/unprocessable_entity.yml'
  '429':
    $ref: '../../shared/responses/too_many_requests.yml'
  '500':
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl.yml#/create'

security:
  - bearer_auth:
      - 'route:create'
