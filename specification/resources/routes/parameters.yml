vpc_uuid:
  in: path
  name: vpc_uuid
  description: The unique identifier of the VPC.
  required: true
  schema:
    type: string
    format: uuid
  example: 997615ce-132d-4bae-9270-9ee21b395e5d

subnet_uuid:
  in: path
  name: subnet_uuid
  description: The unique identifier of the VPC subnet.
  required: true
  schema:
    type: string
    format: uuid
  example: 6b5c619c-359c-44ca-87e2-47e98170c01d

route_uuid:
  in: path
  name: route_uuid
  description: The unique identifier of the route.
  required: true
  schema:
    type: string
    format: uuid
  example: f0e1d2c3-b4a5-6789-0fed-cba987654321
