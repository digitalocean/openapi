all_vpc_routes:
  description: A list of routes.
  headers:
    ratelimit-limit:
      $ref: '../../../shared/headers.yml#/ratelimit-limit'
    ratelimit-remaining:
      $ref: '../../../shared/headers.yml#/ratelimit-remaining'
    ratelimit-reset:
      $ref: '../../../shared/headers.yml#/ratelimit-reset'
  content:
    application/json:
      schema:
        allOf:
          - type: object
            properties:
              routes:
                type: array
                items:
                  $ref: '../models/route.yml#/route'
          - $ref: '../../../shared/pages.yml#/pagination'
          - $ref: '../../../shared/meta.yml'
      example:
        routes:
          - id: f0e1d2c3-b4a5-6789-0fed-cba987654321
            type: STATIC
            destination_cidr: 0.0.0.0/0
            target_urns:
              - do:nat_gateway:14aa1d1b-e6ab-4ccb-bb10-dade56fcb8ec
            modifiable: false
            created_at: "2026-01-14T10:00:00Z"
        links:
          pages:
            next: https://api.digitalocean.com/v2/vpcs/997615ce-132d-4bae-9270-9ee21b395e5d/routes?page=2&per_page=20
        meta:
          total: 1

