single_route:
  description: A route.
  headers:
    ratelimit-limit:
      $ref: '../../../shared/headers.yml#/ratelimit-limit'
    ratelimit-remaining:
      $ref: '../../../shared/headers.yml#/ratelimit-remaining'
    ratelimit-reset:
      $ref: '../../../shared/headers.yml#/ratelimit-reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          route:
            $ref: '../models/route.yml#/route'
      example:
        route:
          id: f0e1d2c3-b4a5-6789-0fed-cba987654321
          type: STATIC
          destination_cidr: 0.0.0.0/0
          target_urns:
            - do:droplet:4126873
          modifiable: true
          created_at: "2026-01-14T10:05:00Z"
