list_vpc:
  lang: cURL
  source: |-
    curl -X GET \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
      "https://api.digitalocean.com/v2/vpcs/997615ce-132d-4bae-9270-9ee21b395e5d/routes"

list_subnet:
  lang: cURL
  source: |-
    curl -X GET \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
      "https://api.digitalocean.com/v2/vpcs/997615ce-132d-4bae-9270-9ee21b395e5d/subnets/6b5c619c-359c-44ca-87e2-47e98170c01d/routes"

create:
  lang: cURL
  source: |-
    curl -X POST \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
      -d '{"destination_cidr":"0.0.0.0/0","target_urns":["do:droplet:14aa1d1b-e6ab-4ccb-bb10-dade56fcb8ec"]}' \
      "https://api.digitalocean.com/v2/vpcs/997615ce-132d-4bae-9270-9ee21b395e5d/subnets/6b5c619c-359c-44ca-87e2-47e98170c01d/routes"

update:
  lang: cURL
  source: |-
    curl -X PATCH \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
      -d '{"target_urns":["do:droplet:14aa1d1b-e6ab-4ccb-bb10-dade56fcb8ec"]}' \
      "https://api.digitalocean.com/v2/vpcs/997615ce-132d-4bae-9270-9ee21b395e5d/subnets/6b5c619c-359c-44ca-87e2-47e98170c01d/routes/f0e1d2c3-b4a5-6789-0fed-cba987654321"

delete:
  lang: cURL
  source: |-
    curl -X DELETE \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
      "https://api.digitalocean.com/v2/vpcs/997615ce-132d-4bae-9270-9ee21b395e5d/subnets/6b5c619c-359c-44ca-87e2-47e98170c01d/routes/f0e1d2c3-b4a5-6789-0fed-cba987654321"
