operationId: routes_list_vpc

summary: List VPC Routes

description: |
  To list the read-only VPC-scoped routes for a VPC, send a GET request to
  `/v2/vpcs/$VPC_UUID/routes`. VPC-scoped routes cannot be created, updated,
  or deleted through the public API.

tags:
  - Routes

parameters:
  - $ref: 'parameters.yml#/vpc_uuid'
  - $ref: '../../shared/parameters.yml#/per_page'
  - $ref: '../../shared/parameters.yml#/page'

responses:
  '200':
    $ref: 'responses/routes.yml#/all_routes'
  '401':
    $ref: '../../shared/responses/unauthorized.yml'
  '404':
    $ref: '../../shared/responses/not_found.yml'
  '429':
    $ref: '../../shared/responses/too_many_requests.yml'
  '500':
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl.yml#/list_vpc'

security:
  - bearer_auth:
      - 'route:read'
