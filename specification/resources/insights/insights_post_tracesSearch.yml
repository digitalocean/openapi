operationId: insights_post_tracesSearch

summary: Search traces

description: >-
  To search traces in a region, send a POST request to
  `/v2/insights/query/{region}/traces/search` with a JSON body describing the
  time range, optional filter, ordering, and pagination.

  Each result is one trace, aggregated from its spans. The time range must not
  exceed 7 days. `pagination.limit` defaults to 100 and is clamped to 1000.
  Results are ordered by `started` descending unless `order_by` is set.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/region'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/traces_search_request.yml'

responses:
  '200':
    $ref: 'responses/traces_search.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_post_tracesSearch.yml'

security:
  - bearer_auth:
    - 'insights:read'
