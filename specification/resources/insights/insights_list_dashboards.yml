operationId: insights_list_dashboards

summary: List Dashboards

description: |
  To list the dashboards in your team, send a GET request to
  `/v2/insights/dashboards`.

  Results are paginated with `pagination.page` and `pagination.per_page`
  (default `20`, maximum `200`) and can be sorted with `pagination.sort`
  (`name`, `created_at`, or `updated_at`) and `pagination.sort_direction`.
  When `pagination.sort` is omitted, dashboards are ordered by `created_at`
  descending. When it is set, the direction defaults to `asc` unless
  `pagination.sort_direction` is also given.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/dashboards_page'
  - $ref: 'parameters.yml#/dashboards_per_page'
  - $ref: 'parameters.yml#/dashboards_sort'
  - $ref: 'parameters.yml#/dashboards_sort_direction'

responses:
  '200':
    $ref: 'responses/list_dashboards_response.yml'

  '400':
    $ref: 'responses/dashboard_bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '429':
    $ref: 'responses/dashboard_too_many_requests.yml'

  '500':
    $ref: 'responses/dashboard_server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_list_dashboards.yml'

security:
  - bearer_auth:
      - 'insights:read'
