operationId: insights_update_dashboard

summary: Update a Dashboard

description: |
  To update a dashboard, send a PUT request to
  `/v2/insights/dashboards/{uuid}` with a `spec` containing the full
  dashboard definition as a JSON document serialized to a string.

  This endpoint uses replace semantics: the stored `spec` is overwritten in
  full and `name` and `description` are recomputed from the new
  `spec.display`. Changing the name to one already used by another dashboard
  in your team returns `409`.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/dashboard_uuid'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/dashboard_request.yml'
      example:
        spec: '{"kind":"Dashboard","apiVersion":"perses.dev/v1alpha1","spec":{"display":{"name":"Droplet CPU (production)","description":"CPU utilization across production Droplets."},"duration":"6h","variables":[],"layouts":[{"kind":"Grid","spec":{"items":[{"x":0,"y":0,"width":12,"height":6,"content":{"$ref":"#/spec/panels/cpu"}}]}}],"panels":{"cpu":{"kind":"Panel","spec":{"display":{"name":"CPU utilization"},"plugin":{"kind":"TimeSeriesChart","spec":{}},"queries":[{"kind":"TimeSeriesQuery","spec":{"plugin":{"kind":"MetricsTimeSeriesQuery","spec":{"metricName":"do.droplets.cpu_utilization","kind":"gauge","filters":[],"groupBy":[]}}}}]}}}}}'

responses:
  '200':
    $ref: 'responses/dashboard_response.yml'

  '400':
    $ref: 'responses/dashboard_bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: 'responses/dashboard_not_found.yml'

  '409':
    $ref: 'responses/dashboard_conflict.yml'

  '429':
    $ref: 'responses/dashboard_too_many_requests.yml'

  '500':
    $ref: 'responses/dashboard_server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_update_dashboard.yml'

security:
  - bearer_auth:
      - 'insights:update'
