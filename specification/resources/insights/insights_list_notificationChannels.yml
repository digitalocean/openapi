operationId: insights_list_notificationChannels

summary: List Notification Channels

description: |
  To list all notification channels for your account, send a GET request to
  `/v2/insights/notification-channels`.

tags:
  - Insights

responses:
  '200':
    $ref: 'responses/list_notification_channels_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_list_notificationChannels.yml'

security:
  - bearer_auth:
      - 'insights:read'
