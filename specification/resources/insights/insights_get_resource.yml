operationId: insights_get_resource

summary: Retrieve Resource Signal Enablement

description: |
  To retrieve the current metrics, logs, and traces signal enablement for a
  single resource, send a GET request to
  `/v2/insights/resources/{resource_urn}`.

  A `404` is returned when no signal enablement has been recorded for the
  resource.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/resource_urn_path'

responses:
  '200':
    $ref: 'responses/resource.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_get_resource.yml'

security:
  - bearer_auth:
      - 'insights:read'
