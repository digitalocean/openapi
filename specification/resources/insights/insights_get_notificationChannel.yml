operationId: insights_get_notificationChannel

summary: Retrieve a Notification Channel

description: |
  To retrieve a notification channel, send a GET request to
  `/v2/insights/notification-channels/{id}`. Secret fields are returned masked
  as `********`.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/notification_channel_id'

responses:
  '200':
    $ref: 'responses/notification_channel_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_get_notificationChannel.yml'

security:
  - bearer_auth:
      - 'insights:read'
