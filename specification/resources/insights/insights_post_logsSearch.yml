operationId: insights_post_logsSearch

summary: Search logs

description: >-
  To search log records in a region, send a POST request to
  `/v2/insights/query/{region}/logs/search` with a JSON body describing the
  time range, optional filter, ordering, and pagination.

  The time range must not exceed 7 days. `pagination.limit` defaults to 100 and
  is clamped to 1000. Cursor pagination requires ordering by `timestamp` alone;
  other sort orders return `has_more: false` and cannot be paged.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/region'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/logs_search_request.yml'

responses:
  '200':
    $ref: 'responses/logs_search.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_post_logsSearch.yml'

security:
  - bearer_auth:
    - 'insights:read'
