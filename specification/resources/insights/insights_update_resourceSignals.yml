operationId: insights_update_resourceSignals

summary: Update Resource Signal Enablement

description: |
  To enable or disable telemetry signals for a resource, send a PUT request to
  `/v2/insights/resources/{resource_urn}/signals`.

  This endpoint uses merge semantics. Set `metrics`, `logs`, or `traces` to
  `true` or `false` to change that signal; omit a signal to leave it unchanged.
  At least one signal must be set.

  `region` is only used when the resource has no existing enablement. On later
  updates, omit it or send the stored value; changing the region is rejected
  with a `400`.

  Requires both the `insights:update` and `insights:create` scopes.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/resource_urn_path'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/resource_signals_update_request.yml'
      example:
        region: nyc3
        metrics: true
        logs: true

responses:
  '200':
    $ref: 'responses/resource.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_update_resourceSignals.yml'

security:
  - bearer_auth:
      - 'insights:update'
      - 'insights:create'
