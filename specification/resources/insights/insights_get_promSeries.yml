operationId: insights_get_promSeries

summary: Find series by label selectors

description: >-
  To find series matching one or more selectors, send a GET request to `/v2/insights/query/{region}/prom/api/v1/series`.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/region'
  - $ref: 'parameters.yml#/match_required'
  - $ref: 'parameters.yml#/start_optional'
  - $ref: 'parameters.yml#/end_optional'

responses:
  '200':
    $ref: 'responses/prom_series.yml'

  '400':
    $ref: 'responses/prom_error.yml'

  '422':
    $ref: 'responses/prom_error.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: 'responses/prom_error.yml'

  '503':
    $ref: 'responses/prom_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_get_promSeries.yml'

security:
  - bearer_auth:
    - 'insights:read'
