operationId: insights_post_promQuery

summary: Execute an instant PromQL query

description: >-
  To evaluate a PromQL expression at a single point in time, send a POST request to `/v2/insights/query/{region}/prom/api/v1/query` with `application/x-www-form-urlencoded` parameters.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/region'

requestBody:
  required: true
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
          - query
        properties:
          query:
            type: string
            description: A PromQL expression to evaluate.
            example: do.droplets.cpu_time
          time:
            type: string
            description: Evaluation timestamp. RFC3339 or UNIX timestamp.
            example: "1620683817"
          timeout:
            type: string
            description: Optional evaluation timeout duration.
            example: 30s

responses:
  '200':
    $ref: 'responses/prom_query.yml'

  '400':
    $ref: 'responses/prom_error.yml'

  '422':
    $ref: 'responses/prom_error.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: 'responses/prom_error.yml'

  '503':
    $ref: 'responses/prom_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_post_promQuery.yml'

security:
  - bearer_auth:
    - 'insights:read'
