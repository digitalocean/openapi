type: object
description: A single trace returned by a traces search. One row per trace, aggregated from its spans.
required:
  - traceId
properties:
  traceId:
    type: string
    description: The trace identifier.
    example: "7b0b4e56abab38362b24e5498eb9ec64"
  started:
    type: string
    format: date-time
    description: The start time of the earliest span in the trace.
    example: "2026-09-30T00:14:12Z"
  serviceName:
    type: string
    description: The service that emitted the root span.
    example: "api-gateway"
  durationNs:
    type: integer
    format: int64
    description: Wall-clock duration of the trace in nanoseconds.
    example: 154000000
  spanCount:
    type: integer
    format: int32
    description: The number of spans in the trace.
    example: 12
  errorCount:
    type: integer
    format: int32
    description: The number of spans in the trace with an error status.
    example: 1
  status:
    type: string
    description: The rolled-up status of the trace.
    example: "Ok"
  spanNames:
    type: array
    description: The distinct span names present in the trace.
    items:
      type: string
    example:
      - "GET /v2/droplets"
      - "db.query"
  region:
    type: string
    description: The datacenter region the trace was returned from.
    example: nyc3
