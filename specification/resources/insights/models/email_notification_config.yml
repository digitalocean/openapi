type: object
description: |
  Email notification channel configuration. Recipients must be team contact
  emails added and verified by a team owner. They do not need to be team
  members.
required:
  - to
properties:
  to:
    type: string
    description: |
      One or more recipient email addresses, separated by commas, semicolons,
      or spaces.
    example: alerts@example.com, backup@example.com
