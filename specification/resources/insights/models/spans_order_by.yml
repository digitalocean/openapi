type: object
description: A sort clause for spans search results.
required:
  - field
properties:
  field:
    $ref: 'spans_filter_field.yml'
  direction:
    type: string
    description: >-
      The sort direction, matched case-insensitively. Omit to use the server
      default.
    enum:
      - asc
      - desc
    example: desc
