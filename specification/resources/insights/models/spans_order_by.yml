type: object
description: A sort clause for spans search results.
required:
  - field
properties:
  field:
    $ref: 'spans_filter_field.yml'
  direction:
    type: string
    description: The sort direction. Omit to use the server default.
    enum:
      - SORT_DIRECTION_ASC
      - SORT_DIRECTION_DESC
    example: SORT_DIRECTION_DESC
