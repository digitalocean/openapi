type: object
description: A single span belonging to a trace.
required:
  - trace_id
  - span_id
properties:
  trace_id:
    type: string
    description: The trace this span belongs to.
    example: "4bf92f3577b34da6a3ce929d0e0e4736"
  span_id:
    type: string
    description: The span identifier.
    example: "00f067aa0ba902b7"
  parent_span_id:
    type: string
    description: The parent span identifier. Omitted for the root span.
    example: "a2fb4a1d1a96d312"
  start_time:
    type: string
    format: date-time
    description: The span start time.
    example: "2026-09-30T00:14:12Z"
  end_time:
    type: string
    format: date-time
    description: The span end time.
    example: "2026-09-30T00:14:12.154Z"
  duration_ns:
    type: string
    format: int64
    description: Span duration in nanoseconds, encoded as a string to preserve 64-bit precision.
    example: "154000000"
  name:
    type: string
    description: The span name, typically the operation being performed.
    example: "GET /v2/droplets"
  kind:
    type: string
    description: The OpenTelemetry span kind.
    example: "SPAN_KIND_SERVER"
  status_code:
    type: string
    description: The OpenTelemetry span status code.
    example: "STATUS_CODE_ERROR"
  status_message:
    type: string
    description: The status description. Omitted when empty.
    example: "upstream timeout"
  service_name:
    type: string
    description: The service that emitted the span.
    example: "api-gateway"
  resource:
    type: object
    description: Resource attributes associated with the span.
    additionalProperties:
      type: string
    example:
      do.component: "droplet"
      do.droplet.id: "12345678"
  attributes:
    type: object
    description: Span attributes.
    additionalProperties:
      type: string
    example:
      http.method: "GET"
      http.status_code: "504"
  region:
    type: string
    description: The datacenter region the span was returned from.
    example: nyc3
