type: object
description: Pagination metadata for Insights list responses.
required:
  - page
  - pages
  - per_page
properties:
  page:
    type: integer
    description: Current page number.
    example: 1
  pages:
    type: integer
    description: Total number of pages.
    example: 1
  per_page:
    type: integer
    description: Number of items requested per page.
    example: 25
  total:
    type: integer
    description: |
      Total number of items across all pages. May be omitted when zero
      (`omitempty` on the live API).
    example: 2
