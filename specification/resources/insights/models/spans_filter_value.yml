type: object
description: A typed literal or list value for a spans filter condition. Exactly one kind is set per message.
minProperties: 1
maxProperties: 1
properties:
  string_value:
    type: string
    example: "api-gateway"
  number_value:
    type: number
    example: 42
  string_array_value:
    type: object
    required:
      - values
    properties:
      values:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: string
        example:
          - "api-gateway"
          - "checkout"
  number_array_value:
    type: object
    required:
      - values
    properties:
      values:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: number
        example:
          - 42
          - 84
