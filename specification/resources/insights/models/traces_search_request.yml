type: object
description: Request body for searching traces.
required:
  - timeRange
properties:
  timeRange:
    $ref: 'traces_time_range.yml'
  filter:
    $ref: 'traces_filter_expression.yml'
  orderBy:
    type: array
    description: Sort clauses applied to the result set. Defaults to `started` descending.
    items:
      $ref: 'traces_order_by.yml'
  pagination:
    $ref: 'traces_pagination_request.yml'
