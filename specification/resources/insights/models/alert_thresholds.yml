type: object
description: |
  Threshold configuration for the alert rule. At least one of `warning` or
  `critical` must be set.
required:
  - operator
properties:
  warning:
    type: number
    format: double
    description: Warning threshold value.
    example: 80
  critical:
    type: number
    format: double
    description: Critical threshold value.
    example: 95
  operator:
    type: string
    description: Comparison operator applied to the aggregated metric value.
    enum:
      - equal
      - less_than_or_equal
      - less_than
      - greater_than
      - greater_than_or_equal
      - not_equal
    example: greater_than
