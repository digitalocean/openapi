type: object
description: |
  Spec for an Insights alert rule. On create, `name`, `query`, `thresholds`,
  and at least one `notification_channels` binding are required. On update,
  omit `notification_channels` to keep existing bindings; an explicit empty
  list is rejected.
required:
  - name
  - query
  - thresholds
properties:
  name:
    type: string
    description: A human-readable name for the alert rule.
    example: High CPU
  query:
    $ref: 'metrics_query.yml'
  condition:
    $ref: 'alert_condition.yml'
  thresholds:
    $ref: 'alert_thresholds.yml'
  notification_channels:
    type: array
    description: Notification channels to notify when the rule fires.
    minItems: 1
    items:
      $ref: 'notification_channel_binding.yml'
  re_alert_duration:
    type: string
    description: |
      Minimum wait before re-notifying a still-firing alert, as a duration
      string. Defaults to `4h` on create when omitted.
    enum:
      - 30m
      - 1h
      - 4h
      - never
    example: 4h
