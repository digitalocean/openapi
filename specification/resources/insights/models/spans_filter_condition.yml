type: object
description: A single field comparison in a spans filter expression.
required:
  - field
  - operator
oneOf:
  - properties:
      operator:
        type: string
        enum:
          - FILTER_OPERATOR_EXISTS
        example: FILTER_OPERATOR_EXISTS
  - required:
      - value
    properties:
      operator:
        type: string
        enum:
          - FILTER_OPERATOR_EQ
          - FILTER_OPERATOR_NEQ
          - FILTER_OPERATOR_IN
          - FILTER_OPERATOR_GTE
          - FILTER_OPERATOR_LTE
        example: FILTER_OPERATOR_EQ
properties:
  field:
    $ref: 'spans_filter_field.yml'
  operator:
    type: string
    description: The comparison operator.
    enum:
      - FILTER_OPERATOR_EQ
      - FILTER_OPERATOR_NEQ
      - FILTER_OPERATOR_IN
      - FILTER_OPERATOR_EXISTS
      - FILTER_OPERATOR_GTE
      - FILTER_OPERATOR_LTE
    example: FILTER_OPERATOR_EQ
  value:
    $ref: 'spans_filter_value.yml'
