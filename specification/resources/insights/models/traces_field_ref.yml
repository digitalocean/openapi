type: object
description: A reference to a span field, used in filters and `order_by`.
additionalProperties: false
required:
  - name
properties:
  name:
    type: string
    description: >-
      The field name. Without `scope`, these names (case-insensitive) resolve
      to built-in span columns: `trace_id`, `span_id`, `parent_span_id`,
      `start_time`, `end_time`, `duration_ns`, `name`
      (`span.name`), `kind` (`span.kind`), `status_code` (`status.code`,
      `status_code`), `status_message`,
      and `service_name` (`service.name`). Any other name is
      looked up as a span attribute, falling back to a resource attribute.
      With `scope` set, `name` is always treated as an attribute key.
      Attribute keys may contain only letters, digits, and `.`, `_`, `-`,
      `/`, `:`, `@`.


      In traces `order_by`, `name` must be a trace-level sort field instead;
      see the `order_by` field description.
    example: service.name
  scope:
    type: string
    description: >-
      Restricts the lookup to one attribute map (case-insensitive).
      `resource` (or `resource.attributes`) reads resource attributes;
      `attribute` (or `attributes`, `span.attributes`) reads span attributes.
      Omit to use the built-in column mapping described for `name`. Ignored
      in traces `order_by`.
    enum:
      - FIELD_SCOPE_RESOURCE
      - FIELD_SCOPE_ATTRIBUTES
    example: FIELD_SCOPE_RESOURCE
