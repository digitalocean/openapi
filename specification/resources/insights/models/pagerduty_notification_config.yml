type: object
description: |
  PagerDuty notification channel configuration. PagerDuty support is reserved
  in the request schema; creating or updating a channel with this config may
  currently return `400`.
required:
  - integration_key
properties:
  integration_key:
    type: string
    format: password
    description: PagerDuty Events API v2 integration (routing) key.
    example: R02EXAMPLEINTEGRATIONKEY
