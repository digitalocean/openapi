type: object
description: A typed literal or list value for a filter condition. Exactly one kind is set per message.
minProperties: 1
maxProperties: 1
properties:
  stringValue:
    type: string
    example: "api-gateway"
  numberValue:
    type: number
    example: 42
  boolValue:
    type: boolean
    example: true
  stringArrayValue:
    type: object
    required:
      - values
    properties:
      values:
        type: array
        minItems: 1
        items:
          type: string
        example:
          - "api-gateway"
          - "auth-service"
  numberArrayValue:
    type: object
    required:
      - values
    properties:
      values:
        type: array
        minItems: 1
        items:
          type: number
        example:
          - 42
          - 84
