type: object
description: An Insights alert rule.
required:
  - id
  - spec
  - status
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
    description: A unique identifier for the alert rule.
    example: 4de7ac8b-495b-4884-9a69-1050c6793cd6
  spec:
    $ref: 'alert_rule_spec.yml'
  status:
    type: string
    description: Current alert rule status.
    enum:
      - ALERT_RULE_STATUS_UNSPECIFIED
      - ALERT_RULE_STATUS_ACTIVE
      - ALERT_RULE_STATUS_PAUSED
    example: ALERT_RULE_STATUS_ACTIVE
  owner_uuid:
    type: string
    format: uuid
    description: UUID of the team or user that owns the alert rule.
    example: 9a6d9e58-3b2f-4c1a-9f0e-1d2c3b4a5e6f
  owner_id:
    type: integer
    format: int64
    description: Numeric owner ID for the alert rule.
    example: 1234567
  created_at:
    type: string
    format: date-time
    description: Time the alert rule was created.
    example: '2026-03-15T12:00:00Z'
  updated_at:
    type: string
    format: date-time
    description: Time the alert rule was last updated.
    example: '2026-03-15T12:30:00Z'
