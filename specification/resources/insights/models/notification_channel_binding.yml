type: object
description: |
  Binding from an alert rule to a notification channel. When `notify_on` is
  omitted or empty, the channel is notified for all severities.
required:
  - notification_channel_id
properties:
  notification_channel_id:
    type: string
    format: uuid
    description: ID of an existing notification channel owned by the account.
    example: 78b3da62-27e5-49ba-ac70-5db0b5935c64
  notify_on:
    type: array
    description: Severities that trigger this channel.
    items:
      type: string
      enum:
        - SEVERITY_WARNING
        - SEVERITY_CRITICAL
    example:
      - SEVERITY_CRITICAL
