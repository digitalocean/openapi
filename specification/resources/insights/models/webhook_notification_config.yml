type: object
description: |
  Generic HTTPS webhook notification channel configuration. The URL must use
  HTTPS and must not include userinfo. Optionally configure either
  `basic_auth` or `bearer_token` (not both), custom headers, and a signing
  secret.
required:
  - url
properties:
  url:
    type: string
    format: uri
    description: HTTPS URL that receives webhook deliveries.
    example: https://example.com/hooks/alerts
  basic_auth:
    $ref: 'webhook_basic_auth.yml'
  bearer_token:
    $ref: 'webhook_bearer_token.yml'
  headers:
    type: object
    additionalProperties:
      type: string
      example: value
    description: |
      Optional custom HTTP headers to include on webhook deliveries. At most
      20 headers are allowed. Reserved header names such as `host`,
      `content-type`, and `proxy-*` are rejected.
    example:
      X-Custom-Header: value
  signature:
    $ref: 'webhook_signature_config.yml'
