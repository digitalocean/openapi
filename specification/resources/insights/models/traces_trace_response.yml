type: object
description: A single trace and all of its spans.
properties:
  trace_id:
    type: string
    description: The trace identifier.
    example: "4bf92f3577b34da6a3ce929d0e0e4736"
  spans:
    type: array
    description: Every span in the trace, ordered by start time.
    items:
      $ref: 'traces_span_record.yml'
