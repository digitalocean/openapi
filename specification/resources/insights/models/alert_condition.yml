type: object
description: Evaluation condition for the alert rule.
properties:
  window:
    type: string
    description: |
      Time window over which the metric is evaluated, as a duration string
      (for example `5m` or `1h`).
    enum:
      - 1m
      - 5m
      - 10m
      - 15m
      - 30m
      - 1h
    example: 5m
