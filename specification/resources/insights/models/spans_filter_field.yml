type: object
description: A reference to a searchable span field.
required:
  - name
properties:
  name:
    type: string
    description: >-
      The field name. Well-known span fields include `trace_id`, `span_id`,
      `parent_span_id`, `start_time`, `end_time`, `duration_ns`, `name`,
      `service_name`, `kind`, `status_code`, and `status_message`. Any other value
      is treated as a span or resource attribute key.
    example: service.name
  scope:
    type: string
    description: >-
      Optional attribute scope. Use `resource` to match a resource attribute or
      `attributes` to match a span attribute. Omit for well-known fields or to
      search both attribute maps.
    enum:
      - FIELD_SCOPE_RESOURCE
      - FIELD_SCOPE_ATTRIBUTES
    example: FIELD_SCOPE_ATTRIBUTES
