type: object
description: A reference to a searchable span field.
required:
  - name
properties:
  name:
    type: string
    description: >-
      The field name. Well-known span fields include `trace_id`, `span_id`,
      `parent_span_id`, `start_time`, `end_time`, `duration_ns`, `name`,
      `service_name`, `kind`, `status_code`, and `status_message`. Any other value
      is treated as a span or resource attribute key.
    example: service.name
  scope:
    type: string
    description: >-
      Optional attribute scope, matched case-insensitively. Use
      `FIELD_SCOPE_RESOURCE` to match a resource attribute or
      `FIELD_SCOPE_ATTRIBUTES` to match a span attribute. The aliases
      `resource` and `resource.attributes` are accepted for resource
      attributes; `attribute`, `attributes`, and `span.attributes` are
      accepted for span attributes. Omit for well-known fields or to search
      both attribute maps.
    enum:
      - FIELD_SCOPE_RESOURCE
      - FIELD_SCOPE_ATTRIBUTES
      - resource
      - resource.attributes
      - attribute
      - attributes
      - span.attributes
    example: FIELD_SCOPE_ATTRIBUTES
