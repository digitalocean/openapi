type: object
description: >-
  A sort clause for traces search results. Supported `field.name` values
  are `started`, `duration_ns`, `service_name`, `trace_id`, `error_count`,
  `span_count`, and `status`. Any other name
  returns `400`.


  Sorting by `started` is exact. For every other field, the server first
  selects the most recent matching traces by start time (up to the requested
  limit) and then sorts only those traces, so results are not a global top-N
  across the whole time range.
additionalProperties: false
required:
  - field
properties:
  field:
    $ref: 'traces_field_ref.yml'
  direction:
    type: string
    description: The sort direction. Omit to use the server default.
    enum:
      - SORT_DIRECTION_ASC
      - SORT_DIRECTION_DESC
    example: SORT_DIRECTION_DESC
