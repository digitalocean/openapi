type: object
description: A reusable Insights notification channel.
required:
  - id
  - name
  - channel_type
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
    description: A unique identifier for the notification channel.
    example: 4de7ac8b-495b-4884-9a69-1050c6793cd6
  name:
    type: string
    description: A human-readable name for the notification channel.
    example: Production Slack alerts
  channel_type:
    type: string
    description: The configured channel type.
    enum:
      - CHANNEL_TYPE_UNSPECIFIED
      - CHANNEL_TYPE_EMAIL
      - CHANNEL_TYPE_SLACK
      - CHANNEL_TYPE_WEBHOOK
      - CHANNEL_TYPE_PAGERDUTY
    example: CHANNEL_TYPE_SLACK
  email:
    $ref: 'email_notification_config.yml'
  slack:
    $ref: 'slack_notification_config.yml'
  webhook:
    $ref: 'webhook_notification_config.yml'
  pagerduty:
    $ref: 'pagerduty_notification_config.yml'
  usage:
    $ref: 'notification_channel_usage.yml'
  created_at:
    type: string
    format: date-time
    description: Time the notification channel was created.
    example: '2026-03-15T12:00:00Z'
  updated_at:
    type: string
    format: date-time
    description: Time the notification channel was last updated.
    example: '2026-03-15T12:30:00Z'
