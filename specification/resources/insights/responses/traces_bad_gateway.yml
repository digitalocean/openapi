description: >-
  The regional traces backend could not be reached. The body is a short
  plain-text message.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  text/plain:
    schema:
      type: string
    example: Bad Gateway
