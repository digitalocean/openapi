description: A single dashboard.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      type: object
      required:
        - dashboard
      properties:
        dashboard:
          $ref: '../models/dashboard.yml'
    example:
      dashboard:
        uuid: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        name: Droplet CPU
        description: CPU utilization across production Droplets.
        spec: '{"kind": "Dashboard", "spec": {"panels": {"cpu": {"kind": "Panel", "spec": {"plugin": {"kind": "TimeSeriesChart", "spec": {}}, "display": {"name": "CPU utilization"}, "queries": [{"kind": "TimeSeriesQuery", "spec": {"plugin": {"kind": "MetricsTimeSeriesQuery", "spec": {"kind": "gauge", "filters": [], "groupBy": [], "metricName": "do.droplets.cpu_utilization"}}}}]}}}, "display": {"name": "Droplet CPU", "description": "CPU utilization across production Droplets."}, "layouts": [{"kind": "Grid", "spec": {"items": [{"x": 0, "y": 0, "width": 12, "height": 6, "content": {"$ref": "#/spec/panels/cpu"}}]}}], "duration": "1h", "variables": []}, "apiVersion": "perses.dev/v1alpha1"}'
        created_at: '2026-10-29T10:21:44Z'
        updated_at: '2026-10-29T10:21:44Z'
