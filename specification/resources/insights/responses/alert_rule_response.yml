description: A single alert rule.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      type: object
      required:
        - alert_rule
      properties:
        alert_rule:
          $ref: '../models/alert_rule.yml'
    example:
      alert_rule:
        id: 4de7ac8b-495b-4884-9a69-1050c6793cd6
        spec:
          name: CPU high
          query:
            metric: cpu
            resource_urns:
              - do:droplet:12345678
            tags:
              - production
          condition:
            window: EVALUATION_WINDOW_5M
          thresholds:
            warning: 80
            critical: 95
            operator: THRESHOLD_OPERATOR_GREATER_THAN
          notification_channels:
            - notification_channel_id: 78b3da62-27e5-49ba-ac70-5db0b5935c64
              notify_on:
                - SEVERITY_CRITICAL
          re_alert_duration: RE_ALERT_DURATION_4H
        status: ALERT_RULE_STATUS_ACTIVE
        owner_uuid: 9a6d9e58-3b2f-4c1a-9f0e-1d2c3b4a5e6f
        owner_id: 1234567
        created_at: '2026-03-15T12:00:00Z'
        updated_at: '2026-03-15T12:00:00Z'
