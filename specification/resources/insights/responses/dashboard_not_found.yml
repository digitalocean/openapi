description: >-
  No dashboard with this identifier exists in your team. Deleted dashboards
  and dashboards owned by other teams also return this response.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      $ref: '../models/dashboard_error.yml'
    example:
      error: dashboard not found
      code: 5
      message: dashboard not found
