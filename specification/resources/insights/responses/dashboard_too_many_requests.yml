description: >-
  Either the API rate limit has been exceeded, or a dashboards product limit
  was reached: the team already holds its maximum number of dashboards, or the
  `spec` contains more panels than allowed per dashboard. Rate-limit responses
  use the standard DigitalOcean error body. Product-limit responses use the
  dashboards service error body; a dashboard-count limit carries a
  `google.rpc.ErrorInfo` detail with `reason` set to `dashboard_limit_reached`.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      oneOf:
        - $ref: '../../../shared/models/error.yml'
        - $ref: '../models/dashboard_error.yml'
    examples:
      rate_limited:
        summary: API rate limit exceeded
        value:
          id: too_many_requests
          message: API rate limit exceeded.
      dashboard_limit_reached:
        summary: Team dashboard limit reached
        value:
          error: This team has reached the limit of 50 dashboards. Delete an existing dashboard before creating another, or contact support to request a higher limit.
          code: 8
          message: This team has reached the limit of 50 dashboards. Delete an existing dashboard before creating another, or contact support to request a higher limit.
          details:
            - '@type': type.googleapis.com/google.rpc.ErrorInfo
              reason: dashboard_limit_reached
              metadata:
                limit: '50'
                description: This team has reached the limit of 50 dashboards. Delete an existing dashboard before creating another, or contact support to request a higher limit.
      chart_limit_reached:
        summary: Per-dashboard chart limit reached
        value:
          error: Max number of charts reached per dashboard. Delete a chart to add another, or contact support to request a higher limit.
          code: 8
          message: Max number of charts reached per dashboard. Delete a chart to add another, or contact support to request a higher limit.
