alert_rule_id:
  in: path
  name: id
  description: A unique identifier for an alert rule.
  required: true
  schema:
    type: string
    format: uuid
  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890

resource_urn:
  in: query
  name: resource_urn
  required: false
  description: |
    Optional filter. When set, only alert rules that target this resource URN
    are returned.
  schema:
    type: string
  example: do:droplet:12345

page:
  in: query
  name: page
  required: false
  description: Which page of results to return.
  schema:
    type: integer
    minimum: 1
    default: 1
  example: 1

per_page:
  in: query
  name: per_page
  required: false
  description: Number of items returned per page.
  schema:
    type: integer
    minimum: 1
    default: 20
    maximum: 200
  example: 20
