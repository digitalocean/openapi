region:
  in: path
  name: region
  description: The datacenter region slug for the query.
  required: true
  schema:
    type: string
  example: nyc3

label_name:
  in: path
  name: name
  description: The label name whose values should be listed.
  required: true
  schema:
    type: string
  example: __name__

query:
  in: query
  name: query
  description: >-
    A PromQL expression. This may be a metric selector (for example `do.droplets.cpu_time`) or a
    fuller expression (for example `rate(do.droplets.cpu_time[5m])`).
  required: true
  schema:
    type: string
  example: do.droplets.cpu_time

time:
  in: query
  name: time
  description: >-
    Evaluation timestamp for an instant query. Accepts a RFC3339 string or a
    UNIX timestamp. Defaults to now when omitted.
  required: false
  schema:
    type: string
  example: "1620683817"

start:
  in: query
  name: start
  description: >-
    Start timestamp (inclusive). Accepts a RFC3339 string or a UNIX timestamp.
  required: true
  schema:
    type: string
  example: "1620683817"

end:
  in: query
  name: end
  description: >-
    End timestamp (inclusive). Accepts a RFC3339 string or a UNIX timestamp.
  required: true
  schema:
    type: string
  example: "1620705417"

step:
  in: query
  name: step
  description: >-
    Query resolution step width as a Prometheus duration string (for example
    `15s`, `1m`, `1h`).
  required: true
  schema:
    type: string
  example: 15s

timeout:
  in: query
  name: timeout
  description: >-
    Optional evaluation timeout as a Prometheus duration string.
  required: false
  schema:
    type: string
  example: 30s

start_optional:
  in: query
  name: start
  description: >-
    Optional start timestamp (inclusive). Accepts a RFC3339 string or a UNIX
    timestamp.
  required: false
  schema:
    type: string
  example: "1620683817"

end_optional:
  in: query
  name: end
  description: >-
    Optional end timestamp (inclusive). Accepts a RFC3339 string or a UNIX
    timestamp.
  required: false
  schema:
    type: string
  example: "1620705417"

match:
  in: query
  name: match[]
  description: >-
    One or more series selectors. Repeat the parameter for multiple matchers.
  required: false
  schema:
    type: array
    items:
      type: string
  style: form
  explode: true
  example:
    - '{__name__=~".+"}'

match_required:
  in: query
  name: match[]
  description: >-
    One or more series selectors. At least one matcher is required. Repeat the
    parameter for multiple matchers.
  required: true
  schema:
    type: array
    items:
      type: string
  style: form
  explode: true
  example:
    - '{__name__="do.droplets.cpu_time"}'
