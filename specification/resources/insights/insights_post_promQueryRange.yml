operationId: insights_post_promQueryRange

summary: Execute a range PromQL query

description: >-
  To evaluate a PromQL expression over a time range, send a POST request to `/v2/insights/query/{region}/prom/api/v1/query_range` with `application/x-www-form-urlencoded` parameters.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/region'

requestBody:
  required: true
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
          - query
          - start
          - end
          - step
        properties:
          query:
            type: string
            description: A PromQL expression to evaluate.
            example: do.droplets.cpu_time
          start:
            type: string
            description: Start timestamp. RFC3339 or UNIX timestamp.
            example: "1620683817"
          end:
            type: string
            description: End timestamp. RFC3339 or UNIX timestamp.
            example: "1620705417"
          step:
            type: string
            description: Query resolution step width.
            example: 15s
          timeout:
            type: string
            description: Optional evaluation timeout duration.
            example: 30s

responses:
  '200':
    $ref: 'responses/prom_query_range.yml'

  '400':
    $ref: 'responses/prom_error.yml'

  '422':
    $ref: 'responses/prom_error.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: 'responses/prom_error.yml'

  '503':
    $ref: 'responses/prom_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_post_promQueryRange.yml'

security:
  - bearer_auth:
    - 'insights:read'
