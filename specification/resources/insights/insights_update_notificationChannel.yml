operationId: insights_update_notificationChannel

summary: Update a Notification Channel

description: |
  To update a notification channel, send a PUT request to
  `/v2/insights/notification-channels/{id}` with a `name` and exactly one of
  `email`, `slack`, or `webhook`.

  Sending a secret field rotates it; omitting the secret field keeps the
  existing value.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/notification_channel_id'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/notification_channel_request.yml'
      examples:
        slack:
          summary: Slack channel
          value:
            name: Platform alerts (updated)
            slack:
              webhook_url: https://hooks.slack.com/services/T000/B000/NEWTOKEN
              channel: '#platform-alerts-prod'

responses:
  '200':
    $ref: 'responses/notification_channel_response.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_update_notificationChannel.yml'

security:
  - bearer_auth:
      - 'insights:update'
