operationId: insights_get_trace

summary: Retrieve an existing trace

description: >-
  To retrieve a single trace and all of its spans, send a GET request to
  `/v2/insights/query/{region}/traces/{trace_id}`.

  Spans are returned ordered by start time. A trace is only resolvable in the
  region that ingested it; querying another region returns `404`.

  JSON field names are camelCase (`traceId`, `spanId`, `startTime`, `endTime`,
  `durationNs`, `serviceName`, `statusCode`, `parentSpanId`).

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/region'
  - $ref: 'parameters.yml#/trace_id'

responses:
  '200':
    $ref: 'responses/trace.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_get_trace.yml'

security:
  - bearer_auth:
    - 'insights:read'
