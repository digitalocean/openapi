lang: cURL
source: |-
  curl -X POST \
    -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
    -H "Content-Type: application/json" \
    -d '{
      "timeRange": {
        "from": {"relative": "15m"},
        "to": {"relative": "now"}
      },
      "pagination": {"limit": 50}
    }' \
    "https://api.digitalocean.com/v2/insights/query/nyc3/traces/search"
