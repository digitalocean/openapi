operationId: insights_list_alertRules

summary: List Alert Rules

description: |
  To list alert rules for your account, send a GET request to
  `/v2/insights/alert-rules`. Results are paginated with `page` and `per_page`
  (default `20`, maximum `200`). Optionally filter by `resource_urn`.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/page'
  - $ref: 'parameters.yml#/per_page'
  - $ref: 'parameters.yml#/resource_urn'

responses:
  '200':
    $ref: 'responses/list_alert_rules_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_list_alertRules.yml'

security:
  - bearer_auth:
      - 'insights:read'
