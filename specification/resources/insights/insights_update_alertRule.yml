operationId: insights_update_alertRule

summary: Update an Alert Rule

description: |
  To update an alert rule, send a PUT request to
  `/v2/insights/alert-rules/{id}` with a full `spec`. Omit
  `notification_channels` to keep existing bindings. Omit `status` or
  `re_alert_duration` to keep those existing values.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/alert_rule_id'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/alert_rule_request.yml'
      example:
        spec:
          name: CPU high
          query:
            metric: cpu
            resource_urns:
              - do:droplet:12345678
          condition:
            window: EVALUATION_WINDOW_5M
          thresholds:
            warning: 85
            critical: 95
            operator: THRESHOLD_OPERATOR_GREATER_THAN
          notification_channels:
            - notification_channel_id: 78b3da62-27e5-49ba-ac70-5db0b5935c64
              notify_on:
                - SEVERITY_WARNING
                - SEVERITY_CRITICAL
          re_alert_duration: RE_ALERT_DURATION_1H
        status: ALERT_RULE_STATUS_ACTIVE

responses:
  '200':
    $ref: 'responses/alert_rule_response.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_update_alertRule.yml'

security:
  - bearer_auth:
      - 'insights:update'
