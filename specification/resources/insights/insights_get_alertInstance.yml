operationId: insights_get_alertInstance

summary: Retrieve an Alert Instance

description: |
  To retrieve a single alert instance, send a GET request to
  `/v2/insights/alert-instances/{id}`.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/alert_instance_id'

responses:
  '200':
    $ref: 'responses/alert_instance_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_get_alertInstance.yml'

security:
  - bearer_auth:
      - 'insights:read'
