operationId: insights_get_promQueryRange

summary: Execute a range PromQL query

description: >-
  To evaluate a PromQL expression over a time range, send a GET request to `/v2/insights/query/{region}/prom/api/v1/query_range`.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/region'
  - $ref: 'parameters.yml#/query'
  - $ref: 'parameters.yml#/start'
  - $ref: 'parameters.yml#/end'
  - $ref: 'parameters.yml#/step'
  - $ref: 'parameters.yml#/timeout'

responses:
  '200':
    $ref: 'responses/prom_query_range.yml'

  '400':
    $ref: 'responses/prom_error.yml'

  '422':
    $ref: 'responses/prom_error.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: 'responses/prom_error.yml'

  '503':
    $ref: 'responses/prom_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_get_promQueryRange.yml'

security:
  - bearer_auth:
    - 'insights:read'
