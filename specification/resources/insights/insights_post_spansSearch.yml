operationId: insights_post_spansSearch

summary: Search spans

description: >-
  To search spans in a region, send a POST request to
  `/v2/insights/query/{region}/spans/search` with a JSON body describing the
  time range, optional filter, ordering, and pagination.

  The time range must not exceed 7 days. `pagination.limit` defaults to 100 and
  must be between 1 and 1000. Results are ordered by `startTime` descending by
  default. Cursor-based pagination is not yet supported; `pagination.hasMore`
  indicates whether additional spans matched beyond the returned page.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/region'

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models/spans_search_request.yml'

responses:
  '200':
    $ref: 'responses/spans_search.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_post_spansSearch.yml'

security:
  - bearer_auth:
    - 'insights:read'
