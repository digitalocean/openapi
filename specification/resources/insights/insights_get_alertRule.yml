operationId: insights_get_alertRule

summary: Retrieve an Alert Rule

description: |
  To retrieve an alert rule, send a GET request to
  `/v2/insights/alert-rules/{id}`.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/alert_rule_id'

responses:
  '200':
    $ref: 'responses/alert_rule_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_get_alertRule.yml'

security:
  - bearer_auth:
      - 'insights:read'
