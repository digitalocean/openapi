operationId: insights_get_promLabels

summary: List label names

description: >-
  To list label names, send a GET request to `/v2/insights/query/{region}/prom/api/v1/labels`.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/region'
  - $ref: 'parameters.yml#/start_optional'
  - $ref: 'parameters.yml#/end_optional'
  - $ref: 'parameters.yml#/match'

responses:
  '200':
    $ref: 'responses/prom_labels.yml'

  '400':
    $ref: 'responses/prom_error.yml'

  '422':
    $ref: 'responses/prom_error.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: 'responses/prom_error.yml'

  '503':
    $ref: 'responses/prom_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_get_promLabels.yml'

security:
  - bearer_auth:
    - 'insights:read'
