operationId: insights_post_promLabels

summary: List label names (POST)

description: >-
  To list label names, send a POST request to `/v2/insights/query/{region}/prom/api/v1/labels` with `application/x-www-form-urlencoded` parameters.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/region'

requestBody:
  required: false
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          start:
            type: string
            description: Optional start timestamp.
            example: "1620683817"
          end:
            type: string
            description: Optional end timestamp.
            example: "1620705417"
          match[]:
            type: array
            items:
              type: string
            description: Optional series selectors.

responses:
  '200':
    $ref: 'responses/prom_labels.yml'

  '400':
    $ref: 'responses/prom_error.yml'

  '422':
    $ref: 'responses/prom_error.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: '../../shared/responses/forbidden.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: 'responses/prom_error.yml'

  '503':
    $ref: 'responses/prom_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_post_promLabels.yml'

security:
  - bearer_auth:
    - 'insights:read'
