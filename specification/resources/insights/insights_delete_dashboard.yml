operationId: insights_delete_dashboard

summary: Delete a Dashboard

description: |
  To delete a dashboard, send a DELETE request to
  `/v2/insights/dashboards/{uuid}`.

  A successful request returns `200` with an empty JSON object as the body.

tags:
  - Insights

parameters:
  - $ref: 'parameters.yml#/dashboard_uuid'

responses:
  '200':
    $ref: 'responses/dashboard_deleted_response.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: 'responses/dashboard_not_found.yml'

  '429':
    $ref: 'responses/dashboard_too_many_requests.yml'

  '500':
    $ref: 'responses/dashboard_server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_delete_dashboard.yml'

security:
  - bearer_auth:
      - 'insights:delete'
