operationId: insights_list_alertInstances

summary: List Alert Instances

description: |
  To list alert instances for your account, send a GET request to
  `/v2/insights/alert-instances`. Alert instances are read-only records of
  alert rule firings against your resources.

  Results can optionally be filtered by `status`, `rule_id`, or
  `resource_urn`.

tags:
  - Insights

parameters:
  - $ref: '../../shared/parameters.yml#/per_page'
  - $ref: '../../shared/parameters.yml#/page'
  - $ref: 'parameters.yml#/alert_instance_status'
  - $ref: 'parameters.yml#/rule_id'
  - $ref: 'parameters.yml#/resource_urn'

responses:
  '200':
    $ref: 'responses/list_alert_instances_response.yml'

  '400':
    $ref: '../../shared/responses/bad_request.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/insights_list_alertInstances.yml'

security:
  - bearer_auth:
      - 'insights:read'
