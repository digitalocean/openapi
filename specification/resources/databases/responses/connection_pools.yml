description: A JSON object with a key of `pools`.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      $ref: '../models/connection_pools.yml'
    example:
      pools:
      - user: doadmin
        name: reporting-pool
        size: 10
        db: defaultdb
        mode: session
        connection:
          uri: postgres://doadmin:example_password@db.example.com:25061/foo?sslmode=require
          database: foo
          host: db.example.com
          port: 25061
          user: doadmin
          password: example_password
          ssl: true
      - user: doadmin
        name: backend-pool
        size: 10
        db: defaultdb
        mode: transaction
        connection:
          uri: postgres://doadmin:example_password@db.example.com:25061/backend-pool?sslmode=require
          database: backend-pool
          host: db.example.com
          port: 25061
          user: doadmin
          password: example_password
          ssl: true
