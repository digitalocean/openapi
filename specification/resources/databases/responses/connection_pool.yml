description: A JSON object with a key of `pool`.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      type: object
      properties:
        pool:
          $ref: '../models/connection_pool.yml'
      required:
        - pool
    example:
      pool:
        user: doadmin
        name: backend-pool
        size: 10
        db: defaultdb
        mode: transaction
        connection:
          uri: postgres://doadmin:example_password@db.example.com:25061/backend-pool?sslmode=require
          database: backend-pool
          host: db.example.com
          port: 25061
          user: doadmin
          password: example_password
          ssl: true
