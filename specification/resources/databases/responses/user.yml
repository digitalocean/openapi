description: A JSON object with a key of `user`.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      type: object
      properties:
        user:
          $ref: '../models/database_user.yml'
      required:
        - user
    examples:
      New User:
        value:
          user:
            name: app-01
            role: normal
            password: example_password

      New User with MySQL Auth Plugin:
        value:
          user:
            name: app-02
            role: normal
            password: example_password
            mysql_settings:
              auth_plugin: mysql_native_password
      
      New User for Postgres with replication rights:
        value:
          user:
            name: app-02
            role: normal
            password: example_password
            settings:
              pg_allow_replication: true 

      Kafka User:
        value:
          user:
            name: app-03
            role: normal
            password: example_password
            access_cert: "-----BEGIN CERTIFICATE-----\nMIIEexampleCertificateNotForProductionUseOnly\n-----END CERTIFICATE-----"
            access_key: "-----BEGIN PRIVATE KEY-----\nMIIEexamplePrivateKeyNotForProductionUseOnly\n-----END PRIVATE KEY-----"
            settings:
              acl:
              - id: acl128aaaa99239
                permission: produceconsume
                topic: customer-events
              - id: acl293098flskdf
                permission: produce
                topic: customer-events.*
              - id: acl128ajei20123
                permission: consume
                topic: customer-events