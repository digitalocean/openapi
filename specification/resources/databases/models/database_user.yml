type: object

properties:
  name:
    type: string
    example: app-01
    description: The name of a database user.

  role:
    type: string
    enum:
      - primary
      - normal
    example: normal
    description: |
      A string representing the database user's role. The value will be either
      "primary" or "normal".
    readOnly: true

  password:
    type: string
    example: example_password
    description: A randomly generated password for the database user.<br>Requires `database:view_credentials` scope.
    readOnly: true

  access_cert:
    type: string
    example: "-----BEGIN CERTIFICATE-----\nMIIEexampleCertificateNotForProductionUseOnly\n-----END CERTIFICATE-----"
    description: Access certificate for TLS client authentication. (Kafka only)
    readOnly: true

  access_key:
    type: string
    example: "-----BEGIN PRIVATE KEY-----\nMIIEexamplePrivateKeyNotForProductionUseOnly\n-----END PRIVATE KEY-----"
    description: Access key for TLS client authentication. (Kafka only)
    readOnly: true

  mysql_settings:
    $ref: './mysql_settings.yml'

  settings:
    $ref: './user_settings.yml'

required:
  - name
