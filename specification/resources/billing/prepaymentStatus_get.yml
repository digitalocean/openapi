operationId: prepaymentStatus_get

summary: Get Customer Prepayment Status

description: >-
  To retrieve the prepayment gate status and balances for a customer's account,
  send a GET request to `/v2/customers/my/prepayment_status`.

tags:
  - Billing

responses:
  '200':
    $ref: 'responses/prepayment_status.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: '../../shared/responses/not_found.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/prepaymentStatus_get.yml'
  - $ref: 'examples/python/prepaymentStatus_get.yml'

security:
  - bearer_auth:
    - 'billing:read'
