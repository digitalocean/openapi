description: >-
  The response will be a JSON object with the customer's prepayment
  configuration and current prepayment status.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      $ref: '../models/prepayment_config_response.yml'

    example:
      config:
        spend_limit: '100.00'
        is_auto_prepay_enabled: true
        prepay_amount: '50.00'
        prepay_threshold: '10.00'
        created_at: '2026-06-22T19:31:51Z'
        updated_at: '2026-06-25T18:40:07Z'
      status:
        balance: '25.00'
        is_auto_prepay_enabled: true
        blocked: true
        eligible: true
        month_to_date_balance: '75.00'
