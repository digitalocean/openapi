lang: Go
source: |-
  package main

  import (
      "context"
      "fmt"
      "os"

      "github.com/digitalocean/godo"
  )

  func main() {
      client := godo.NewFromToken(os.Getenv("DIGITALOCEAN_TOKEN"))
      ctx := context.Background()

      resp, _, err := client.ImageGenerations.Generate(ctx, &godo.ImageGenerateParams{
          Model:   "openai-gpt-image-1",
          Prompt:  "A cute baby sea otter floating on its back in calm blue water",
          Size:    godo.PtrTo("auto"),
          Quality: godo.PtrTo("auto"),
          N:       1,
      })
      if err != nil {
          panic(err)
      }

      fmt.Println(resp.Data[0].B64JSON)
  }
