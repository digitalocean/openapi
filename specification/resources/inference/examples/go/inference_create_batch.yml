lang: Go
source: |-
  package main

  import (
      "context"
      "crypto/rand"
      "encoding/hex"
      "fmt"
      "os"

      "github.com/digitalocean/godo"
  )

  func main() {
      client := godo.NewFromToken(os.Getenv("DIGITALOCEAN_TOKEN"))
      ctx := context.Background()

      id := make([]byte, 16)
      if _, err := rand.Read(id); err != nil {
          panic(err)
      }

      batch, _, err := client.BatchInference.CreateJob(ctx, &godo.CreateBatchRequest{
          FileID:           os.Getenv("BATCH_INPUT_FILE_ID"),
          Provider:         "openai",
          Endpoint:         "/v1/chat/completions",
          CompletionWindow: "24h",
          RequestID:        hex.EncodeToString(id),
      })
      if err != nil {
          panic(err)
      }

      fmt.Println("batch_id:", batch.BatchID)
      fmt.Println("status:  ", batch.Status)
  }
