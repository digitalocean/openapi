lang: Go
label: Tool search
source: |-
  package main

  import (
      "context"
      "fmt"
      "os"

      "github.com/digitalocean/godo"
  )

  func main() {
      client := godo.NewFromToken(os.Getenv("DIGITALOCEAN_TOKEN"))
      ctx := context.Background()

      resp, _, err := client.Responses.New(ctx, &godo.ResponseNewParams{
          Model: "openai-gpt-5.5",
          Input: "Compare the current weather in zip code 94107 and 10001.",
          Tools: []godo.ResponseTool{
              godo.FunctionTool("get_weather", "Get weather for a zip code", map[string]interface{}{
                  "type": "object",
                  "properties": map[string]interface{}{
                      "zip": map[string]interface{}{"type": "string"},
                  },
                  "required": []string{"zip"},
              }),
              godo.ToolSearchTool(),
          },
          MaxOutputTokens: godo.PtrTo(1024),
      })
      if err != nil {
          panic(err)
      }

      fmt.Println(resp.OutputText())
  }
