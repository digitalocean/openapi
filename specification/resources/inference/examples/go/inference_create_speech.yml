lang: Go
source: |-
  package main

  import (
      "context"
      "fmt"
      "os"

      "github.com/digitalocean/godo"
  )

  func main() {
      client := godo.NewFromToken(os.Getenv("DIGITALOCEAN_TOKEN"))
      ctx := context.Background()

      speech, _, err := client.Audio.Speech.New(ctx, &godo.SpeechNewParams{
          Model:          "qwen3-tts-voicedesign",
          Input:          "Hello, world!",
          Voice:          "alloy",
          ResponseFormat: "mp3",
          Instructions:   "Speak naturally.",
      })
      if err != nil {
          panic(err)
      }

      audioBytes, err := speech.Bytes()
      if err != nil {
          panic(err)
      }
      if err := os.WriteFile("output.mp3", audioBytes, 0644); err != nil {
          panic(err)
      }
      fmt.Println("Wrote output.mp3")
  }
