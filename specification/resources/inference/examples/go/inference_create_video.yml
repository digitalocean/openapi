lang: Go
source: |-
  package main

  import (
      "context"
      "fmt"
      "os"

      "github.com/digitalocean/godo"
  )

  func main() {
      client := godo.NewFromToken(os.Getenv("DIGITALOCEAN_TOKEN"))
      ctx := context.Background()

      job, _, err := client.Video.Generations.Create(ctx, &godo.VideoGenerateParams{
          Model:  "wan2-2-t2v-a14b",
          Prompt: "Two anthropomorphic cats in boxing gear fight intensely on a spotlighted stage",
          Size:   "1280x720",
          FPS:    godo.PtrTo(16),
      })
      if err != nil {
          panic(err)
      }

      fmt.Println(job.ID, job.Status)
  }
