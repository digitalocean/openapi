operationId: inference_create_speech
summary: Generate speech from text
description: >
  Convert text input to speech audio. The response may be raw audio bytes
  (`audio/mpeg`, `audio/wav`, and similar) or a JSON envelope with
  base64-encoded audio in `data[].b64_json`.
tags:
  - Serverless Inference
servers:
  - url: "https://inference.do-ai.run"
    description: production
x-inference-base-url: "https://inference.do-ai.run"
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "models/create_speech_request.yml"
responses:
  "200":
    description: Successful speech generation.
    headers:
      ratelimit-limit:
        $ref: '../../shared/headers.yml#/ratelimit-limit'
      ratelimit-remaining:
        $ref: '../../shared/headers.yml#/ratelimit-remaining'
      ratelimit-reset:
        $ref: '../../shared/headers.yml#/ratelimit-reset'
    content:
      application/json:
        schema:
          $ref: "models/speech_response.yml"
      audio/mpeg:
        schema:
          type: string
          format: binary
      audio/wav:
        schema:
          type: string
          format: binary
      audio/mp3:
        schema:
          type: string
          format: binary
  "401":
    $ref: '../../shared/responses/unauthorized.yml'
  "429":
    $ref: '../../shared/responses/too_many_requests.yml'
  "500":
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'
x-codeSamples:
  - $ref: 'examples/curl/inference_create_speech.yml'
  - $ref: 'examples/python/inference_create_speech.yml'
  - $ref: 'examples/go/inference_create_speech.yml'
  - $ref: 'examples/dots/inference_create_speech.yml'
security:
  - inference_bearer_auth: []
