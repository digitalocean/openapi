operationId: inference_get_video
summary: Retrieve a video generation job
description: >
  Returns the current state of a video generation job. Poll until `status`
  reaches a terminal value such as `completed` or `failed`.
tags:
  - Serverless Inference
servers:
  - url: "https://inference.do-ai.run"
    description: production
x-inference-base-url: "https://inference.do-ai.run"
parameters:
  - in: path
    name: video_id
    description: The video generation job identifier.
    required: true
    schema:
      type: string
    example: "video_bGl0ZWxsbTpjdXN0b21fbGxtX3Byb3ZpZGVyOm9wZW5haTttb2RlbF9pZDo7dmlkZW9faWQ6ZGExYjFmYzMtYTM3NC00MmM0LTgxMWMtOWE5NmE3ZWY0OTIz"
responses:
  "200":
    description: The video generation job.
    headers:
      ratelimit-limit:
        $ref: '../../shared/headers.yml#/ratelimit-limit'
      ratelimit-remaining:
        $ref: '../../shared/headers.yml#/ratelimit-remaining'
      ratelimit-reset:
        $ref: '../../shared/headers.yml#/ratelimit-reset'
    content:
      application/json:
        schema:
          $ref: "models/video_generation.yml"
  "401":
    $ref: '../../shared/responses/unauthorized.yml'
  "404":
    $ref: '../../shared/responses/not_found.yml'
  "429":
    $ref: '../../shared/responses/too_many_requests.yml'
  "500":
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'
x-codeSamples:
  - $ref: 'examples/curl/inference_get_video.yml'
  - $ref: 'examples/python/inference_get_video.yml'
  - $ref: 'examples/go/inference_get_video.yml'
  - $ref: 'examples/dots/inference_get_video.yml'
security:
  - inference_bearer_auth: []
