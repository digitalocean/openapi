per_page:
  name: per_page
  in: query
  required: false
  description: Page size. Defaults to 20; values above 100 are capped at 100.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  example: 20

tools_per_page:
  name: per_page
  in: query
  required: false
  description: Page size. Defaults to 100 when omitted or 0; values above 100 are capped at 100.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 100
  example: 100

page_size:
  name: page_size
  in: query
  required: false
  description: Page size, 1 to 100. Defaults to 20 when omitted or 0; other values are rejected with 
    400.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  example: 20

page_token:
  name: page_token
  in: query
  required: false
  description: >-
    `next_page_token` from the previous response. Valid only with the same tool selection; otherwise the
    request is rejected with 400.
  schema:
    type: string
  example: ZXhhX3dlYl9zZWFyY2hAMQ

search_query:
  name: query
  in: query
  required: false
  description: >-
    Matched case-insensitively as a substring of name, `actor_id`, `session_urn`, or `agentName`. Empty
    matches every session you can see. Results are ordered by match quality (an exact name, `session_urn`,
    or `actor_id` match, then a prefix, then a substring), then by name, across the whole result set, so
    a client must not re-sort a page to rank it.
  schema:
    type: string
  example: search

toolkit_id:
  name: toolkit_id
  in: query
  required: false
  description: >-
    Restricts the page to one provider. It accepts the provider ID the catalog returns, including the `serverRef`
    of one of your team's MCP servers.
  schema:
    type: string
  example: exa

tool_slug:
  name: tool_slug
  in: path
  required: true
  description: Catalog tool slug, for example `exa_search`. Required.
  schema:
    type: string
  example: exa_web_search

health_window:
  name: window
  in: query
  required: false
  description: |-
    Window to aggregate over. Defaults to twenty-four hours.

    - `HEALTH_WINDOW_UNSPECIFIED`: Twenty-four hours.
    - `HEALTH_WINDOW_ONE_HOUR`: One hour; history points are 10 minutes.
    - `HEALTH_WINDOW_TWENTY_FOUR_HOURS`: Twenty-four hours; history points are 1 hour.
    - `HEALTH_WINDOW_SEVEN_DAYS`: Seven days; history points are 6 hours.
    - `HEALTH_WINDOW_THIRTY_DAYS`: Thirty days; history points are 24 hours.
  schema:
    type: string
    enum:
      - HEALTH_WINDOW_ONE_HOUR
      - HEALTH_WINDOW_TWENTY_FOUR_HOURS
      - HEALTH_WINDOW_SEVEN_DAYS
      - HEALTH_WINDOW_THIRTY_DAYS
    default: HEALTH_WINDOW_TWENTY_FOUR_HOURS
  example: HEALTH_WINDOW_SEVEN_DAYS

health_provider:
  name: provider
  in: query
  required: false
  description: Optional provider ID, matched exactly, to return only that provider's tools.
  schema:
    type: string
  example: exa

include_history:
  name: include_history
  in: query
  required: false
  description: >-
    Additionally returns the window split into resolution-aligned points (the history field below).
  schema:
    type: boolean
    default: false
  example: true

search_tools_provider:
  name: provider
  in: query
  required: false
  description: >-
    Restricts results to these provider IDs, OR'd together. Repeat the parameter to select several. An unknown
    ID matches nothing.
  schema:
    type: array
    items:
      type: string
  style: form
  explode: true
  example:
    - exa

search_tools_toolbelt:
  name: toolbelt
  in: query
  required: false
  description: >-
    Restricts results to the members of that toolbelt of your team at its latest version, combined with
    query and provider as AND. Members are matched at the version the toolbelt pins, which is the same set
    and the same versions `GET /v2/action-gateway/toolbelts/{name}` reports. An unknown or deleted toolbelt
    returns 404 rather than an empty page.
  schema:
    type: string
  example: search-toolbelt

toolbelt_name:
  name: name
  in: path
  required: true
  description: Toolbelt name.
  schema:
    type: string
    pattern: '^[a-z][a-z0-9_-]{0,63}$'
  example: search-toolbelt

toolbelt_version:
  name: version
  in: query
  required: false
  description: Version number to read. Empty returns the latest version.
  schema:
    type: string
    pattern: '^[0-9]+$'
  example: '1'

toolbelt_status:
  name: status
  in: query
  required: false
  description: active (default), deprecated, or all. Case-insensitive.
  schema:
    type: string
    enum:
      - active
      - deprecated
      - all
    default: active
  example: active

toolbelt_search:
  name: search
  in: query
  required: false
  description: >-
    Restricts `tool_details` to members whose tool slug, name, title, description, provider, or category
    contains this value, case-insensitively. It does not filter toolbelt.tools. This is a substring match,
    not a filter expression.
  schema:
    type: string
  example: search

toolbelt_provider:
  name: provider
  in: path
  required: true
  description: >-
    A provider ID from the toolbelt's provider list, or `_legacy` for members recorded without a provider.
    Matched exactly.
  schema:
    type: string
  example: exa

view_id:
  name: view_id
  in: path
  required: true
  description: Output view ID.
  schema:
    type: string
  example: ov_4f0c2a9d8e1b47c6a3d5f7e9b1c3a5d7

output_view_tool:
  name: tool
  in: query
  required: false
  description: >-
    At most one of tool or `tool_id`, as on create. With one set, the list is the published views plus your
    team's own on that tool version. With neither, it is every live view your team owns plus every published
    view on a tool version your catalog exposes, across tools.
  schema:
    type: string
  example: exa_web_search

output_view_tool_id:
  name: tool_id
  in: query
  required: false
  description: Opaque ID of the tool version; see tool.
  schema:
    type: string
  example: tul_exa_web_search

server_ref:
  name: server_ref
  in: path
  required: true
  description: Server identifier (`serverRef`) of one of your team's MCP servers.
  schema:
    type: string
  example: docs

connection_id:
  name: id
  in: path
  required: true
  description: Connection ID.
  schema:
    type: string
  example: 39f9f768-a7f9-4c91-9557-3328c53dd054

connection_provider:
  name: provider
  in: query
  required: false
  description: Optional provider slug, matched exactly.
  schema:
    type: string
  example: jira

connection_user_id:
  name: user_id
  in: query
  required: false
  description: Optional substring of `user_id`. It must use the `user_id` alphabet, `[A-Za-z0-9._-]`.
  schema:
    type: string
  example: alice

connection_status:
  name: status
  in: query
  required: false
  description: >-
    pending|active|revoked|expired. List results always omit revoked connections, including when this filter
    is revoked.
  schema:
    type: string
    enum:
      - pending
      - active
      - expired
  example: active

connection_sort:
  name: sort
  in: query
  required: false
  description: '`created_at`, provider, `user_id`, or status. Defaults to provider, then `user_id`.'
  schema:
    type: string
    enum:
      - created_at
      - provider
      - user_id
      - status
  example: created_at

sort_direction:
  name: sort_direction
  in: query
  required: false
  description: asc (the default) or desc.
  schema:
    type: string
    enum:
      - asc
      - desc
  example: desc

session_urn:
  name: session_urn
  in: path
  required: true
  description: URN of the session, for example `do:managed_agent_session:<uuid>`.
  schema:
    type: string
  example: do:managed_agent_session:2b3c9f0e-1a4d-4e5f-8a7b-6c5d4e3f2a1b

end_user_id:
  name: end_user_id
  in: query
  required: false
  description: Optional `actor_id`, matched exactly.
  schema:
    type: string
  example: alice

user_id:
  name: user_id
  in: path
  required: true
  description: User ID.
  schema:
    type: string
  example: alice

users_user_id:
  name: user_id
  in: query
  required: false
  description: User ID prefix to return. An empty value returns all users.
  schema:
    type: string
  example: al

users_sort:
  name: sort
  in: query
  required: false
  description: >-
    `user_id`|`created_at`|`session_count`|`connection_count`. `created_at` is the earliest creation time
    among the user's sessions, connections, and limit overrides. Defaults to `created_at`.
  schema:
    type: string
    enum:
      - created_at
      - user_id
      - session_count
      - connection_count
    default: created_at
  example: session_count

actor_id:
  name: actor_id
  in: path
  required: true
  description: >-
    Actor ID: a session `actor_id` or a connection `user_id`, 1 to 64 characters from `[A-Za-z0-9._-]`.
  schema:
    type: string
    pattern: '^[A-Za-z0-9._-]{1,64}$'
  example: alice
page_connections:
  in: query
  name: page
  required: false
  description: 1-based page number. Values below 1 are treated as 1.
  schema:
    type: integer
    minimum: 1
    default: 1
  example: 1
end_user_id_sessions_search:
  name: end_user_id
  in: query
  required: false
  description: >-
    `end_user_id`, when set, is an exact filter on `actor_id` (the same filter as on the session list)
    and combines with query as AND.
  schema:
    type: string
  example: alice
page_token_sessions_search:
  name: page_token
  in: query
  required: false
  description: >-
    `next_page_token` from the previous response. Valid only with the same query and `end_user_id`; otherwise
    the request is rejected with 400.
  schema:
    type: string
  example: ZXhhX3dlYl9zZWFyY2hAMQ
search_query_toolbelts_search:
  name: query
  in: query
  required: false
  description: >-
    Matched case-insensitively as a substring of name, `display_name`, or description. Empty matches every
    toolbelt of your team.
  schema:
    type: string
  example: search
page_token_toolbelts_search:
  name: page_token
  in: query
  required: false
  description: >-
    `next_page_token` from the previous response. Valid only with the same query and status; otherwise
    the request is rejected with 400.
  schema:
    type: string
  example: ZXhhX3dlYl9zZWFyY2hAMQ
page_size_toolbelts:
  name: page_size
  in: query
  required: false
  description: >-
    Page size for `tool_details` only; toolbelt.tools always lists every member. Defaults to 20; values
    above 100 are capped at 100.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  example: 20
page_token_toolbelts:
  name: page_token
  in: query
  required: false
  description: >-
    `next_page_token` from the previous response, to continue `tool_details`. Treat it as opaque, and
    send it only with the same toolbelt, version, and search.
  schema:
    type: string
  example: ZXhhX3dlYl9zZWFyY2hAMQ
toolbelt_version_toolbelts_providers:
  name: version
  in: query
  required: false
  description: Version number to read. Empty reads the latest version.
  schema:
    type: string
    pattern: '^[0-9]+$'
  example: '1'
toolbelt_search_toolbelts_providers:
  name: search
  in: query
  required: false
  description: >-
    Restricts providers whose ID, name, or description contains this value, case-insensitively.
  schema:
    type: string
  example: search
toolbelt_search_toolbelts_providers_tools:
  name: search
  in: query
  required: false
  description: >-
    Restricts tools whose slug, name, title, description, provider, or category contains this value, case-insensitively,
    within the provider only.
  schema:
    type: string
  example: search
toolbelt_name_toolbelts_tools_add:
  name: name
  in: path
  required: true
  description: Toolbelt name, from the path.
  schema:
    type: string
    pattern: '^[a-z][a-z0-9_-]{0,63}$'
  example: search-toolbelt
page_tools:
  in: query
  name: page
  required: false
  description: >-
    1-based page index; values below 1 are treated as 1. A page past the end returns an empty tools list
    with the real total.
  schema:
    type: integer
    minimum: 1
    default: 1
  example: 1
health_provider_tools_health_providers:
  name: provider
  in: query
  required: false
  description: Optional provider ID, matched exactly, to return only that provider.
  schema:
    type: string
  example: exa
search_query_tools_providers_search:
  name: query
  in: query
  required: false
  description: >-
    Matched case-insensitively as a substring of name, `display_name`, or description. It does not match
    the titles of the tools a provider owns: "providers owning a tool that matches" is a tool search grouped
    by the provider field of each result.
  schema:
    type: string
  example: search
page_token_tools_providers_search:
  name: page_token
  in: query
  required: false
  description: >-
    `next_page_token` from the previous response. Valid only with the same query; otherwise the request
    is rejected with 400.
  schema:
    type: string
  example: ZXhhX3dlYl9zZWFyY2hAMQ
search_query_tools_search:
  name: query
  in: query
  required: false
  description: >-
    Matched case- and accent-insensitively as a substring of the tool's name, title, description, category,
    provider ID, or tool slug. Empty matches every tool your team can use.
  schema:
    type: string
  example: search
page_token_tools_search:
  name: page_token
  in: query
  required: false
  description: >-
    A `next_page_token` from the preceding response. It is pinned to the query and filters that produced
    it: replaying one against a different search is rejected with 400, not a silent restart from the top.
  schema:
    type: string
  example: ZXhhX3dlYl9zZWFyY2hAMQ
sort_direction_users:
  name: sort_direction
  in: query
  required: false
  description: asc|desc. Defaults to desc.
  schema:
    type: string
    enum:
      - asc
      - desc
  example: desc
