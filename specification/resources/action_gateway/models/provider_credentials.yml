provider_credential:
  type: object
  description: >-
    A stored provider credential. Responses contain metadata only, never API keys,
    client secrets, or secret storage references.
  properties:
    id:
      type: string
      description: Opaque ID used to select, retrieve, update, or delete the credential.
      example: example-credential-id
    provider:
      type: string
      description: Provider slug.
      example: example-provider
    display_name:
      type: string
      maxLength: 255
      description: Label, unique among the team's credentials for this provider, ignoring case.
      example: Production key
    kind:
      type: string
      description: >-
        Credential type. NONE, NO_AUTH, and USER_API_KEY describe MCP server
        credentials; NO_AUTH and USER_API_KEY are output-only values.
      enum:
      - PROVIDER_CREDENTIAL_KIND_UNSPECIFIED
      - PROVIDER_CREDENTIAL_KIND_OAUTH_CLIENT
      - PROVIDER_CREDENTIAL_KIND_API_KEY
      - PROVIDER_CREDENTIAL_KIND_NONE
      - PROVIDER_CREDENTIAL_KIND_NO_AUTH
      - PROVIDER_CREDENTIAL_KIND_USER_API_KEY
      example: PROVIDER_CREDENTIAL_KIND_API_KEY
    base_url:
      type: string
      description: Normalized HTTPS origin for this credential's provider API, when configured.
      example: https://api.example.com
    status:
      type: string
      description: >-
        Credential lifecycle state. Disabled credentials cannot be used by existing
        or new connections and cannot be re-enabled through this API. DELETED is
        returned only by deletion.
      enum:
      - PROVIDER_CREDENTIAL_STATUS_UNSPECIFIED
      - PROVIDER_CREDENTIAL_STATUS_ACTIVE
      - PROVIDER_CREDENTIAL_STATUS_DISABLED
      - PROVIDER_CREDENTIAL_STATUS_DELETED
      example: PROVIDER_CREDENTIAL_STATUS_ACTIVE
    created_at:
      type: string
      format: date-time
      description: When the credential was created.
      example: '2026-11-01T12:00:00Z'
    updated_at:
      type: string
      format: date-time
      description: When the credential was last modified.
      example: '2026-11-01T12:00:00Z'
    owning_user_id:
      type: string
      description: DigitalOcean user ID of the creator. Absent for a credential shared with the team.
      example: example-digitalocean-user-id
    reusable_by_team:
      type: boolean
      description: Whether everyone on the team can see and use the credential instead of only its creator.
      example: false
    redirect_url:
      type: string
      description: >-
        OAuth redirect URI supplied at registration. Empty when using DigitalOcean's
        callback or when the credential is not an OAuth client.
      example: ''
    scope:
      type: string
      description: Who can use the credential, either its creator (user) or the whole team (team).
      enum:
      - user
      - team
      example: user
    discovery:
      description: >-
        Authorization to discover a team-scoped MCP server's tools, when required.
        This authorization is not used to invoke tools.
      allOf:
      - $ref: '#/provider_credential_discovery'

provider_credential_discovery:
  type: object
  nullable: true
  description: Team-level MCP tool discovery authorization, not tool invocation authorization.
  properties:
    status:
      type: string
      description: Whether discovery needs authorization, is waiting for it, is active, or has expired.
      enum:
      - not_required
      - pending
      - active
      - expired
      example: active
    consented_by_user_id:
      type: string
      description: DigitalOcean user ID of the team owner who authorized discovery, or empty before consent.
      example: example-digitalocean-user-id
    consented_at:
      type: string
      format: date-time
      nullable: true
      description: When discovery was authorized, if consent has been given.
      example: '2026-11-01T12:00:00Z'
    authorization_url:
      type: string
      description: Where a team owner authorizes discovery. Set only while status is pending.
      example: ''

provider_credential_create:
  type: object
  description: >-
    Register a credential for a provider that supports the selected kind. API keys
    require api_key; OAuth clients require client_id and client_secret. Fields for
    the other kind are rejected. Register custom MCP servers through the MCP server
    API rather than creating API-key credentials for them here.
  required:
  - provider
  - kind
  - display_name
  properties:
    provider:
      type: string
      minLength: 1
      description: Required provider slug from the provider catalog.
      example: example-provider
    kind:
      type: string
      description: >-
        Credential type. NONE is available only for eligible MCP providers when
        team-scoped provider credentials are enabled; it accepts no credential fields.
      enum:
      - PROVIDER_CREDENTIAL_KIND_OAUTH_CLIENT
      - PROVIDER_CREDENTIAL_KIND_API_KEY
      - PROVIDER_CREDENTIAL_KIND_NONE
      example: PROVIDER_CREDENTIAL_KIND_API_KEY
    display_name:
      type: string
      minLength: 1
      maxLength: 255
      description: >-
        Required label, unique among the team's credentials for this provider,
        ignoring case. A duplicate returns 409.
      example: Production key
    api_key:
      type: string
      minLength: 1
      maxLength: 4096
      writeOnly: true
      description: Required for API-key credentials. Rejected for other kinds. Never returned.
      example: <provider-api-key>
    client_id:
      type: string
      minLength: 1
      maxLength: 255
      description: Required for OAuth client credentials. Rejected for other kinds.
      example: example-client-id
    client_secret:
      type: string
      minLength: 1
      maxLength: 1024
      writeOnly: true
      description: Required for OAuth client credentials. Rejected for other kinds. Never returned.
      example: <provider-client-secret>
    base_url:
      type: string
      maxLength: 255
      description: >-
        Provider API HTTPS origin. Accepted only when the provider allows one,
        restricted to its allowed hosts, and required when the provider requires it.
        Do not send this alongside credential_parameters.
      example: https://api.example.com
    credential_parameters:
      type: object
      additionalProperties: true
      description: >-
        Non-secret configuration for API-key providers that declare credential
        parameters. Validated against the provider's parameter definitions and
        used to derive base_url. Rejected for other credential kinds.
      example:
        subdomain: example
    reusable_by_team:
      type: boolean
      default: false
      description: >-
        Share the credential with the team. Defaults to false, so only its creator
        can see and use it. Requires the team owner role when team-scoped provider
        credentials are enabled for the account.
      example: false
    redirect_url:
      type: string
      maxLength: 1024
      description: >-
        OAuth clients only. Optional absolute HTTPS redirect URI registered at the
        provider, with no user information or fragment. Requires custom OAuth
        redirects to be enabled for the account. Omit to use DigitalOcean's callback.
        Cannot be changed after registration.
      example: https://app.example.com/oauth/callback

  oneOf:
  - properties:
      kind:
        type: string
        enum:
        - PROVIDER_CREDENTIAL_KIND_API_KEY
    required:
    - api_key
    not:
      anyOf:
      - required: [client_id]
      - required: [client_secret]
      - required: [redirect_url]
  - properties:
      kind:
        type: string
        enum:
        - PROVIDER_CREDENTIAL_KIND_OAUTH_CLIENT
    required:
    - client_id
    - client_secret
    not:
      anyOf:
      - required: [api_key]
      - required: [credential_parameters]
  - properties:
      kind:
        type: string
        enum:
        - PROVIDER_CREDENTIAL_KIND_NONE
    not:
      anyOf:
      - required: [api_key]
      - required: [client_id]
      - required: [client_secret]
      - required: [redirect_url]
      - required: [base_url]
      - required: [credential_parameters]

provider_credential_update:
  type: object
  minProperties: 1
  description: >-
    Change only the supplied fields. Omitted fields remain unchanged; no update mask
    is required. The provider, kind, and redirect_url cannot be changed. Empty
    secrets and display names are rejected. Connections keep the same credential ID.
  properties:
    display_name:
      type: string
      minLength: 1
      maxLength: 255
      description: New label, unique among the team's credentials for this provider, ignoring case.
      example: Production key
    api_key:
      type: string
      minLength: 1
      maxLength: 4096
      writeOnly: true
      description: New API key. Only valid for API-key credentials. Never returned.
      example: <replacement-provider-api-key>
    client_id:
      type: string
      minLength: 1
      maxLength: 255
      description: >-
        OAuth clients only. Required when changing client_id, client_secret, or
        base_url. Must match the originally registered client ID; a different ID
        is rejected. Register another credential to use a different OAuth client.
      example: example-client-id
    client_secret:
      type: string
      minLength: 1
      maxLength: 1024
      writeOnly: true
      description: New OAuth client secret. Requires client_id. Never returned.
      example: <replacement-provider-client-secret>
    base_url:
      type: string
      maxLength: 255
      description: >-
        New HTTPS origin, validated as on creation. An empty string clears it unless
        the provider requires an origin. OAuth client updates also require client_id.
      example: https://api.example.com
    credential_parameters:
      $ref: '#/provider_credential_create/properties/credential_parameters'
    reusable_by_team:
      type: boolean
      enum:
      - true
      description: >-
        Set to true to share a credential with the team. Requires team-scoped
        provider credentials to be enabled and the team owner role to share a
        private credential. Sharing cannot be undone; false is rejected.
      example: true

provider_credential_response:
  type: object
  description: Credential metadata and the number of connections removed by the operation.
  properties:
    credential:
      allOf:
      - $ref: '#/provider_credential'
      description: The registered or deleted credential, without secret material.
    revoked_connections:
      type: integer
      format: int32
      minimum: 0
      description: >-
        Number of connections deleted with the credential. Always zero for create,
        get, and update operations.
      example: 0

provider_credentials_list_response:
  type: object
  description: Registered credentials visible to the caller, without pagination.
  properties:
    credentials:
      type: array
      description: Credentials ordered by provider and display name, excluding DigitalOcean-owned OAuth applications.
      items:
        $ref: '#/provider_credential'
