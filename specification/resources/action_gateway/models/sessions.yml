session_policy:
  type: object
  nullable: true
  description: >-
    Tool-permission policy of a session.
  properties:
    defaultAction:
      type: string
      enum:
        - allow
        - ask
        - deny
      description: >-
        Action for calls no rule matches. Empty means ask; otherwise this must be allow, ask, or deny.
      example: ask
    rules:
      type: array
      items:
        type: object
        properties:
          tool:
            type: string
            description: >-
              Required. A tool slug, optionally `<tool_slug>@<version>`, or a toolbelt as `toolbelt:<name>@<version>`.
              When the session selects tools, the rule must name one of them.
            example: exa_web_search
          match:
            type: object
            description: >-
              Optional argument conditions, keyed by argument name; the rule applies only to calls whose arguments
              match.
            additionalProperties:
              type: string
            example: {}
          action:
            type: string
            enum:
              - allow
              - ask
              - deny
            example: allow
            description: 'Required: allow, ask, or deny.'
      description: Rules for specific tools or toolbelts.

session_network:
  type: object
  description: Attaches a session to a VPC.
  properties:
    vpcUuid:
      type: string
      format: uuid
      example: 5a4981aa-9653-4bd1-bef5-d6bff52042e4
      description: UUID of a VPC owned by your team, in a region that supports sessions.

session_insights:
  type: object
  description: Records which of a session's telemetry is sent to Insights.
  properties:
    metrics:
      type: boolean
      nullable: true
      example: true
      description: Accepted and stored for parity with the Insights schema.
    logs:
      type: boolean
      nullable: true
      example: true
      description: Whether the session's customer logs are sent to Insights.
    traces:
      type: boolean
      nullable: true
      example: false
      description: Whether the session's customer traces are sent to Insights.

session:
  type: object
  description: A session and the tool-permission policy bound to it.
  properties:
    sessionUrn:
      type: string
      example: do:managed_agent_session:2b3c9f0e-1a4d-4e5f-8a7b-6c5d4e3f2a1b
      description: Session URN, for example `do:managed_agent_session:<uuid>`.
    name:
      type: string
      example: support-bot-alice
      description: The required human-readable session name.
    actorId:
      type: string
      description: Empty when the session is not bound to an actor.
      example: alice
    policy:
      description: The session's tool-permission policy.
      allOf:
        - $ref: '#/session_policy'
    tools:
      type: object
      description: >-
        Omitted when the request omitted tools (all tools). A present selection with no references represents
        tools: [].
      properties:
        references:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - SESSION_TOOL_REFERENCE_KIND_TOOL
                  - SESSION_TOOL_REFERENCE_KIND_TOOLBELT
                example: SESSION_TOOL_REFERENCE_KIND_TOOLBELT
                description: Whether name is a tool or a toolbelt.
              name:
                type: string
                example: search-toolbelt
                description: Tool slug or toolbelt name.
              version:
                type: string
                example: '1'
                description: Pinned version.
          description: The selected references. Empty means the session exposes no tools.
    config:
      type: object
      description: Session options as supplied at creation. Omitted when none were supplied.
      example:
        preloadTools:
          - exa_web_search
        outputViews:
          exa_web_search: titles-and-urls
    network:
      description: >-
        Omitted when the request omitted network. A present binding currently supports only VPC attachment by
        UUID.
      allOf:
        - $ref: '#/session_network'
    insights:
      description: Omitted when no explicit customer Insights choice was stored.
      allOf:
        - $ref: '#/session_insights'
    agentUrn:
      type: string
      description: URN of the agent that started the session. Empty for sessions created through this API.
      example: ''
    agentName:
      type: string
      example: ''
      description: Name of the agent that started the session. Empty for sessions created through this 
        API.
    createdAt:
      type: string
      format: date-time
      nullable: true
      example: '2026-09-24T12:00:00Z'
      description: When the session was created.
    updatedAt:
      type: string
      format: date-time
      nullable: true
      example: '2026-09-24T12:00:00Z'
      description: When the session was last modified.
    owning_user_id:
      type: string
      description: DigitalOcean user ID of the user who created the session, when recorded.
      example: 2f8e1c3a-6b4d-4f7e-9a1c-5d3b7e9f1a2c

session_create:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      description: Required human-readable session name.
      example: support-bot-alice
    actorId:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,64}$'
      description: >-
        Optional actor binding: the user whose connections the session's tool calls use, matched against connection
        `user_id`. When set it must use the same alphabet as a connection's `user_id`, `[A-Za-z0-9._-]`, at
        most 64 characters; anything else is rejected with 400.
      example: alice
    policy:
      description: Optional tool-permission policy. Omitted asks before every call.
      allOf:
        - $ref: '#/session_policy'
    tools:
      type: array
      description: >-
        Omitted enables every tool. An explicit empty array enables no tools. Direct tools may be `<tool>` or
        `<tool>@<version>`, using provider-qualified tool slugs, and a pinned version must be the released one;
        toolbelt references must be version-pinned as `toolbelt:<belt-name>@<version>`.
      items:
        type: string
      example:
        - toolbelt:search-toolbelt@1
        - jira_create_issue
    config:
      type: object
      description: >-
        Optional session options. config.preloadTools may contain concrete tool names (optionally version-pinned)
        and version-pinned toolbelt references. config.customInstructions is a string of at most 1000 characters.
        config.outputViews maps up to 100 tool slugs to the name of an output view to apply to that tool's results.
      example:
        preloadTools:
          - exa_web_search
        outputViews:
          exa_web_search: titles-and-urls
        customInstructions: Prefer primary sources and cite URLs.
    network:
      description: >-
        Product-level session network binding. When set, `vpc_uuid` must identify a VPC owned by the session's
        team.
      allOf:
        - $ref: '#/session_network'
    insights:
      description: Omitted when the request omitted insights or explicitly sent null.
      allOf:
        - $ref: '#/session_insights'
  description: Describes a session to create.

create_session_response:
  type: object
  properties:
    session:
      description: The created session.
      allOf:
        - $ref: '#/session'
    mcpUrl:
      type: string
      description: URL of the session's MCP endpoint, for the agent to connect to.
      example: https://actions.do-ai.run/mcp/session/2b3c9f0e-1a4d-4e5f-8a7b-6c5d4e3f2a1b
    tools:
      type: array
      description: >-
        Canonical, version-pinned selected tool references. Empty when the session exposes every tool.
      items:
        type: string
      example:
        - toolbelt:search-toolbelt@1
        - jira_create_issue@1
  description: Returns the created session.

list_sessions_response:
  type: object
  properties:
    sessions:
      type: array
      items:
        $ref: '#/session'
      description: Sessions, newest first.
    pagination:
      description: Paging applied to this response and the total number of sessions.
      allOf:
        - $ref: 'shared.yml#/pagination'
  description: One page of sessions.

search_sessions_response:
  type: object
  properties:
    sessions:
      type: array
      description: Matching sessions in rank order.
      items:
        $ref: '#/session'
    next_page_token:
      description: Token for the next page; empty on the last page.
      allOf:
        - $ref: 'shared.yml#/next_page_token'
  description: One page of matching sessions.
