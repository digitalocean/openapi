output_view:
  type: object
  description: >-
    Output view as your team sees it.
  properties:
    view_id:
      type: string
      description: Output view ID, for example `ov_` followed by 32 hex digits. Empty on a preview.
      example: ov_4f0c2a9d8e1b47c6a3d5f7e9b1c3a5d7
    tool_id:
      type: string
      description: >-
        The opaque identity of the exact tool version the view is bound to; tool and version are its readable
        coordinates.
      example: tul_exa_web_search
    tool:
      type: string
      description: The provider-qualified tool slug, for example `exa_search`.
      example: exa_web_search
    version:
      type: string
      description: The tool version, for example `v3`.
      example: v1
    team_id:
      type: string
      description: >-
        Your team's ID on your team's views, and empty for a view DigitalOcean publishes to every team.
      example: '123456'
    name:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,63}$'
      example: titles-and-urls
      description: View name, unique per tool version among its owner's views.
    description:
      type: string
      example: Keep only result titles and URLs.
      description: View description.
    kind:
      type: string
      enum:
        - OUTPUT_VIEW_KIND_PROJECTION
        - OUTPUT_VIEW_KIND_TRANSFORM
      description: '`OUTPUT_VIEW_KIND_PROJECTION` or `OUTPUT_VIEW_KIND_TRANSFORM`.'
      example: OUTPUT_VIEW_KIND_PROJECTION
    fields:
      type: array
      description: >-
        The dotted output paths a projection keeps; arrays are traversed element-wise. Empty for a transform.
      items:
        type: string
      example:
        - results.title
        - results.url
    output_schema:
      type: object
      nullable: true
      description: The JSON Schema every result of this view satisfies.
      example:
        type: object
        properties:
          results:
            type: array
            items:
              type: object
              properties:
                title:
                  type: string
                url:
                  type: string
    audit:
      type: object
      nullable: true
      description: Null on a preview, which stores nothing.
      properties:
        createdAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-01T16:00:00Z'
          description: When the resource was created.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-01T16:00:00Z'
          description: When the resource was last modified.
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Set once the resource is deleted.
          example: null

output_view_create:
  type: object
  description: >-
    Describes a projection of one tool version's output.
  required:
    - name
    - fields
  properties:
    tool:
      type: string
      description: >-
        Exactly one of tool or `tool_id` selects the tool version. tool is a provider-qualified slug, optionally
        pinned as `<tool>@<version>`. You can bind only the released version your catalog exposes: an unpinned
        slug resolves it and the response echoes it as version; a pin must equal it, and a `tool_id` (the opaque
        identity from tool search) must be that version. Any other version returns 404.
      example: exa_web_search
    tool_id:
      type: string
      description: Opaque ID of the tool version; see tool.
      example: ''
    name:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,63}$'
      description: >-
        View name. Must match `^`[a-z]``[a-z0-9_-]`{0,63}$` and be unique per tool version within your team.
      example: titles-and-urls
    description:
      type: string
      maxLength: 512
      example: Keep only result titles and URLs.
      description: Optional description. At most 512 bytes.
    fields:
      type: array
      minItems: 1
      maxItems: 64
      description: >-
        Output paths to keep, 1 to 64 of them. Each is a dotted path of up to 8 segments made of `[A-Za-z0-9_-]`,
        and must be declared by the tool's output schema; arrays are traversed element-wise. Paths may not repeat
        or be a prefix of one another. The tool version must declare an object output schema.
      items:
        type: string
      example:
        - results.title
        - results.url

output_view_preview:
  type: object
  description: >-
    Carries the same fields as CreateOutputViewRequest. name and description are optional here: when present
    they are validated as on create, so a form can preview before the view is named.
  required:
    - fields
  properties:
    tool:
      type: string
      example: exa_web_search
      description: Tool slug, optionally pinned; as on create.
    tool_id:
      type: string
      example: ''
      description: Opaque ID of the tool version; as on create.
    name:
      type: string
      example: titles-and-urls
      description: Optional view name, validated as on create when present.
    description:
      type: string
      example: Keep only result titles and URLs.
      description: Optional description, validated as on create when present.
    fields:
      type: array
      items:
        type: string
      example:
        - results.title
        - results.url
      description: Output paths to keep; as on create.

output_view_response:
  type: object
  properties:
    view:
      description: The output view.
      allOf:
        - $ref: '#/output_view'
  description: Returns one output view.

list_output_views_response:
  type: object
  properties:
    views:
      type: array
      description: Ordered by tool version, then published views before your team's own, then name.
      items:
        $ref: '#/output_view'
    tool_id:
      type: string
      description: >-
        The tool version the views are bound to, echoed so an unpinned request learns which version it resolved.
        Empty when the request named no tool.
      example: tul_exa_web_search
    tool:
      type: string
      example: exa_web_search
      description: Tool slug of that version. Empty when the request named no tool.
    version:
      type: string
      example: v1
      description: Version of that tool, for example `v3`. Empty when the request named no tool.
    next_page_token:
      description: Empty on the last page.
      allOf:
        - $ref: 'shared.yml#/next_page_token'
  description: One page of output views.
