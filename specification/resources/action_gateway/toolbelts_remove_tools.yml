operationId: toolbelts_delete_tools
summary: Remove Tools from a Toolbelt
description: >-
  Removes the listed tools and returns the toolbelt. When membership changes, this creates a new version
  that keeps the display name and description. Tools that are not members are ignored, and removing every
  tool is allowed; deleting the toolbelt itself is a separate DELETE. Returns 400 when a pin differs from
  the version the toolbelt holds, and 404 for an unknown or deleted toolbelt.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/toolbelt_name_toolbelts_tools_add
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/toolbelts.yml#/toolbelt_tools
      example:
        tools:
        - exa_web_fetch
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/toolbelts.yml#/toolbelt_update_response
        example:
          toolbelt:
            name: search-toolbelt
            version: '2'
            display_name: Search Tools
            description: Tools for searching and fetching public web pages.
            tools:
            - exa_web_search@1
            status: active
            reference: search-toolbelt@2
            reference_latest: search-toolbelt
            tool_count: 1
            created_at: '2026-06-11T12:00:00Z'
            updated_at: '2026-06-12T09:30:00Z'
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/toolbelts_remove_tools.yml
security:
- bearer_auth:
  - action_gateway:delete
