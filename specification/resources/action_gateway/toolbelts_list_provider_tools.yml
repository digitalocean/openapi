operationId: toolbelts_list_provider_tools
summary: List Toolbelt Tools for a Provider
description: Lists the members of a toolbelt that belong to one provider.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/toolbelt_name
- $ref: parameters.yml#/toolbelt_provider
- $ref: parameters.yml#/toolbelt_version
- $ref: ../../shared/parameters.yml#/page
- $ref: parameters.yml#/per_page
- $ref: parameters.yml#/toolbelt_search
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/toolbelts.yml#/list_toolbelt_provider_tools_response
        example:
          tools:
          - tool_slug: exa_web_fetch
            name: web_fetch
            title: Web Fetch
            description: Fetch the contents of a public web page with Exa.
            provider: exa
            category: web-fetch
            version: 1
          - tool_slug: exa_web_search
            name: web_search
            title: Web Search
            description: Search the public web with Exa and return relevant results with normalized text
              snippets.
            provider: exa
            category: web-search
            version: 1
          pagination:
            page: 1
            per_page: 20
            total: 2
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/toolbelts_list_provider_tools.yml
security:
- bearer_auth:
  - action_gateway:read
