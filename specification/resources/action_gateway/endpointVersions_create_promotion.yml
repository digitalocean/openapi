operationId: endpointVersions_create_promotion
summary: Promote an Endpoint Version
description: >-
  Copies a live version's configuration into a new, higher-numbered head version
  and sets promoted_from_version_number. Existing versions never change. Only the
  endpoint owner may promote. A deleted, inaccessible, or different endpoint's
  version returns 404 endpoint_version_not_found.
  The new version always has a new identity and number, even for identical
  contents; deleted identities are never resurrected. Head replacement does not
  implicitly reset logs or traces: each signal retains its latest explicit
  true or false choice when omitted.
tags:
- Action Gateway
parameters:
- $ref: endpoint_parameters.yml#/endpoint_id
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/endpoints.yml#/endpoint_promotion
      examples:
        request:
          $ref: examples/endpoints.yml#/endpoint_promotion
responses:
  '201':
    description: The new head version was created.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/endpoints.yml#/endpoint_publish_response
        examples:
          response:
            $ref: examples/endpoints.yml#/promotion
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: endpoint_responses.yml#/version_creation_limited
  '500':
    $ref: ../../shared/responses/server_error.yml
  'default':
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/endpointVersions_create_promotion.yml
security:
- bearer_auth:
  - action_gateway:create
