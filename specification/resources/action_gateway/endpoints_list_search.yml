operationId: endpoints_list_search
summary: Search Endpoints
description: >-
  Returns the endpoints you can see whose name, endpoint ID, actor_id, or agent
  name contains query, case-insensitively. Results are ranked across the whole
  result set: exact matches first, then prefix matches, then substring matches,
  then by name. Each endpoint has the list shape, including its embedded
  head_version. Keyset pagination uses page_size and page_token; a page token is
  valid only with the same query and actor_id. There are no offsets or totals.
  Service-managed endpoints are never returned.
tags:
- Action Gateway
parameters:
- $ref: endpoint_parameters.yml#/search_query
- $ref: endpoint_parameters.yml#/search_actor_id
- $ref: endpoint_parameters.yml#/page_size
- $ref: endpoint_parameters.yml#/page_token
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/endpoints.yml#/endpoint_search_response
        examples:
          response:
            $ref: examples/endpoints.yml#/endpoint_search
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  'default':
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/endpoints_list_search.yml
security:
- bearer_auth:
  - action_gateway:read
