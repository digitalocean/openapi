operationId: providerCredentials_get
summary: Get a Provider Credential
description: >-
  Returns metadata for a provider credential, never its secret material. Returns
  404 if the credential is unknown, deleted, or not visible to you.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/provider_credential_id
responses:
  '200':
    $ref: responses/provider_credential.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    $ref: ../../shared/responses/forbidden.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/providerCredentials_get.yml
security:
- bearer_auth:
  - action_gateway:read
