operationId: gatewayApprovals_update
summary: Decide a Pending Approval by Session Header
description: >-
  Approves or denies a tool call that is waiting for approval, identifying the
  session with the `X-Session-Id` header. It behaves the same as
  `POST /approvals/session/{session_id}/{approval_id}`, which is the path
  returned in a result's `_meta.decide`.
tags:
- Action Gateway Data Plane
servers:
- url: https://actions.do-ai.run
  description: production
parameters:
- $ref: parameters.yml#/session_id_header
- $ref: parameters.yml#/approval_id
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/data_plane.yml#/approval_decision
      example:
        decision: deny
responses:
  '200':
    description: The decision was recorded.
    content:
      application/json:
        schema:
          $ref: models/data_plane.yml#/approval_decision_response
        example:
          id: 7d3c2b1a-9e8f-4a6b-8c5d-4e3f2a1b0c9d
          status: denied
          expires_at: '2026-10-09T18:30:00Z'
  '400':
    $ref: data_plane_responses.yml#/bad_request
  '401':
    $ref: data_plane_responses.yml#/unauthorized
  '403':
    $ref: data_plane_responses.yml#/forbidden
  '404':
    $ref: data_plane_responses.yml#/not_found
  '409':
    $ref: data_plane_responses.yml#/conflict
  '412':
    $ref: data_plane_responses.yml#/precondition_failed
  '429':
    $ref: data_plane_responses.yml#/too_many_requests
  '500':
    $ref: data_plane_responses.yml#/server_error
  '503':
    $ref: data_plane_responses.yml#/service_unavailable
x-codeSamples:
- $ref: examples/curl/gatewayApprovals_update.yml
security:
- bearer_auth:
  - action_gateway:execute
