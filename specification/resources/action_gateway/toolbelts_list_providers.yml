operationId: toolbelts_list_providers
summary: List the Providers in a Toolbelt
description: >-
  Returns the distinct providers of the toolbelt's members, each with its member count, sorted by provider
  ID. List one provider's members with `GET .../toolbelts/{name}/providers/{provider}/tools`.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/toolbelt_name
- $ref: parameters.yml#/toolbelt_version_toolbelts_providers
- $ref: parameters.yml#/page_connections
- $ref: parameters.yml#/per_page
- $ref: parameters.yml#/toolbelt_search_toolbelts_providers
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/toolbelts.yml#/list_toolbelt_providers_response
        example:
          toolbelt:
            name: search-toolbelt
            version: '1'
            display_name: Search Tools
            description: Tools for searching and fetching public web pages.
            tools:
            - exa_web_fetch@1
            - exa_web_search@1
            status: active
            reference: search-toolbelt@1
            reference_latest: search-toolbelt
            tool_count: 2
            created_at: '2026-06-11T12:00:00Z'
            updated_at: '2026-06-11T12:00:00Z'
          providers:
          - provider: exa
            tool_count: 2
            id: exa
            name: Exa
            description: Web search tools backed by Exa.
            categories:
            - web-fetch
            - web-search
            created_at: '2026-06-01T00:00:00Z'
          pagination:
            page: 1
            per_page: 20
            total: 1
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/toolbelts_list_providers.yml
security:
- bearer_auth:
  - action_gateway:read
