operationId: toolbelts_create
summary: Create a Toolbelt
description: >-
  A toolbelt is a named set of tools, each pinned to a version, that your team can attach to sessions
  as `toolbelt:<name>@<version>`. The first version is 1 unless version is set. Returns 409 if an active
  toolbelt with the same name exists. The name of a deleted toolbelt can be reused; its versions start
  again from the initial version.
tags:
- Action Gateway
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/toolbelts.yml#/toolbelt_create
      example:
        name: search-toolbelt
        display_name: Search Tools
        description: Tools for searching and fetching public web pages.
        tools:
        - exa_web_search
        - exa_web_fetch
responses:
  '200':
    description: The toolbelt was created.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/toolbelts.yml#/toolbelt_response
        example:
          toolbelt:
            name: search-toolbelt
            version: '1'
            display_name: Search Tools
            description: Tools for searching and fetching public web pages.
            tools:
            - exa_web_fetch@1
            - exa_web_search@1
            status: active
            reference: search-toolbelt@1
            reference_latest: search-toolbelt
            tool_count: 2
            created_at: '2026-06-11T12:00:00Z'
            updated_at: '2026-06-11T12:00:00Z'
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '409':
    $ref: ../../shared/responses/conflict.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/toolbelts_create.yml
security:
- bearer_auth:
  - action_gateway:create
