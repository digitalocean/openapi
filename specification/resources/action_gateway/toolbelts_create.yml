operationId: toolbelts_create
summary: Create a Toolbelt
description: Creates a versioned collection of provider-qualified Action Gateway tool names.
tags:
  - Action Gateway
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models.yml#/toolbelt_create'
responses:
  '200':
    description: A toolbelt was created successfully.
    headers:
      $ref: 'response_headers.yml'
    content:
      application/json:
        schema:
          $ref: 'models.yml#/toolbelt_response'
  '400':
    $ref: '../../shared/responses/bad_request.yml'
  '401':
    $ref: '../../shared/responses/unauthorized.yml'
  '409':
    $ref: '../../shared/responses/conflict.yml'
  '429':
    $ref: '../../shared/responses/too_many_requests.yml'
  '500':
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'
security:
  - bearer_auth: []
