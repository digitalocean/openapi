operationId: outputViews_get
summary: Retrieve an Output View
description: Retrieves a live public output view or one owned by your team.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/view_id
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/output_views.yml#/output_view_response
        example:
          view:
            view_id: ov_4f0c2a9d8e1b47c6a3d5f7e9b1c3a5d7
            tool_id: tul_exa_web_search
            tool: exa_web_search
            version: v1
            team_id: '123456'
            name: titles-and-urls
            description: Keep only result titles and URLs.
            kind: OUTPUT_VIEW_KIND_PROJECTION
            fields:
            - results.title
            - results.url
            transform: null
            output_schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      url:
                        type: string
            audit:
              createdAt: '2026-09-01T16:00:00Z'
              updatedAt: '2026-09-01T16:00:00Z'
              deletedAt: null
              createdBy: ''
              updatedBy: ''
            deleted_by: ''
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/outputViews_get.yml
security:
- bearer_auth:
  - action_gateway:read
