operationId: endpointVersions_get
summary: Retrieve an Endpoint Version
description: >-
  Returns the exact live version named by its composite public ID. An inaccessible
  or deleted version returns 404 endpoint_version_not_found. A bare session UUID
  is not a version ID.
tags:
- Action Gateway
parameters:
- $ref: endpoint_parameters.yml#/version_id
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/endpoints.yml#/endpoint_version_response
        examples:
          response:
            $ref: examples/endpoints.yml#/version
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  'default':
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/endpointVersions_get.yml
security:
- bearer_auth:
  - action_gateway:read
