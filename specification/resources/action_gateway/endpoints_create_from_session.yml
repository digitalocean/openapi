operationId: endpoints_create_from_session
summary: Convert a Session to an Endpoint
description: >-
  Makes a legacy session version 1 of a new endpoint. The session's owner or a
  team owner may convert it. The new endpoint takes the session's owner, actor,
  and Insights consent; version 1 keeps the session's policy, tools, config, and
  network, and carries no Insights consent of its own. The session's existing
  /mcp/session/ URL keeps working and stays pinned to version 1. Converting a
  session that is already converted returns its existing endpoint with 200. A
  service-managed session, another user's session when you are not a team owner,
  and an unknown ID all return 404 session_not_found. A session with
  no owner returns 400 session_owner_required. A duplicate name, or a default
  name that cannot be derived from the session, returns 409 endpoint_name_taken;
  provide a name to resolve it.
tags:
- Action Gateway
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/endpoints.yml#/endpoint_from_session
      examples:
        request:
          $ref: examples/endpoints.yml#/endpoint_from_session
responses:
  '200':
    description: The session was already converted. The response describes its existing endpoint.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/endpoints.yml#/endpoint_publish_response
        examples:
          response:
            $ref: examples/endpoints.yml#/converted_session
  '201':
    description: The session is now version 1 of a new endpoint.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/endpoints.yml#/endpoint_publish_response
        examples:
          response:
            $ref: examples/endpoints.yml#/converted_session
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    description: No convertible session you can see has this ID (session_not_found).
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: ../../shared/models/error.yml
        example:
          id: session_not_found
          message: The session was not found.
  '409':
    description: >-
      An endpoint with this name already exists in the team, or no name was sent
      and one cannot be derived from the session (endpoint_name_taken).
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: ../../shared/models/error.yml
        example:
          id: endpoint_name_taken
          message: An endpoint with this name already exists.
  '429':
    $ref: endpoint_responses.yml#/endpoint_creation_limited
  '500':
    $ref: ../../shared/responses/server_error.yml
  'default':
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/endpoints_create_from_session.yml
security:
- bearer_auth:
  - action_gateway:update
