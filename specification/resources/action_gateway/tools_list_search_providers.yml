operationId: tools_list_search_providers
summary: Search Providers
description: >-
  Returns the providers of `GET /v2/action-gateway/tools/providers` whose name, display name, or description
  contains query, case-insensitively, sorted by name. Cursor-paged with `page_size` and `page_token`;
  no total is reported.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/search_query_tools_providers_search
- $ref: parameters.yml#/page_size
- $ref: parameters.yml#/page_token_tools_providers_search
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/tools.yml#/search_providers_response
        example:
          providers:
          - name: jira
            display_name: Jira
            description: Jira issue tracking tools.
            auth_type: oauth
            scopes:
            - write:jira-work
            connection_parameters:
            - key: site_url
              label: Jira site URL
              description: The HTTPS origin of the Jira Cloud site to use.
              input_kind: https_origin
              required: true
              normalization: https_origin
              allowed_values: []
              allowed_host_suffixes:
              - atlassian.net
              max_length: 255
              pattern: ''
            auth_types:
            - oauth
            credential_parameters: []
            oauth_client_setup_url: https://developer.atlassian.com/console/myapps/
            oauth_redirect_url: https://cloud.digitalocean.com/api/v1/security/connectlinks/callback
          next_page_token: ''
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/tools_list_search_providers.yml
security:
- bearer_auth:
  - action_gateway:read
