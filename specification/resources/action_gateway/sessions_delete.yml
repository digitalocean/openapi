operationId: sessions_delete
summary: Delete an Action Gateway Session
description: Deletes an Action Gateway session owned by the authenticated team.
tags:
  - Action Gateway
parameters:
  - name: session_urn
    in: path
    required: true
    description: The URL-encoded managed agents session URN.
    schema:
      type: string
    example: do:managed_agents_session:123e4567-e89b-12d3-a456-426614174000
responses:
  "200":
    description: The session was deleted successfully.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models.yml#/delete_session_response
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
  - bearer_auth:
      - genai:delete
