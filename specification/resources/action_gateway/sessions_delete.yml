operationId: sessions_delete
deprecated: true
summary: Delete a Session
description: >-
  Deprecated: use DELETE /v2/action-gateway/endpoints/{endpoint_id} for endpoints.
  This route continues to accept legacy session URNs and delete legacy sessions.
  Deletes the session and its policy. Succeeds without deleting anything when the session does not exist
  or you cannot delete it, so repeating a delete also succeeds. A malformed `session_urn` is rejected
  with 400. When the session is a version of an endpoint, this deletes that version, and deleting
  the endpoint's last live version also deletes the endpoint. Deleting the last live version with
  DELETE /v2/action-gateway/endpoint-versions/{version_id} instead keeps the endpoint, with no live
  version.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/session_urn
responses:
  '200':
    description: The session was deleted.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/shared.yml#/empty_response
        example: {}
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/sessions_delete.yml
security:
- bearer_auth:
  - action_gateway:delete
