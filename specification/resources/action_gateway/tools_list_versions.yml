operationId: tools_list_versions
summary: List Tool Versions
description: >-
  Returns the released versions of one catalog tool, newest first, each with the changes from the version
  released before it. Every version listed can be pinned as `<tool_slug>@<version>` in an endpoint or
  toolbelt, and a pin keeps calling that version after newer versions are released. A tool named without a
  version always calls the latest release, marked `latest`.


  Changes are computed by comparing each version's input schema, output schema, and required OAuth scopes
  with the previous released version. `breaking` marks a change that can make a call that worked against
  the previous version fail; review those before moving a pin or relying on the latest release. Returns
  404 when `tool_slug` is not a catalog tool. Tools of your team's MCP servers are not listed.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/tool_slug
- $ref: parameters.yml#/page_size
- $ref: parameters.yml#/page_token
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/tools.yml#/list_tool_versions_response
        example:
          versions:
          - tool_slug: supabase_list_organizations
            version: v17
            released_at: '2026-11-12T09:30:00Z'
            latest: true
            previous_version: v16
            breaking: true
            changes:
            - type: requiredScopesAdded
              values:
              - organizations:read
              breaking: true
          - tool_slug: supabase_list_organizations
            version: v16
            released_at: '2026-10-20T14:05:00Z'
            latest: false
            previous_version: v15
            breaking: false
            changes:
            - type: inputPropertyAdded
              path: page.cursor
              breaking: false
          next_page_token: djE1
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/tools_list_versions.yml
security:
- bearer_auth:
  - action_gateway:read
