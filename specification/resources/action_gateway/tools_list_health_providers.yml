operationId: tools_list_health_providers
summary: List Provider Health
description: Lists availability and latency for each provider across all DigitalOcean customers. Uptime
  counts only provider failures (upstream errors, timeouts, rate limits, and unavailability); latency
  covers successful calls. A provider with `HEALTH_DATA_STATUS_NO_DATA` had no qualifying calls in the
  window.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/health_provider
- $ref: parameters.yml#/health_window
- $ref: ../../shared/parameters.yml#/page
- $ref: parameters.yml#/per_page
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/tools.yml#/list_provider_health_response
        example:
          snapshot:
            measured_at: '2026-09-24T12:00:00Z'
            window: 86400s
            stale: false
          providers:
          - provider: exa
            health:
              data_status: HEALTH_DATA_STATUS_AVAILABLE
              uptime_percentage: 99.82
              latency_p50_ms: 412.5
              latency_p95_ms: 1180.0
          pagination:
            page: 1
            per_page: 20
            total: 1
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/tools_list_health_providers.yml
security:
- bearer_auth:
  - action_gateway:read
