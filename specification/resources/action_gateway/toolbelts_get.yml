operationId: toolbelts_get
summary: Retrieve a Toolbelt
description: Retrieves the latest active version or a specified immutable version of a toolbelt.
tags:
  - Action Gateway
parameters:
  - $ref: 'parameters.yml#/toolbelt_name'
  - $ref: 'parameters.yml#/toolbelt_version'
responses:
  '200':
    description: The toolbelt was retrieved successfully.
    headers:
      $ref: 'response_headers.yml'
    content:
      application/json:
        schema:
          $ref: 'models.yml#/toolbelt_response'
        examples:
          toolbelt_response:
            $ref: 'examples.yml#/toolbelt_response'
  '401':
    $ref: '../../shared/responses/unauthorized.yml'
  '404':
    $ref: '../../shared/responses/not_found.yml'
  '429':
    $ref: '../../shared/responses/too_many_requests.yml'
  '500':
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'
security:
  - bearer_auth:
      - genai:read
