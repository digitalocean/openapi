operationId: outputViews_validate
summary: Preview an Output View
description: >-
  Validates a projection exactly as create does and returns the view it would produce, including `output_schema`,
  without storing anything. name and description are optional here; name uniqueness and the per-tool-version
  limit are not checked.
tags:
- Action Gateway
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/output_views.yml#/output_view_preview
      example:
        tool: exa_web_search
        fields:
        - results.title
        - results.url
responses:
  '200':
    description: The output view is valid.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/output_views.yml#/output_view_response
        example:
          view:
            view_id: ''
            tool_id: tul_exa_web_search
            tool: exa_web_search
            version: v1
            team_id: '123456'
            name: titles-and-urls
            description: Keep only result titles and URLs.
            kind: OUTPUT_VIEW_KIND_PROJECTION
            fields:
            - results.title
            - results.url
            output_schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      url:
                        type: string
            audit: null
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/outputViews_validate.yml
security:
- bearer_auth:
  - action_gateway:create
