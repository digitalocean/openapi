operationId: actorLimits_delete
summary: Clear End User Limits
description: Removes rate-limit overrides for one end user so your team's limits apply again.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/actor_id
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/actor_limits.yml#/clear_actor_limits
      example:
        categories:
        - LIMIT_CATEGORY_WEB_SEARCH_REQUESTS_PER_MINUTE
responses:
  '200':
    description: The overrides were removed.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/shared.yml#/empty_response
        example: {}
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/actorLimits_delete.yml
security:
- bearer_auth:
  - action_gateway:create
