operationId: connections_list
summary: List Connections
description: Lists OAuth connections owned by the authenticated team.
tags:
  - Action Gateway
parameters:
  - name: provider
    in: query
    description: Filter by provider name.
    schema:
      type: string
    example: github
  - name: user_id
    in: query
    description: Filter by end-user identifier.
    schema:
      type: string
    example: end-user-123
  - name: status
    in: query
    description: Filter by connection status.
    schema:
      type: string
    example: active
  - name: sort
    in: query
    description: Field used to sort results.
    schema:
      type: string
    example: created_at
  - name: sort_direction
    in: query
    description: Sort direction.
    schema:
      type: string
    example: desc
  - $ref: ../../shared/parameters.yml#/page
  - $ref: ../../shared/parameters.yml#/per_page
responses:
  "200":
    description: Connections were retrieved successfully.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models.yml#/list_connections_response
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
  - bearer_auth:
      - genai:read
