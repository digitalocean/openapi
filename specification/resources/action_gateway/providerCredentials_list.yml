operationId: providerCredentials_list
summary: List Provider Credentials
description: >-
  Lists registered credentials visible to you, ordered by provider and display
  name. Optionally filter by provider slug, ignoring case. An unknown provider
  returns an empty list. Results are not paginated and exclude DigitalOcean-owned
  OAuth applications and credentials managed by MCP server registrations.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/provider_credential_provider
responses:
  '200':
    description: The request was successful. Secret material is not returned.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/provider_credentials.yml#/provider_credentials_list_response
        example:
          credentials:
          - id: example-credential-id
            provider: example-provider
            display_name: Production key
            kind: PROVIDER_CREDENTIAL_KIND_API_KEY
            status: PROVIDER_CREDENTIAL_STATUS_ACTIVE
            base_url: ''
            created_at: '2026-11-01T12:00:00Z'
            updated_at: '2026-11-01T12:00:00Z'
            owning_user_id: example-digitalocean-user-id
            reusable_by_team: false
            scope: user
            redirect_url: ''
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    $ref: ../../shared/responses/forbidden.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/providerCredentials_list.yml
security:
- bearer_auth:
  - action_gateway:read
