operationId: endpoints_patch
summary: Update an Endpoint
description: >-
  Renames an endpoint, changes its Insights consent, or both, without changing
  its owner, actor, or versions. Send name, insights, or both. Insights merges
  per signal: a metrics, logs, or traces value of true or false replaces that
  signal, and an omitted signal keeps its stored value. The consent applies to
  every version, including pinned and older versions. A body with no name and
  no insights signal returns 400 endpoint_update_empty. Only the endpoint owner
  may update it. An invalid name returns 400 invalid_endpoint_name; a duplicate
  team name returns 409 endpoint_name_taken. Inaccessible endpoints return 404
  endpoint_not_found.
tags:
- Action Gateway
parameters:
- $ref: endpoint_parameters.yml#/endpoint_id
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/endpoints.yml#/endpoint_patch
      examples:
        request:
          $ref: examples/endpoints.yml#/endpoint_patch
        logs_disabled:
          $ref: examples/endpoints.yml#/logs_disabled
        traces_enabled:
          $ref: examples/endpoints.yml#/traces_enabled
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/endpoints.yml#/endpoint_response
        examples:
          response:
            $ref: examples/endpoints.yml#/endpoint
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    $ref: endpoint_responses.yml#/endpoint_name_taken
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  'default':
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/endpoints_patch.yml
security:
- bearer_auth:
  - action_gateway:update
