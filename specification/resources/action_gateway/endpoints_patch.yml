operationId: endpoints_patch
summary: Rename an Endpoint
description: >-
  Renames an endpoint without changing its owner, actor, or versions. Only the
  endpoint owner may rename it. An invalid name returns 400 invalid_endpoint_name;
  a duplicate team name returns 409 endpoint_name_taken. Inaccessible endpoints
  return 404 endpoint_not_found.
tags:
- Action Gateway
parameters:
- $ref: endpoint_parameters.yml#/endpoint_id
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/endpoints.yml#/endpoint_patch
      examples:
        request:
          $ref: examples/endpoints.yml#/endpoint_patch
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/endpoints.yml#/endpoint_response
        examples:
          response:
            $ref: examples/endpoints.yml#/endpoint
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  'default':
    $ref: ../../shared/responses/unexpected_error.yml
  '409':
    description: An endpoint with this name already exists in the team (endpoint_name_taken).
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: ../../shared/models/error.yml
        example:
          id: endpoint_name_taken
          message: An endpoint with this name already exists.
x-codeSamples:
- $ref: examples/curl/endpoints_patch.yml
security:
- bearer_auth:
  - action_gateway:update
