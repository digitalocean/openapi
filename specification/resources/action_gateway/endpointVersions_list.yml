operationId: endpointVersions_list
summary: List Endpoint Versions
description: >-
  Lists live versions of an accessible endpoint by version_number descending,
  using keyset pagination without offsets or totals. The cursor is bound to this
  parent endpoint as well as the caller and team. Inaccessible endpoints return
  404 endpoint_not_found.
tags:
- Action Gateway
parameters:
- $ref: endpoint_parameters.yml#/endpoint_id
- $ref: endpoint_parameters.yml#/page_size
- $ref: endpoint_parameters.yml#/page_token
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/endpoints.yml#/endpoint_versions_response
        examples:
          response:
            $ref: examples/endpoints.yml#/versions
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  'default':
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/endpointVersions_list.yml
security:
- bearer_auth:
  - action_gateway:read
