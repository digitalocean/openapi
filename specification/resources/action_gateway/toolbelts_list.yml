operationId: toolbelts_list
summary: List Toolbelts
description: Lists the latest version of each toolbelt owned by the authenticated team.
tags:
  - Action Gateway
parameters:
  - $ref: 'parameters.yml#/toolbelt_status'
  - $ref: '../../shared/parameters.yml#/page'
  - $ref: '../../shared/parameters.yml#/per_page'
responses:
  '200':
    description: Toolbelts were retrieved successfully.
    headers:
      $ref: 'response_headers.yml'
    content:
      application/json:
        schema:
          $ref: 'models.yml#/toolbelts_response'
  '401':
    $ref: '../../shared/responses/unauthorized.yml'
  '429':
    $ref: '../../shared/responses/too_many_requests.yml'
  '500':
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'
security:
  - bearer_auth:
      - genai:read
