operationId: toolbelts_list
summary: List Toolbelts
description: Lists your team's toolbelts.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/toolbelt_status
- $ref: ../../shared/parameters.yml#/page
- $ref: parameters.yml#/per_page
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/toolbelts.yml#/toolbelts_response
        example:
          toolbelts:
          - name: search-toolbelt
            display_name: Search Tools
            latest_version: '1'
            version_count: 1
            tool_count: 2
            status: active
            reference_latest: search-toolbelt
            updated_at: '2026-06-11T12:00:00Z'
            description: Tools for searching and fetching public web pages.
          pagination:
            page: 1
            per_page: 20
            total: 1
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/toolbelts_list.yml
security:
- bearer_auth:
  - action_gateway:read
