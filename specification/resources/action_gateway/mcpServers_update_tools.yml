operationId: mcpServers_update_tools
summary: Set Which of an MCP Server's Tools Are Enabled
description: |-
  `enabledToolSlugs` is the complete set to enable; every other tool of the server is disabled. An
  enabled tool is added to your team's catalog at its latest discovered version, and a disabled one is
  removed from it. Repeating the same set changes nothing.

  Before changing anything, each tool being enabled, re-enabled, or moved to a newer discovered
  version is verified against the live server: it must still be listed there, with the same input
  schema as when it was discovered. If any check fails or the server cannot be reached, the request
  fails with 400 and nothing changes; resync and try again. An unknown tool slug is also rejected with
  400. A request that needs verification counts against the resync rate limit (429). Returns the
  server's full tool list.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/server_ref
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/mcp_servers.yml#/mcp_server_tools_update
      example:
        enabledToolSlugs:
        - docs_get_page
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/mcp_servers.yml#/list_mcp_server_tools_response
        example:
          tools:
          - name: get_page
            toolSlug: docs_get_page
            description: Fetch one documentation page.
            enabled: true
            quarantined: false
            quarantineReason: ''
          - name: search
            toolSlug: docs_search
            description: Search the documentation index.
            enabled: false
            quarantined: false
            quarantineReason: ''
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/mcpServers_update_tools.yml
security:
- bearer_auth:
  - action_gateway:update
