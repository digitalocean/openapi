operationId: tools_get_definition
summary: Retrieve a Tool Definition
description: Retrieves the executable definition for an active Action Gateway tool.
tags:
  - Action Gateway
parameters:
  - name: name
    in: path
    required: true
    description: The provider-qualified tool name.
    schema:
      type: string
    example: exa_web_search
  - name: version
    in: query
    description: The tool version. Omit to retrieve the current version.
    schema:
      type: string
    example: v1
  - name: toolkit_id
    in: query
    description: The toolkit identifier used to disambiguate a bare tool name.
    schema:
      type: string
    example: exa
responses:
  "200":
    description: The tool definition was retrieved successfully.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models.yml#/tool_definition
        examples:
          tools_get_definition_response:
            $ref: examples.yml#/tools_get_definition_response
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "404":
    $ref: ../../shared/responses/not_found.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
  - bearer_auth:
      - genai:read
