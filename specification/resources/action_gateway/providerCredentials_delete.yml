operationId: providerCredentials_delete
summary: Delete a Provider Credential
description: |-
  Deletes a provider credential and every connection that uses it. There is no
  confirmation step. Warn affected users before deleting; sessions relying on
  those connections lose provider access. To rotate a key without removing
  connections, update the credential instead.

  Returns the deleted credential with status `PROVIDER_CREDENTIAL_STATUS_DELETED`
  and the number of removed connections in `revoked_connections`. Returns 404 for
  an unknown or already-deleted credential. A credential still bound to an MCP
  server cannot be deleted separately; delete the server first.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/provider_credential_id
responses:
  '200':
    description: The credential and its connections were deleted.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/provider_credentials.yml#/provider_credential_response
        example:
          credential:
            id: example-credential-id
            provider: example-provider
            display_name: Production key
            kind: PROVIDER_CREDENTIAL_KIND_API_KEY
            status: PROVIDER_CREDENTIAL_STATUS_DELETED
            created_at: '2026-11-01T12:00:00Z'
            updated_at: '2026-11-01T13:00:00Z'
            owning_user_id: example-digitalocean-user-id
            reusable_by_team: false
            scope: user
          revoked_connections: 1
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '403':
    $ref: ../../shared/responses/forbidden.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/providerCredentials_delete.yml
security:
- bearer_auth:
  - action_gateway:delete
