operationId: users_list
summary: List Users
description: >-
  Returns the user IDs known for your team: session `actor_id` values, the `user_id` of connections that
  are not revoked, and actors with limit overrides. Only sessions and connections you can see count. Offset-paged
  with page and `per_page`.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/users_user_id
- $ref: parameters.yml#/users_sort
- $ref: parameters.yml#/sort_direction_users
- $ref: parameters.yml#/page_connections
- $ref: parameters.yml#/per_page
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/users.yml#/list_users_response
        example:
          user_ids:
          - alice
          - bob
          pagination:
            page: 1
            per_page: 20
            total: 2
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/users_list.yml
security:
- bearer_auth:
  - action_gateway:read
