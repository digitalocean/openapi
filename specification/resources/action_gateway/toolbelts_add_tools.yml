operationId: toolbelts_add_tools
summary: Add Tools to a Toolbelt
description: Adds provider-qualified tool names and creates a new immutable toolbelt version.
tags:
  - Action Gateway
parameters:
  - $ref: 'parameters.yml#/toolbelt_name'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: 'models.yml#/toolbelt_tools'
responses:
  '200':
    description: The resulting toolbelt version.
    headers:
      $ref: 'response_headers.yml'
    content:
      application/json:
        schema:
          $ref: 'models.yml#/toolbelt_response'
  '400':
    $ref: '../../shared/responses/bad_request.yml'
  '401':
    $ref: '../../shared/responses/unauthorized.yml'
  '404':
    $ref: '../../shared/responses/not_found.yml'
  '429':
    $ref: '../../shared/responses/too_many_requests.yml'
  '500':
    $ref: '../../shared/responses/server_error.yml'
  default:
    $ref: '../../shared/responses/unexpected_error.yml'
security:
  - bearer_auth: []
