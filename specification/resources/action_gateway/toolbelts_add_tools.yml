operationId: toolbelts_add_tools
summary: Add Tools to a Toolbelt
description: Adds tools to the latest version of a toolbelt. A membership change creates a new immutable
  version; if every tool is already a member, the current version is returned unchanged.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/toolbelt_name
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/toolbelts.yml#/toolbelt_tools
      example:
        tools:
        - jira_create_issue
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/toolbelts.yml#/toolbelt_response
        example:
          toolbelt:
            name: search-toolbelt
            version: '2'
            display_name: Search Tools
            description: Tools for searching and fetching public web pages.
            tools:
            - exa_web_fetch@1
            - exa_web_search@1
            - jira_create_issue@1
            status: active
            reference: search-toolbelt@2
            reference_latest: search-toolbelt
            tool_count: 3
            created_at: '2026-06-11T12:00:00Z'
            updated_at: '2026-06-12T09:30:00Z'
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/toolbelts_add_tools.yml
security:
- bearer_auth:
  - action_gateway:update
