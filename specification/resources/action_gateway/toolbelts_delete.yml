operationId: toolbelts_delete
summary: Delete a Toolbelt
description: Deprecates the latest active version of a toolbelt. Pinned references to its versions keep
  resolving, and the name can be reused.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/toolbelt_name
responses:
  '200':
    description: The toolbelt was deprecated.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/toolbelts.yml#/toolbelt_response
        example:
          toolbelt:
            name: search-toolbelt
            version: '1'
            display_name: Search Tools
            description: Tools for searching and fetching public web pages.
            tools:
            - exa_web_fetch@1
            - exa_web_search@1
            status: deprecated
            reference: search-toolbelt@1
            reference_latest: search-toolbelt
            tool_count: 2
            created_at: '2026-06-11T12:00:00Z'
            updated_at: '2026-06-15T10:00:00Z'
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/toolbelts_delete.yml
security:
- bearer_auth:
  - action_gateway:delete
