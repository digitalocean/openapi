operationId: outputViews_create
summary: Create an Output View
description: 'Creates a team output view: a projection of one tool version''s canonical output that keeps
  only the listed fields. The response includes the materialized `output_schema`. Bind the view to a tool
  in a session with `config.outputViews`. A team can hold at most 20 live views per tool version.'
tags:
- Action Gateway
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/output_views.yml#/output_view_create
      example:
        tool: exa_web_search
        name: titles-and-urls
        description: Keep only result titles and URLs.
        fields:
        - results.title
        - results.url
responses:
  '200':
    description: The output view was created.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/output_views.yml#/output_view_response
        example:
          view:
            view_id: ov_4f0c2a9d8e1b47c6a3d5f7e9b1c3a5d7
            tool_id: tul_exa_web_search
            tool: exa_web_search
            version: v1
            team_id: '123456'
            name: titles-and-urls
            description: Keep only result titles and URLs.
            kind: OUTPUT_VIEW_KIND_PROJECTION
            fields:
            - results.title
            - results.url
            transform: null
            output_schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      url:
                        type: string
            audit:
              createdAt: '2026-09-01T16:00:00Z'
              updatedAt: '2026-09-01T16:00:00Z'
              deletedAt: null
              createdBy: ''
              updatedBy: ''
            deleted_by: ''
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '409':
    $ref: ../../shared/responses/conflict.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/outputViews_create.yml
security:
- bearer_auth:
  - action_gateway:create
