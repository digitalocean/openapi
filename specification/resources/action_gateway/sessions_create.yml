operationId: sessions_create
summary: Create an Action Gateway Session
description: Creates a session with a tool selection, invocation policy, and
  optional direct-tool preload configuration.
tags:
  - Action Gateway
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models.yml#/create_session_request
      examples:
        sessions_create_request:
          $ref: examples.yml#/sessions_create_request
responses:
  "200":
    description: The session was created successfully.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models.yml#/create_session_response
        examples:
          sessions_create_response:
            $ref: examples.yml#/sessions_create_response
  "400":
    $ref: ../../shared/responses/bad_request.yml
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
  - bearer_auth:
      - genai:create
x-codeSamples:
  - $ref: examples/curl/sessions_create.yml
