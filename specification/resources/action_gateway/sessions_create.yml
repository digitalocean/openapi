operationId: sessions_create
summary: Create a Session
description: Creates an Action Gateway session and returns its MCP URL. The session's `tools` select which
  tools are available, `policy` decides whether each call is allowed, needs approval, or is denied, and
  `actorId` binds the session to one end user so their connections are used. Your team must have a valid
  prepayment state.
tags:
- Action Gateway
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/sessions.yml#/session_create
      example:
        name: support-bot-alice
        actorId: alice
        tools:
        - toolbelt:search-toolbelt@1
        - jira_create_issue
        policy: &id001
          defaultAction: ask
          rules:
          - tool: toolbelt:search-toolbelt@1
            match: {}
            action: allow
          - tool: jira_create_issue
            match: {}
            action: ask
        config:
          preloadTools:
          - exa_web_search
          outputViews:
            exa_web_search: titles-and-urls
responses:
  '200':
    description: The session was created.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/sessions.yml#/create_session_response
        example:
          session:
            sessionUrn: do:managed_agent_session:2b3c9f0e-1a4d-4e5f-8a7b-6c5d4e3f2a1b
            policy: *id001
            createdAt: '2026-09-24T12:00:00Z'
            updatedAt: '2026-09-24T12:00:00Z'
            name: support-bot-alice
            actorId: alice
            tools:
              references:
              - kind: SESSION_TOOL_REFERENCE_KIND_TOOLBELT
                name: search-toolbelt
                version: '1'
              - kind: SESSION_TOOL_REFERENCE_KIND_TOOL
                name: jira_create_issue
                version: '1'
            config:
              preloadTools:
              - exa_web_search
              outputViews:
                exa_web_search: titles-and-urls
            agentUrn: ''
            agentName: ''
            owning_user_id: 2f8e1c3a-6b4d-4f7e-9a1c-5d3b7e9f1a2c
            owning_user_numeric_id: '1234567'
          mcpUrl: https://actions.do-ai.run/mcp/session/2b3c9f0e-1a4d-4e5f-8a7b-6c5d4e3f2a1b
          tools:
          - toolbelt:search-toolbelt@1
          - jira_create_issue@1
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/sessions_create.yml
security:
- bearer_auth:
  - action_gateway:create
