lang: Curl
source: |-
  curl --request POST \
    --header "Content-Type: application/json" \
    --header "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
    --data '{"provider":"<provider-slug>","display_name":"Production key","kind":"PROVIDER_CREDENTIAL_KIND_API_KEY","api_key":"<provider-api-key>"}' \
    "https://api.digitalocean.com/v2/action-gateway/provider-credentials"
