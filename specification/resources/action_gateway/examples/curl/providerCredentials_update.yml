lang: Curl
source: |-
  curl --request PATCH \
    --header "Content-Type: application/json" \
    --header "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
    --data '{"api_key":"<replacement-provider-api-key>"}' \
    "https://api.digitalocean.com/v2/action-gateway/provider-credentials/<credential-id>"
