endpoint_create:
  summary: Create an endpoint with a selected tool
  value:
    name: support-agent
    version:
      actor_id: alice
      tools: [exa_web_search@1]
      policy: &policy
        defaultAction: ask
        rules:
        - tool: exa_web_search@1
          match: {}
          action: allow
      config: &config
        preloadTools: [exa_web_search]
        outputViews:
          exa_web_search: titles-and-urls
        customInstructions: Prefer primary sources and cite URLs.
      network:
        vpcUuid: 5a4981aa-9653-4bd1-bef5-d6bff52042e4
    insights:
      logs: true
      traces: false

endpoint_patch:
  summary: Rename an endpoint
  value:
    name: support-agent

endpoint_version_spec:
  summary: Publish a version with no tools and explicitly empty policy and config
  value:
    actor_id: alice
    tools: []
    policy: {}
    config: {}

logs_disabled:
  summary: Disable logs while preserving the existing traces choice
  value:
    insights:
      logs: false

traces_enabled:
  summary: Enable traces while preserving the existing logs choice
  value:
    insights:
      traces: true

endpoint_promotion:
  summary: Copy a live version into a new head
  value:
    version_id: 1b4d4e0f-9a7c-4d5b-8f3c-2a6e6e8f0a13.v1

version:
  summary: Immutable version with a selected tool
  value:
    version: &version
      id: 1b4d4e0f-9a7c-4d5b-8f3c-2a6e6e8f0a13.v1
      endpoint_id: 1b4d4e0f-9a7c-4d5b-8f3c-2a6e6e8f0a13
      version_number: 1
      name: support-agent
      actor_id: alice
      tools:
        references:
        - kind: SESSION_TOOL_REFERENCE_KIND_TOOL
          name: exa_web_search
          version: '1'
      policy: *policy
      config: *config
      network: &network_response
        vpcUuid: 5a4981aa-9653-4bd1-bef5-d6bff52042e4
        region: nyc3
      mcp_url: https://nyc3.actions.do-ai.run/mcp/endpoint/1b4d4e0f-9a7c-4d5b-8f3c-2a6e6e8f0a13/version/9a7c2d5b-6e8f-4a13-8f3c-2a6e1b4d4e0f
