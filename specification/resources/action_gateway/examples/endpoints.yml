endpoint_create:
  summary: Create an endpoint with a selected tool
  value:
    name: support-agent
    version:
      actor_id: alice
      tools: [exa_web_search@1]
      policy: &policy
        default_action: ask
        rules:
        - tool: exa_web_search@1
          match: {}
          action: allow
      config: &config
        preload_tools: [exa_web_search]
        output_views:
          exa_web_search: titles-and-urls
        custom_instructions: Prefer primary sources and cite URLs.
      network:
        vpc_uuid: 5a4981aa-9653-4bd1-bef5-d6bff52042e4
    insights: &insights
      logs: true
      traces: false

endpoint_patch:
  summary: Rename an endpoint
  value:
    name: support-agent

endpoint_version_spec:
  summary: Publish a version with no tools and explicitly empty policy and config
  value:
    actor_id: alice
    tools: []
    policy: {}
    config: {}

logs_disabled:
  summary: Disable logs while preserving the existing traces choice
  value:
    insights:
      logs: false

traces_enabled:
  summary: Enable traces while preserving the existing logs choice
  value:
    insights:
      traces: true

endpoint_promotion:
  summary: Copy a live version into a new head
  value:
