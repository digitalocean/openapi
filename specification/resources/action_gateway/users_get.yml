operationId: users_get
summary: Retrieve a User
description: Retrieves one end user's sessions and non-revoked connections.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/user_id
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/users.yml#/get_user_response
        example:
          user:
            user_id: alice
            sessions:
            - session_urn: do:managed_agent_session:2b3c9f0e-1a4d-4e5f-8a7b-6c5d4e3f2a1b
              name: support-bot-alice
              created_at: '2026-09-24T12:00:00Z'
              updated_at: '2026-09-24T12:00:00Z'
            connections:
            - id: 39f9f768-a7f9-4c91-9557-3328c53dd054
              provider: jira
              user_id: alice
              scopes:
              - write:jira-work
              status: active
              granted_at: '2026-07-14T00:52:10Z'
              revoked_at: null
              created_at: '2026-07-14T00:50:00Z'
              updated_at: '2026-07-14T00:52:10Z'
              provider_display_name: Jira
              connection_parameters:
                site_url: https://example.atlassian.net
              credential_kind: digitalocean_oauth
              credential_id: ''
              network: null
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/users_get.yml
security:
- bearer_auth:
  - action_gateway:read
