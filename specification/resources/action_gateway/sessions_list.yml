operationId: sessions_list
summary: List Action Gateway Sessions
description: Lists Action Gateway sessions owned by the authenticated team.
tags:
  - Action Gateway
parameters:
  - name: end_user_id
    in: query
    description: Filter sessions by actor identifier.
    schema:
      type: string
    example: end-user-123
  - $ref: ../../shared/parameters.yml#/page
  - $ref: ../../shared/parameters.yml#/per_page
responses:
  "200":
    description: Sessions were retrieved successfully.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models.yml#/list_sessions_response
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
  - bearer_auth:
      - genai:read
