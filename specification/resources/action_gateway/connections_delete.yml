operationId: connections_delete
summary: Delete a Connection
description: Revokes a connection and deletes its stored credential. Reconnecting the same user requires
  a new authorization.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/connection_id
responses:
  '200':
    description: The connection was revoked.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/connections.yml#/delete_connection_response
        example:
          connection:
            id: 39f9f768-a7f9-4c91-9557-3328c53dd054
            provider: jira
            provider_display_name: Jira
            user_id: alice
            status: revoked
            created_at: '2026-07-14T00:50:00Z'
            updated_at: '2026-08-01T09:00:00Z'
            revoked_at: '2026-08-01T09:00:00Z'
            connection_parameters:
              site_url: https://example.atlassian.net
            credential_kind: digitalocean_oauth
            credential_id: ''
            network: null
            scopes:
            - write:jira-work
            granted_at: '2026-07-14T00:52:10Z'
            oauth:
              scopes:
              - write:jira-work
              granted_at: '2026-07-14T00:52:10Z'
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/connections_delete.yml
security:
- bearer_auth:
  - action_gateway:delete
