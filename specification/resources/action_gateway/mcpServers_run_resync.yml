operationId: mcpServers_run_resync
summary: Discover an MCP Server's Tools
description: |-
  Connects to the server, lists its tools, and records them. Discovered tools are not callable until
  you enable them.

  When discovery finishes in time, returns 200 with the server and its tools; a discovery failure is
  reported in `syncStatus` and `syncError` rather than as an error. Otherwise returns 202 with pending
  set while discovery continues: poll `GET .../mcp-servers/{server_ref}` until `lastSyncedAt` or
  `syncError` changes (`syncStatus` is not reset while discovery runs).

  For a server registered with `credentialRefSource` connection, `user_id` is required; if that user
  has not authorized the server yet, the response carries authorization with the URL to send them to.
  Resyncs are rate limited per team, and a team can run only a few discoveries at once; either limit
  returns 429.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/server_ref
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/mcp_servers.yml#/mcp_server_resync
      example: {}
responses:
  '200':
    description: Discovery finished.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/mcp_servers.yml#/resync_mcp_server_response
        example:
          mcpServer:
            serverRef: docs
            endpoint: https://mcp.example.com/mcp
            transport: streamable_http
            credentialRefSource: secret
            credentialRef: action-infra/tool-credentials/mcp/docs/3f5b2c1e-9a7d-4e8b-b6c4-2d1f0e9a8b7c
            syncStatus: ok
            syncError: ''
            lastSyncedAt: '2026-09-20T15:04:05Z'
            protocolVersion: '2025-06-18'
            toolCount: 2
            createdAt: '2026-09-20T15:00:00Z'
            updatedAt: '2026-09-20T15:04:05Z'
            description: Internal documentation search.
            oauth_authorize_url: ''
            oauth_scopes: &id001 []
            oauth_authorization_ttl_seconds: '0'
          tools:
          - name: get_page
            toolSlug: docs_get_page
            description: Fetch one documentation page.
            enabled: false
            quarantined: false
            quarantineReason: ''
          - name: search
            toolSlug: docs_search
            description: Search the documentation index.
            enabled: false
            quarantined: false
            quarantineReason: ''
          pending: false
          authorization: null
  '202':
    description: Discovery is still running. Poll the MCP server for its `syncStatus`.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/mcp_servers.yml#/resync_mcp_server_response
        example:
          mcpServer:
            serverRef: docs
            endpoint: https://mcp.example.com/mcp
            transport: streamable_http
            credentialRefSource: secret
            credentialRef: action-infra/tool-credentials/mcp/docs/3f5b2c1e-9a7d-4e8b-b6c4-2d1f0e9a8b7c
            syncStatus: pending
            syncError: ''
            lastSyncedAt: '2026-09-20T15:04:05Z'
            protocolVersion: '2025-06-18'
            toolCount: 2
            createdAt: '2026-09-20T15:00:00Z'
            updatedAt: '2026-09-20T15:04:05Z'
            description: Internal documentation search.
            oauth_authorize_url: ''
            oauth_scopes: *id001
            oauth_authorization_ttl_seconds: '0'
          tools: []
          pending: true
          authorization: null
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/mcpServers_run_resync.yml
security:
- bearer_auth:
  - action_gateway:update
