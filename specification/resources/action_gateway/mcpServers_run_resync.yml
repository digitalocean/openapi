operationId: mcpServers_run_resync
summary: Discover MCP Server Tools
description: 'Connects to the MCP server and ingests its tool list. Returns 200 with the discovered tools
  when discovery finishes in time, or 202 with `pending: true` for a slow server; poll the MCP server
  until `syncStatus` changes. Discovered tools are not usable until enabled. For servers that use per-user
  connections, set `user_id`; if that user has not authorized the server yet, `authorization` describes
  how to connect.'
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/server_ref
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/mcp_servers.yml#/mcp_server_resync
      example: {}
responses:
  '200':
    description: Discovery finished.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/mcp_servers.yml#/resync_mcp_server_response
        example:
          mcpServer:
            serverRef: docs
            endpoint: https://mcp.example.com/mcp
            transport: streamable_http
            credentialRefSource: secret
            credentialRef: action-infra/tool-credentials/mcp/docs/3f5b2c1e-9a7d-4e8b-b6c4-2d1f0e9a8b7c
            syncStatus: ok
            syncError: ''
            lastSyncedAt: '2026-09-20T15:04:05Z'
            protocolVersion: '2025-06-18'
            toolCount: 2
            createdAt: '2026-09-20T15:00:00Z'
            updatedAt: '2026-09-20T15:04:05Z'
            description: Internal documentation search.
            oauth_authorize_url: ''
            oauth_scopes: &id001 []
            oauth_authorization_ttl_seconds: '0'
          tools:
          - name: get_page
            toolSlug: docs_get_page
            description: Fetch one documentation page.
            enabled: false
            quarantined: false
            quarantineReason: ''
            catalogSlug: t123456--docs_get_page
          - name: search
            toolSlug: docs_search
            description: Search the documentation index.
            enabled: false
            quarantined: false
            quarantineReason: ''
            catalogSlug: t123456--docs_search
          pending: false
          authorization: null
  '202':
    description: Discovery is still running. Poll the MCP server for its `syncStatus`.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/mcp_servers.yml#/resync_mcp_server_response
        example:
          mcpServer:
            serverRef: docs
            endpoint: https://mcp.example.com/mcp
            transport: streamable_http
            credentialRefSource: secret
            credentialRef: action-infra/tool-credentials/mcp/docs/3f5b2c1e-9a7d-4e8b-b6c4-2d1f0e9a8b7c
            syncStatus: pending
            syncError: ''
            lastSyncedAt: '2026-09-20T15:04:05Z'
            protocolVersion: '2025-06-18'
            toolCount: 2
            createdAt: '2026-09-20T15:00:00Z'
            updatedAt: '2026-09-20T15:04:05Z'
            description: Internal documentation search.
            oauth_authorize_url: ''
            oauth_scopes: *id001
            oauth_authorization_ttl_seconds: '0'
          tools: []
          pending: true
          authorization: null
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/mcpServers_run_resync.yml
security:
- bearer_auth:
  - action_gateway:update
