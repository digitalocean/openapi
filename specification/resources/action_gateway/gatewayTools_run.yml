operationId: gatewayTools_run
summary: Invoke Session Tools
description: >-
  Runs 1 to 10 tool calls in parallel and returns one result per call, in
  request order. This is the REST form of the `action_invoke` MCP tool.


  Each call is checked against the session's tool selection and policy, uses
  the session actor's connections, and applies any output view bound to the
  tool in the session. A well-formed request returns `200` even when some calls
  fail. Check each item's `result.status`, and use `success_count` and
  `error_count` to branch without scanning every item.


  A call whose policy requires approval fails with `_meta.status` set to
  `requires_approval`. Have the session's owner approve it, then repeat the
  call with the same arguments. A call that needs the end user to connect a
  provider fails with `_meta.status` set to `requires_authorization` or
  `requires_connection_configuration`.


  Tools opted into result caching use the session's settings automatically.
  Set cache on an individual tools entry to bypass caching or require a
  fresher result. The result's _meta.cache reports cache hits. Hits still
  incur the standard gateway invocation charge but no additional provider
  charge, because the provider is not called.
tags:
- Action Gateway Data Plane
servers:
- url: https://actions.do-ai.run
  description: production
parameters:
- $ref: parameters.yml#/session_id_header
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/data_plane.yml#/invoke_tools_request
      example:
        rationale: Find current information about DigitalOcean.
        tools:
        - tool: exa_web_search
          arguments:
            query: DigitalOcean cloud computing
            max_results: 1
responses:
  '200':
    description: >-
      The calls ran. Each item reports its own success or failure.
    content:
      application/json:
        schema:
          $ref: models/data_plane.yml#/invoke_tools_response
        examples:
          succeeded:
            summary: A successful call
            value:
              total_count: 1
              success_count: 1
              error_count: 0
              results:
              - index: 0
                tool: exa_web_search
                version: '1'
                result:
                  status: succeeded
                  output:
                    provider: exa
                    results:
                    - title: DigitalOcean | Cloud Infrastructure for Developers
                      url: https://www.digitalocean.com/
                  call_id: call_8b7c6d5e-4f3a-4b2c-9d1e-0f9a8b7c6d5e
          cache_hit:
            summary: A cached result from a session opted into caching
            value:
              total_count: 1
              success_count: 1
              error_count: 0
              results:
              - index: 0
                tool: exa_web_search
                version: '1'
                result:
                  status: succeeded
                  output:
                    provider: exa
                    results:
                    - title: DigitalOcean
                      url: https://www.digitalocean.com/
                  call_id: call_8b7c6d5e-4f3a-4b2c-9d1e-0f9a8b7c6d5e
                  _meta:
                    cache:
                      status: HIT
                      age_seconds: 12
          requires_approval:
            summary: A call that needs approval
            value:
              total_count: 1
              success_count: 0
              error_count: 1
              results:
              - index: 0
                tool: exa_web_search
                version: '1'
                result:
                  status: failed
                  error:
                    class: execution_failed
                    message: >-
                      Tool "exa_web_search" requires user approval before it can run.
                      Ask the user to approve approval_id 7d3c2b1a-9e8f-4a6b-8c5d-4e3f2a1b0c9d
                      (expires 2026-10-09T18:30:00Z) using their own credentials, then call
                      the tool again with the same arguments.
                    retriable: true
                    recovery_hint: retry_later
                  call_id: call_8b7c6d5e-4f3a-4b2c-9d1e-0f9a8b7c6d5e
                  _meta:
                    status: requires_approval
                    approval_id: 7d3c2b1a-9e8f-4a6b-8c5d-4e3f2a1b0c9d
                    tool_name: exa_web_search
                    expires_at: '2026-10-09T18:30:00Z'
                    decide:
                      method: POST
                      path: /approvals/session/2b3c9f0e-1a4d-4e5f-8a7b-6c5d4e3f2a1b/7d3c2b1a-9e8f-4a6b-8c5d-4e3f2a1b0c9d
                      body: '{"decision": "approve"}'
  '400':
    $ref: data_plane_responses.yml#/bad_request
  '401':
    $ref: data_plane_responses.yml#/unauthorized
  '402':
    $ref: data_plane_responses.yml#/payment_required
  '403':
    $ref: data_plane_responses.yml#/forbidden
  '412':
    $ref: data_plane_responses.yml#/precondition_failed
  '413':
    $ref: data_plane_responses.yml#/payload_too_large
  '429':
    $ref: data_plane_responses.yml#/too_many_requests
  '500':
    $ref: data_plane_responses.yml#/server_error
  '503':
    $ref: data_plane_responses.yml#/service_unavailable
x-codeSamples:
- $ref: examples/curl/gatewayTools_run.yml
security:
- bearer_auth:
  - action_gateway:execute
