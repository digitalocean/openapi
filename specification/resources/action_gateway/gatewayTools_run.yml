operationId: gatewayTools_run
summary: Invoke Session Tools
description: >-
  Calls between 1 and 10 tools in parallel and returns one result per call, in request order. Get tool
  names and argument schemas from `POST /tools/search`. This is the REST form of the `action_invoke` MCP
  tool.


  Calls are independent: one failing does not fail the others, and the request returns 200 whenever it
  is well formed. Check `success_count` and `error_count`, then each item's `result.status`. A failed
  item's `result.error` says why. When `result._meta.status` is set, the call is paused rather than
  failed:


  - `requires_approval`: the session's policy requires a person to approve this call. Have them approve
  `result._meta.approval_id` with `POST /approvals/{approval_id}` before `result._meta.expires_at`, then
  call the tool again with exactly the same arguments. Each approval allows one call.

  - `requires_authorization`: the session's end user must connect the provider, for example through
  OAuth at `result._meta.connect_url`, before the call can run.

  - `requires_connection_configuration`: the end user's connection is missing required parameters.


  The whole request fails with 402 only if every call failed because your team must prepay.
tags:
- Action Gateway Data Plane
servers:
- url: "https://actions.do-ai.run"
  description: production
parameters:
- $ref: parameters.yml#/session_id_header
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: models/data_plane.yml#/gateway_invoke_request
      example:
        rationale: Find recent coverage of the product launch and file a follow-up issue.
        tools:
        - tool: exa_web_search
          arguments:
            query: DigitalOcean Action Gateway
            max_results: 1
        - tool: jira_create_issue
          arguments:
            project_key: SUP
            summary: Follow up on launch coverage
responses:
  '200':
    description: The calls ran. Each item's `result` reports its own outcome.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/data_plane.yml#/gateway_invoke_response
        example:
          total_count: 2
          success_count: 1
          error_count: 1
          results:
          - index: 0
            tool: exa_web_search
            version: v12
            result:
              status: succeeded
              output:
                data:
                  results:
                  - title: Action Gateway | DigitalOcean
                    url: https://www.digitalocean.com/products/action-gateway
              call_id: call_d2787206-50a7-483d-83ce-9ccabf469230
          - index: 1
            tool: jira_create_issue
            version: '1'
            result:
              status: failed
              error:
                class: execution_failed
                message: Tool "jira_create_issue" requires user approval before it can run. Ask the user
                  to approve approval_id 7d0c1e7a-3b2f-4c6e-9a51-2f4e8b9c0d13 (expires 2026-10-05T12:30:00Z)
                  using their own credentials, then call the tool again with the same arguments.
                retriable: true
                recovery_hint: retry_later
              call_id: call_352a52dd-d4ec-41ea-9c4c-bc5e46f0e674
              _meta:
                status: requires_approval
                approval_id: 7d0c1e7a-3b2f-4c6e-9a51-2f4e8b9c0d13
                tool_name: jira_create_issue
                expires_at: '2026-10-05T12:30:00Z'
                decide:
                  method: POST
                  path: /approvals/session/2b3c9f0e-1a4d-4e5f-8a7b-6c5d4e3f2a1b/7d0c1e7a-3b2f-4c6e-9a51-2f4e8b9c0d13
                  body: '{"decision": "approve"}'
  '400':
    $ref: data_plane_responses.yml#/bad_request
  '401':
    $ref: data_plane_responses.yml#/unauthorized
  '402':
    $ref: data_plane_responses.yml#/payment_required
  '403':
    $ref: data_plane_responses.yml#/forbidden
  '412':
    $ref: data_plane_responses.yml#/precondition_failed
  '413':
    $ref: data_plane_responses.yml#/payload_too_large
  '429':
    $ref: data_plane_responses.yml#/too_many_requests
  '500':
    $ref: data_plane_responses.yml#/server_error
  '503':
    $ref: data_plane_responses.yml#/service_unavailable
  default:
    $ref: data_plane_responses.yml#/unexpected_error
x-codeSamples:
- $ref: examples/curl/gatewayTools_run.yml
security:
- bearer_auth:
  - action_gateway:execute
