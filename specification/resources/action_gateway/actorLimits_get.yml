operationId: actorLimits_get
summary: Retrieve End User Limits
description: 'Retrieves the rate-limit overrides set for one end user and the limits that apply to them:
  each override, or your team''s limit where none is set.'
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/actor_id
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/actor_limits.yml#/get_actor_limits_response
        example:
          configured_limits:
          - category: LIMIT_CATEGORY_WEB_SEARCH_REQUESTS_PER_MINUTE
            requests_per_minute: '10'
          effective_limits:
            web_search_requests_per_minute: '10'
            web_fetch_requests_per_minute: '120'
            native_tool_calls_requests_per_minute: '600'
            non_native_tool_calls_requests_per_minute: '600'
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/actorLimits_get.yml
security:
- bearer_auth:
  - action_gateway:read
