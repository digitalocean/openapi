operationId: endpoints_get
summary: Retrieve an Endpoint
description: >-
  Returns an endpoint with its live head embedded. When no live versions remain,
  head_version is absent and the endpoint MCP URL fails closed until a version
  is published. An inaccessible endpoint returns 404 endpoint_not_found.
tags:
- Action Gateway
parameters:
- $ref: endpoint_parameters.yml#/endpoint_id
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/endpoints.yml#/endpoint_response
        examples:
          response:
            $ref: examples/endpoints.yml#/endpoint
          without_live_versions:
            $ref: examples/endpoints.yml#/empty_endpoint
  '400':
    $ref: ../../shared/responses/bad_request.yml
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '404':
    $ref: ../../shared/responses/not_found.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  'default':
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/endpoints_get.yml
security:
- bearer_auth:
  - action_gateway:read
