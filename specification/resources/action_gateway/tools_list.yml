operationId: tools_list
summary: List Tools
description: Lists active Action Gateway tools visible to the authenticated team.
tags:
  - Action Gateway
parameters:
  - name: toolkit_id
    in: query
    description: Filter tools by toolkit identifier.
    schema:
      type: string
    example: exa
  - $ref: ../../shared/parameters.yml#/page
  - $ref: ../../shared/parameters.yml#/per_page
responses:
  "200":
    description: Tools were retrieved successfully.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models.yml#/list_tools_response
  "401":
    $ref: ../../shared/responses/unauthorized.yml
  "429":
    $ref: ../../shared/responses/too_many_requests.yml
  "500":
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
security:
  - bearer_auth:
      - genai:read
