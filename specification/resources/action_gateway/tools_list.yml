operationId: tools_list
summary: List Tools
description: Lists released catalog tools visible to your team, one page at a time. Each page returns
  summary entries in `tools` and the matching full definitions, in the same order, in `definitions`.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/toolkit_id
- $ref: ../../shared/parameters.yml#/page
- $ref: parameters.yml#/tools_per_page
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/tools.yml#/list_tools_response
        example:
          version: v1
          tools:
          - name: web_search
            toolkitId: exa
            title: Web Search
            description: Search the public web with Exa and return relevant results with normalized text
              snippets.
            inputSchema: &id001
              type: object
              properties:
                query:
                  type: string
                  description: Search query string.
                max_results:
                  type: integer
                  description: Maximum number of search results to return.
              required:
              - query
            annotations: &id003
              title: Web Search
              readOnlyHint: true
              idempotentHint: true
              openWorldHint: true
              destructiveHint: false
            version: v1
            parallelizable: true
            streamingSafe: true
            outputSchema: &id002
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                provider:
                  type: string
                results:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      url:
                        type: string
                      text:
                        type: string
                      publishedDate:
                        type: string
            toolSlug: exa_web_search
          definitions:
          - toolId: tul_exa_web_search
            name: web_search
            toolkitId: exa
            title: Web Search
            description: Search the public web with Exa and return relevant results with normalized text
              snippets.
            inputSchema: *id001
            outputSchema: *id002
            annotations: *id003
            version: v1
            schemaVersion: '2026-07-01'
            status: active
            parallelizable: true
            streamingSafe: true
            auth:
              modes:
              - shared_key
              provider: exa
              scopes: []
              credentialBinding: ''
              credentialRefSource: do_managed
              doManagedCredentialRef: EXA_API_KEY
              injection:
                location: header
                name: x-api-key
                scheme: ''
              baseUrlResolution: null
              headerResolution: []
              teamApiKey: null
            execution:
              type: http
              adapterVersion: v1
              configRef: ''
              http:
                baseUrl: https://api.exa.ai
                path: /search
                method: POST
                allowedHosts:
                - api.exa.ai
                requestEncoding: json
                responseFormat: json
                allowed_host_suffixes: []
              mcp: null
            transform:
              language: gateway_mapping_v1
              input:
                adapter_request:
                  http:
                    method: POST
                    body:
                      query: $.input.query
                      numResults: $.input.max_results
                      type: auto
              output:
                result:
                  query: $.input.query
                  provider: exa
                  results: $.executor.output.body.results
            policy:
              permission: tools.exa.web_search
            reliability:
              timeoutMs: 15000
              maxOutputBytes: '2097152'
              retry:
                maxAttempts: 2
                backoff: ''
                retryOn:
                - rate_limited
                - timeout
                - upstream_error
                backoffPolicy: null
                honorRetryAfter: false
                replay: null
                billable: null
            hooks:
              usage:
                billable: true
                meters:
                - sku: siweb
                  unit: websearches
                  quantitySource: '1'
            classification:
              operation: read
              risk: low
              dataClasses:
              - public_web
            flipperName: ''
            tags: []
            toolSlug: exa_web_search
            providerKind: managed_api
          pagination:
            page: 1
            per_page: 100
            total: 1
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/tools_list.yml
security:
- bearer_auth:
  - action_gateway:read
