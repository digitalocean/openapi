operationId: tools_list
summary: List Tools
description: >-
  Returns one page of the tools your team can use: released catalog tools plus the enabled tools of your
  team's MCP servers. definitions[i] describes tools[i]. Offset-paged with page and `per_page`; an unknown
  `toolkitId` returns an empty page.
tags:
- Action Gateway
parameters:
- $ref: parameters.yml#/toolkit_id
- $ref: parameters.yml#/page_tools
- $ref: parameters.yml#/tools_per_page
responses:
  '200':
    description: The request was successful.
    headers:
      $ref: response_headers.yml
    content:
      application/json:
        schema:
          $ref: models/tools.yml#/list_tools_response
        example:
          version: v1
          tools:
          - name: web_search
            toolkitId: exa
            title: Web Search
            description: Search the public web with Exa and return relevant results with normalized text
              snippets.
            inputSchema: &id001
              type: object
              properties:
                query:
                  type: string
                  description: Search query string.
                max_results:
                  type: integer
                  description: Maximum number of search results to return.
              required:
              - query
            annotations: &id003
              title: Web Search
              readOnlyHint: true
              idempotentHint: true
              openWorldHint: true
              destructiveHint: false
            version: v1
            parallelizable: true
            streamingSafe: true
            outputSchema: &id002
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                provider:
                  type: string
                results:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      url:
                        type: string
                      text:
                        type: string
                      publishedDate:
                        type: string
            toolSlug: exa_web_search
          definitions:
          - toolId: tul_exa_web_search
            name: web_search
            toolkitId: exa
            title: Web Search
            description: Search the public web with Exa and return relevant results with normalized text
              snippets.
            inputSchema: *id001
            outputSchema: *id002
            annotations: *id003
            version: v1
            auth:
              modes:
              - shared_key
              provider: exa
              scopes: []
            toolSlug: exa_web_search
            providerKind: managed_api
          pagination:
            page: 1
            per_page: 100
            total: 1
  '401':
    $ref: ../../shared/responses/unauthorized.yml
  '429':
    $ref: ../../shared/responses/too_many_requests.yml
  '500':
    $ref: ../../shared/responses/server_error.yml
  default:
    $ref: ../../shared/responses/unexpected_error.yml
x-codeSamples:
- $ref: examples/curl/tools_list.yml
security:
- bearer_auth:
  - action_gateway:read
