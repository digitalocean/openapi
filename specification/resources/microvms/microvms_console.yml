operationId: microvms_get_console

summary: Open a console in a MicroVM

description: |
  To open an interactive `/bin/sh` console in a MicroVM's workload container, open a
  WebSocket connection to `wss://api.digitalocean.com/v2/microvms/{microvm_id}/console`.

  Send the API token in the `Authorization` header of the handshake. Browsers cannot set this
  header, so you cannot open the console from browser JavaScript. The image must include
  `/bin/sh`. A MicroVM can have four consoles open at a time. If the MicroVM is paused and
  auto-resume is on, opening a console resumes it.

tags:
  - MicroVMs [Public Preview]

parameters:
  - $ref: 'parameters.yml#/microvm_id'
  - $ref: 'parameters.yml#/console_rows'
  - $ref: 'parameters.yml#/console_cols'

responses:
  '101':
    $ref: 'responses/console_upgrade.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/microvms_console.yml'

security:
  - bearer_auth:
      - 'microvm:update'
