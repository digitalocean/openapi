operationId: microvmURLs_create

summary: Add a URL to a MicroVM

description: |
  To add a public URL to a MicroVM, send a POST request to
  `/v2/microvms/{microvm_id}/urls`.

  The URL routes to `port`, which must be one of the ports declared at create;
  the MicroVM's port set cannot change. The call returns once the URL is
  recorded; its `status` is `PENDING` until the route is published.

  The MicroVM must be running or paused. A MicroVM can have at most 10 URLs,
  the default one included.

tags:
  - MicroVMs

parameters:
  - $ref: 'parameters.yml#/microvm_id'

requestBody:
  required: false
  content:
    application/json:
      schema:
        $ref: 'models/microvm_url_create.yml'

responses:
  '201':
    $ref: 'responses/microvm_url.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/microvms_urls_add.yml'

security:
  - bearer_auth:
      - 'microvm:update'
