operationId: microvms_list

summary: List all MicroVMs

description: |
  To list all of the MicroVMs on your team, send a GET request to `/v2/microvms`.

  The `region`, `name`, and `tag_name` filters combine with AND.

tags:
  - MicroVMs [Public Preview]

parameters:
  - $ref: '../../shared/parameters.yml#/page'
  - $ref: 'parameters.yml#/microvm_per_page'
  - $ref: 'parameters.yml#/microvm_region'
  - $ref: 'parameters.yml#/name'
  - $ref: 'parameters.yml#/tag_name'

responses:
  '200':
    $ref: 'responses/all_microvms.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/microvms_list.yml'

security:
  - bearer_auth:
      - 'microvm:read'
