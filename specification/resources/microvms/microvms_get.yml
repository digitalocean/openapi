operationId: microvms_get

summary: Retrieve a MicroVM

description: |
  To show information about a MicroVM, send a GET request to `/v2/microvms/{microvm_id}`.

  The endpoint is in the `urls` entry with `default` set to `true`. Its `hostname` is empty
  and its `status` is `PENDING` until provisioning finishes.

tags:
  - MicroVMs [Public Preview]

parameters:
  - $ref: 'parameters.yml#/microvm_id'

responses:
  '200':
    $ref: 'responses/microvm.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/microvms_get.yml'

security:
  - bearer_auth:
      - 'microvm:read'
