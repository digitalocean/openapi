operationId: microvms_run_command

summary: Run a command in a MicroVM

description: |
  To run a command in a MicroVM's workload container, send a POST request to
  `/v2/microvms/{microvm_id}/exec`.

  `argv` runs directly, not through a shell, with standard input closed. If the MicroVM is
  paused and auto-resume is on, the request resumes it and waits until it is running.

  A command has 60 seconds to finish. Your team can run 32 commands at once and 60 commands
  per minute. Rejected requests count toward the per-minute limit.

tags:
  - MicroVMs [Public Preview]

parameters:
  - $ref: 'parameters.yml#/microvm_id'

requestBody:
  required: true

  content:
    application/json:
      schema:
        $ref: 'models/exec.yml#/exec_request'

      examples:
        Run a Command:
          value:
            argv:
              - nginx
              - -v

        Run a Shell Pipeline:
          value:
            argv:
              - sh
              - -c
              - ls /usr/share/nginx/html | wc -l

responses:
  '200':
    $ref: 'responses/exec.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '403':
    $ref: 'responses/errors.yml#/forbidden'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  '502':
    $ref: 'responses/errors.yml#/bad_gateway'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/microvms_exec.yml'

security:
  - bearer_auth:
      - 'microvm:update'
