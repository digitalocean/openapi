operationId: microvmCheckpoints_get

summary: Retrieve a checkpoint

description: |
  To show information about a checkpoint, send a GET request to
  `/v2/microvms/checkpoints/{checkpoint_id}`.

tags:
  - MicroVMs [Public Preview]

parameters:
  - $ref: 'parameters.yml#/checkpoint_id'

responses:
  '200':
    $ref: 'responses/checkpoint.yml'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/microvms_checkpoints_get.yml'

security:
  - bearer_auth:
      - 'microvm:read'
