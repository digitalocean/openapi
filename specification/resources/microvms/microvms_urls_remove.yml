operationId: microvmURLs_delete

summary: Remove a URL from a MicroVM

description: |
  To remove a public URL from a MicroVM, send a DELETE request to
  `/v2/microvms/{microvm_id}/urls/{url_id}`. The URL stops serving traffic.
  The system default URL cannot be removed.

  A successful request returns a `204 No Content` status code.

tags:
  - MicroVMs

parameters:
  - $ref: 'parameters.yml#/microvm_id'
  - $ref: 'parameters.yml#/url_id'

responses:
  '204':
    $ref: '../../shared/responses/no_content.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/microvms_urls_remove.yml'

security:
  - bearer_auth:
      - 'microvm:update'
