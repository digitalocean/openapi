microvm_id:
  in: path
  name: microvm_id
  description: The unique ID of the MicroVM.
  required: true
  schema:
    type: string
    format: uuid
  example: 01a0ef1a-d873-793d-ae6a-5dd6239be62a

url_id:
  in: path
  name: url_id
  description: The unique ID of the URL, from the MicroVM's `urls` list.
  required: true
  schema:
    type: string
    format: uuid
  example: 3f6c1a2b-9d4e-5f70-8a1b-2c3d4e5f6a7b

token_id:
  in: path
  name: token_id
  description: The unique ID of the access token, from the list.
  required: true
  schema:
    type: string
    format: uuid
  example: 4f6a1c2e-9d3b-4e7a-8f10-2b5c7d9e1a33

checkpoint_id:
  in: path
  name: checkpoint_id
  description: The unique ID of the checkpoint.
  required: true
  schema:
    type: string
    format: uuid
  example: 01a0ed98-0a74-75dd-a625-e4856adbc298

microvm_region:
  in: query
  name: region
  required: false
  description: Only return MicroVMs in this region.
  schema:
    type: string
  example: mkc1

name:
  in: query
  name: name
  required: false
  description: >-
    Only return MicroVMs whose name contains this substring
    (case-insensitive).
  schema:
    type: string
  example: example-microvm

tag_name:
  in: query
  name: tag_name
  required: false
  description: >-
    Only return MicroVMs with this tag. A tag that matches no MicroVMs returns
    an empty list.
  schema:
    type: string
  example: example

microvm_id_filter:
  in: query
  name: microvm_id
  required: false
  description: Only return checkpoints taken from this MicroVM.
  schema:
    type: string
    format: uuid
  example: 01a0ef1a-d873-793d-ae6a-5dd6239be62a

console_rows:
  in: query
  name: rows
  required: false
  description: The initial number of terminal rows.
  schema:
    type: integer
    minimum: 1
    maximum: 65535
    default: 24
  example: 24

console_cols:
  in: query
  name: cols
  required: false
  description: The initial number of terminal columns.
  schema:
    type: integer
    minimum: 1
    maximum: 65535
    default: 80
  example: 80

file_path:
  in: query
  name: path
  required: true
  description: The absolute path of the file inside the workload container.
  schema:
    type: string
  example: /app/config.json

file_mode:
  in: query
  name: mode
  required: false
  description: >-
    The octal permission bits for the file, from `0001` to `0777`. Defaults to
    `0644`. Setuid, setgid, sticky bits, and `0000` are rejected.
  schema:
    type: string
  example: "0600"

file_uid:
  in: query
  name: uid
  required: false
  description: >-
    The owner user ID. Set it together with `gid`. Defaults to the workload
    container's user.
  schema:
    type: integer
    format: uint32
  example: 1000

file_gid:
  in: query
  name: gid
  required: false
  description: >-
    The owner group ID. Set it together with `uid`. Defaults to the workload
    container's group.
  schema:
    type: integer
    format: uint32
  example: 1000

file_sha256:
  in: query
  name: sha256
  required: false
  description: >-
    The lowercase hex SHA-256 of the request body. When set, the API verifies
    the content before it replaces the target. A mismatch returns 422 and
    leaves the existing file unchanged.
  schema:
    type: string
  example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

microvm_per_page:
  in: query
  name: per_page
  required: false
  description: Number of items returned per page.
  schema:
    type: integer
    minimum: 1
    default: 25
    maximum: 200
  example: 25
