type: object

description: >-
  An outbound allow list. A destination that matches any rule is allowed;
  `default_action` decides every other destination. Only valid with `public`
  networking, and fixed at create: there is no way to change it later. With a
  policy set, direct connections out of the MicroVM are dropped; only HTTP and
  HTTPS through the platform proxy to the allowed destinations works, so
  clients must honor the injected `HTTP_PROXY` / `HTTPS_PROXY` environment.
  The registries needed to pull the workload image are allowed automatically.
  On a MicroVM this is the policy set at create, exactly as supplied. On a
  checkpoint it is the policy a restored MicroVM inherits; a restore cannot
  change it. Omitted when egress is unrestricted.

properties:
  default_action:
    type: string
    enum:
      - deny
      - allow
    default: deny
    description: >-
      What to do with a destination no rule matches. `deny` refuses it (an
      HTTP request gets a 403 and a TLS connection is closed).
    example: deny

  rules:
    type: array
    maxItems: 50
    description: >-
      The destinations to allow. Rules match the host only: port, path, and
      method are not considered, and a hostname that resolves to an IP is not
      matched by an `ip` rule. Each rule sets exactly one of `domain` or `ip`.
    items:
      type: object
      properties:
        domain:
          type: string
          description: >-
            An exact host such as `api.example.com`, or a wildcard such as
            `*.example.com`.
          example: api.example.com
        ip:
          type: string
          description: An exact IP address. CIDR ranges are not supported.
          example: 203.0.113.5

  credentials:
    type: array
    maxItems: 16
    description: >-
      Credentials the platform adds to outbound requests, so the workload
      never holds them. Settable only at create, and only in regions that
      support credential injection. Each host must be allowed by a rule (or
      `default_action` must be `allow`). HTTPS requests to these hosts are
      intercepted so the credential can be attached; clients that pin
      certificates will fail on them. The credential is sent in the
      `authorization` header. Credentials cannot be set when restoring a
      checkpoint: the restored MicroVM inherits the origin's. Never returned
      in responses.
    items:
      type: object
      required:
        - host
        - secret
      properties:
        host:
          type: string
          description: An exact host. Wildcards and IP addresses are not allowed.
          example: api.example.com
        path_prefix:
          type: string
          description: >-
            Only requests whose path starts with this prefix get the
            credential. Must start with `/`. Defaults to every path.
          example: /v1
        scheme:
          type: string
          enum:
            - bearer
            - raw
          default: bearer
          description: >-
            How the value is sent. `bearer` sends `Bearer <secret>`; `raw`
            sends the secret as is.
          example: bearer
        secret:
          type: string
          writeOnly: true
          maxLength: 8192
          description: >-
            The credential value. It is stored in a secrets vault, never
            returned by the API, and cannot be read back.
          example: s3cr3t-t0k3n
