exec_request:
  type: object

  description: >-
    A command to run in the MicroVM's workload container. The command runs
    directly, not through a shell. To use pipes, redirects, or environment
    variables, run it with `sh -c`. The request body can be up to 1 MiB.

  properties:
    argv:
      type: array
      minItems: 1
      items:
        type: string
      description: The command and its arguments.
      example:
        - nginx
        - -v

    cwd:
      type: string
      description: The working directory to run the command in.
      example: /usr/share/nginx/html

    output_encoding:
      type: string
      enum:
        - utf-8
        - base64
      default: utf-8
      description: >-
        How `stdout` and `stderr` are returned. `utf-8` (the default) is a
        JSON string; bytes that are not valid UTF-8 become U+FFFD. `base64`
        returns the exact bytes. Use `base64` when the command may emit
        binary output.
      example: utf-8

  required:
    - argv

exec_response:
  type: object

  description: >-
    The result of a command. The command has 60 seconds to finish. Combined
    `stdout` and `stderr` are limited to 4 MiB.

  properties:
    stdout:
      type: string
      description: >-
        The command's standard output. A UTF-8 string when `output_encoding`
        is `utf-8`; standard Base64 when it is `base64`.
      example: ""

    stderr:
      type: string
      description: >-
        The command's standard error. A UTF-8 string when `output_encoding`
        is `utf-8`; standard Base64 when it is `base64`.
      example: "nginx version: nginx/1.29.1\n"

    output_encoding:
      type: string
      enum:
        - utf-8
        - base64
      description: >-
        The encoding of `stdout` and `stderr`, echoing the request's
        `output_encoding` (or the `utf-8` default).
      example: utf-8

    exit_code:
      type: integer
      description: The command's exit code.
      example: 0

    truncated:
      type: boolean
      description: >-
        Present and `true` when the output exceeded 4 MiB and was cut off.
      example: false
