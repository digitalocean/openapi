description: >-
  The response will be a JSON object with a key called `access_token`. The
  `token` value is shown once, in this response only.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      type: object
      properties:
        access_token:
          allOf:
            - $ref: '../models/microvm_access_token.yml'
            - type: object
              properties:
                token:
                  type: string
                  description: >-
                    The token value. Use it as a bearer token against the
                    MicroVM's endpoint. Shown once, in this response only.
                  example: dop_v1_2f8e1c3a9b4d6e7f8a0b1c2d3e4f5a6b7c91
              required:
                - token

    examples:
      Created access token:
        value:
          access_token:
            id: 4f6a1c2e-9d3b-4e7a-8f10-2b5c7d9e1a33
            micro_vm_id: 01a0ef1a-d873-793d-ae6a-5dd6239be62a
            name: alice-workspace
            created_at: "2026-10-21T14:02:11Z"
            expires_at: "2026-11-20T14:02:11Z"
            token: dop_v1_2f8e1c3a9b4d6e7f8a0b1c2d3e4f5a6b7c91
