description: >-
  The response will be a JSON object with a key called `access_tokens`. The
  value will be an array of access token objects, oldest first. Token values
  are never returned.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      type: object
      properties:
        access_tokens:
          type: array
          items:
            $ref: '../models/microvm_access_token.yml'

    examples:
      Access tokens:
        value:
          access_tokens:
            - id: 4f6a1c2e-9d3b-4e7a-8f10-2b5c7d9e1a33
              micro_vm_id: 01a0ef1a-d873-793d-ae6a-5dd6239be62a
              name: alice-workspace
              created_at: "2026-10-21T14:02:11Z"
              expires_at: "2026-11-20T14:02:11Z"
