operationId: microvms_post_resume

summary: Resume a MicroVM

description: |
  To resume a paused MicroVM, send a POST request to `/v2/microvms/{microvm_id}/resume`.

  The request returns when the change completes. Resuming a MicroVM that is already running
  succeeds. The request returns HTTP 400 when the MicroVM is `creating`, `terminated`, or
  `failed`.

tags:
  - MicroVMs [Public Preview]

parameters:
  - $ref: 'parameters.yml#/microvm_id'

responses:
  '200':
    $ref: 'responses/microvm.yml'

  '400':
    $ref: 'responses/errors.yml#/bad_request'

  '401':
    $ref: '../../shared/responses/unauthorized.yml'

  '404':
    $ref: 'responses/errors.yml#/not_found'

  '429':
    $ref: '../../shared/responses/too_many_requests.yml'

  '500':
    $ref: '../../shared/responses/server_error.yml'

  default:
    $ref: '../../shared/responses/unexpected_error.yml'

x-codeSamples:
  - $ref: 'examples/curl/microvms_resume.yml'

security:
  - bearer_auth:
      - 'microvm:update'
