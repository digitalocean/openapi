name: Agent Detection PR
# Validates the shared agent detection rules before they are synced to the SDKs.
# Also called by trigger-agent-detection-sync.yml before it starts the syncs.

on:
  pull_request:
    paths:
      - 'agents/**'
      - 'tests/agent-detection.test.cjs'
      - '.github/workflows/agent-detection.pr.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent detection rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Validate rules and test cases
        run: npm run test:agent-detection
